		function scoreTone(score) {
			if (score >= 70) {
				return {
					text: '高危',
					ring: '#ff5d7d',
					glow: 'shadow-[0_0_45px_rgba(255,93,125,0.25)]',
					chip: 'bg-red-500/15 text-red-200 border-red-400/30',
					bar: 'from-red-400 to-pink-500',
				};
			}
			if (score >= 45) {
				return {
					text: '警惕',
					ring: '#ffcb57',
					glow: 'shadow-[0_0_45px_rgba(255,203,87,0.2)]',
					chip: 'bg-amber-400/15 text-amber-100 border-amber-300/30',
					bar: 'from-amber-300 to-orange-400',
				};
			}
			return {
				text: '安全',
				ring: '#53f0a2',
				glow: 'shadow-[0_0_45px_rgba(83,240,162,0.18)]',
				chip: 'bg-emerald-400/15 text-emerald-100 border-emerald-300/30',
				bar: 'from-emerald-300 to-teal-400',
			};
		}

		function normalizeStockData(payload) {
			if (!payload || !Array.isArray(payload.stocks)) {
				return null;
			}

			const records = payload.stocks
				.filter((item) => item && item.code)
				.map((item) => {
					const purityScore = Math.round(item.metrics?.business_purity_score ?? 0);
					const turnoverScore = Math.round(item.metrics?.turnover_heat_score ?? 0);
					const financingScore = Math.round(item.metrics?.financing_pressure_score ?? 0);

					return {
						code: item.code,
						name: item.name || item.code,
						score: Math.round(item.trap_score ?? 0),
						marginDate: item.margin_date || '-',
						metrics: item.metrics || {},
						dims: [
							{ label: '板块主营相关度', value: purityScore },
							{ label: '高频诱多 / 砸盘频率', value: turnoverScore },
							{ label: '两融杠杆压力', value: financingScore },
						],
					};
				});

			return {
				generatedAt: payload.generated_at || '',
				dataFreshness: normalizeDataFreshness(payload.data_freshness),
				formula: normalizeFormula(payload.formula),
				runSource: payload.run_source || '',
				dailyWarning: normalizeWarningEntry(payload.daily_warning),
				warningHistory: normalizeWarningHistory(payload.warning_history, payload.daily_warning),
				stocks: records,
			};
		}

		function normalizeFormula(formula) {
			if (!formula || typeof formula !== 'object') {
				return fallbackFormula;
			}

			return {
				business_purity_weight: Number(formula.business_purity_weight ?? fallbackFormula.business_purity_weight),
				financing_pressure_weight: Number(formula.financing_pressure_weight ?? fallbackFormula.financing_pressure_weight),
				turnover_heat_weight: Number(formula.turnover_heat_weight ?? fallbackFormula.turnover_heat_weight),
				financing_pressure_rule: formula.financing_pressure_rule || fallbackFormula.financing_pressure_rule,
				incremental_financing_rule: formula.incremental_financing_rule || fallbackFormula.incremental_financing_rule,
				margin_burden_rule: formula.margin_burden_rule || fallbackFormula.margin_burden_rule,
				turnover_heat_rule: formula.turnover_heat_rule || fallbackFormula.turnover_heat_rule,
				gauge_score_rule: formula.gauge_score_rule || fallbackFormula.gauge_score_rule,
				watch_ranking_rule: formula.watch_ranking_rule || fallbackFormula.watch_ranking_rule,
			};
		}

		function normalizeDataFreshness(freshness) {
			if (!freshness || typeof freshness !== 'object') {
				return {
					warningTargetDate: '',
					spotSnapshotAt: '',
					marginDataAsOf: '',
					marketPhase: '',
				};
			}

			return {
				warningTargetDate: freshness.warning_target_date || '',
				spotSnapshotAt: freshness.spot_snapshot_at || '',
				marginDataAsOf: freshness.margin_data_as_of || '',
				marketPhase: freshness.market_phase || '',
			};
		}

		function normalizeSignals(signals) {
			if (!Array.isArray(signals)) {
				return [];
			}

			const labelMap = {
				'高频异动': '高风险个股数量',
				'筹码拥挤': '整体追高热度',
				'两融升温': '杠杆资金压力',
			};

			return signals.map((signal) => ({
				...signal,
				label: labelMap[signal?.label] || signal?.label || '未命名信号',
			}));
		}

		function normalizeWarningSummary(summary) {
			if (!summary || typeof summary !== 'object') {
				return {};
			}

			return {
				...summary,
				avg_trap_score: Number(summary.avg_trap_score ?? 0),
				high_risk_count: Number(summary.high_risk_count ?? 0),
				high_risk_ratio: Number(summary.high_risk_ratio ?? 0),
				watch_count: Number(summary.watch_count ?? 0),
				watch_ratio: Number(summary.watch_ratio ?? 0),
				top_cohort_size: Number(summary.top_cohort_size ?? 0),
				top_cohort_avg_trap_score: Number(summary.top_cohort_avg_trap_score ?? 0),
				concentration_spread: Number(summary.concentration_spread ?? 0),
				top_financing_pressure_score: Number(summary.top_financing_pressure_score ?? 0),
				top_stock_name: summary.top_stock_name || '',
				window_value: summary.window_value || '',
				window_basis: summary.window_basis || '',
			};
		}

		function normalizeWarningEntry(entry) {
			if (!entry) {
				return null;
			}

			return {
				date: entry.date || '',
				title: entry.title || '暂无预警标题',
				gauge_score: Math.round(entry.gauge_score ?? 0),
				prompt: entry.prompt || fallbackPrompt,
				summary: normalizeWarningSummary(entry.summary),
				rankings: normalizeWarningRankings(entry.rankings),
				signals: normalizeSignals(entry.signals),
				warnings: Array.isArray(entry.warnings) ? entry.warnings : [],
				strategy: entry.strategy || '',
				review: entry.review || { status: '待复盘', note: '' },
			};
		}

		function normalizeWarningRankings(rankings) {
			if (!rankings || typeof rankings !== 'object') {
				return null;

			const normalizeList = (list, kind) => {
				if (!Array.isArray(list)) {
					return [];
				}

				return list
					.filter((item) => item && item.code)
					.map((item) => ({
						code: item.code,
						name: item.name || item.code,
						score: Math.round(item.score ?? 0),

		function parseTimestampAsBeijing(value) {
			if (!value) {

			const normalized = String(value).trim();
			if (!normalized) {

			}

			const explicitTimezoneMatch = /(?:Z|[+-]\d{2}:?\d{2})$/i.test(normalized);
			const naiveIsoMatch = normalized.match(/^(\d{4}-\d{2}-\d{2})[T\s](\d{2}:\d{2})(?::(\d{2}))?$/);

			if (naiveIsoMatch && !explicitTimezoneMatch) {
				return {
					date: new Date(`${naiveIsoMatch[1]}T${naiveIsoMatch[2]}${naiveIsoMatch[3] ? `:${naiveIsoMatch[3]}` : ''}Z`),
					includeSeconds: Boolean(naiveIsoMatch[3]),
				};
			}

			const parsed = new Date(normalized);
			if (Number.isNaN(parsed.getTime())) {
				return null;
			}

			return {
				date: parsed,
				includeSeconds: /:\d{2}(?:$|Z|[+-]\d{2}:?\d{2}$)/.test(normalized),

				const start = displayScoreRef.current;
				const end = score;

				if (start === end) {
					setDisplayScore(end);
					return undefined;
				}

				const duration = 1000;
				const startTime = performance.now();
				let frameId = 0;

				function tick(now) {
					const progress = Math.min((now - startTime) / duration, 1);
					const easedProgress = 1 - Math.pow(1 - progress, 3);
					const nextScore = Math.round(start + (end - start) * easedProgress);

					displayScoreRef.current = nextScore;
					setDisplayScore(nextScore);

					if (progress < 1) {
						frameId = requestAnimationFrame(tick);
					}
				}

				frameId = requestAnimationFrame(tick);

				return () => {
					cancelAnimationFrame(frameId);
				};

				lateMorningText = '到了午前，前排和后排大概率会继续拉开。能留下来的主要还是前排核心，那些不是龙头、只是跟着涨的票一旦转弱，就当成资金开始撤了；真正还能买的，也只剩重新放量站稳的前排核心。';
			} else if (highRiskCount >= 8 && watchRatio >= 0.3) {
				lateMorningText = '到了午前，市场大概率会继续筛票。还能站在开盘价上方的继续看，已经明显走弱的就不要再硬扛；想买就等筛完之后还站得住的那几只。';
			} else if (highRiskRatio >= 0.08 || watchRatio >= 0.28) {
				lateMorningText = '到了午前，重点就是留下强的、避开弱的。还能稳住的继续看，已经掉到开盘价下方的先当成风险；要试错，也尽量等重新站回来的那一下。';
			} else {
				lateMorningText = '到了午前，先看强票是否继续站得住，再决定要不要跟，不需要太早下重手；确认站稳后的回踩，比开盘直接追进去更像买点。';
			}

			return {
				headline: openingLead,
				credibilityLabel,
				closingNote: disciplineLead,
				segments: [
					{ label: '09:30 - 09:50', title: '开盘观察段', text: openSlotText },
					{ label: `${riskStart} - ${riskEnd}`, title: '风险放大段', text: riskSlotText },
					{ label: `${riskEnd} - 11:30`, title: '午前确认段', text: lateMorningText },
				],
			};
		}

		function reviewTone(review) {
			if (isReviewSuccessful(review)) {
				return {
					label: '这次判断对了',
					className: 'border-emerald-300/30 bg-emerald-400/15 text-emerald-100',
				};
			}
			if (isReviewFailure(review)) {
				return {
					label: '这次判断错了',
					className: 'border-red-300/30 bg-red-400/15 text-red-100',
				};
			}
			return {
				label: review?.status || '待复盘',
				className: 'border-white/10 bg-white/5 text-slate-200',
			};
		}

		function windowReviewTone(windowReview) {
			const status = String(windowReview?.status || '').trim();
			if (status === '时段命中') {
				return {
					label: '时段命中',
					className: 'border-cyanGlow/30 bg-cyanGlow/15 text-cyanGlow',
				};
			}
			if (status === '时段未命中') {
				return {
					label: '时段未命中',
					className: 'border-amber-300/30 bg-amber-400/15 text-amber-100',
				};
			}
			if (status === '时段待补') {
				return {
					label: '时段待补',
					className: 'border-slate-300/20 bg-white/5 text-slate-200',
				};
			}
			return {
				label: status || '时段未验证',
				className: 'border-white/10 bg-white/5 text-slate-200',
			};
		}

		function buildHistoryStats(history) {
			const records = Array.isArray(history) ? history : [];
			const reviewed = records.filter((entry) => {
				return isReviewSuccessful(entry?.review) || isReviewFailure(entry?.review);
			});
			const reviewedWindows = records.filter((entry) => {
				const status = String(entry?.review?.window_review?.status || '').trim();
				return status === '时段命中' || status === '时段未命中';
			});
			const success = reviewed.filter((entry) => isReviewSuccessful(entry?.review)).length;
			const failure = reviewed.filter((entry) => isReviewFailure(entry?.review)).length;
			const windowHit = reviewedWindows.filter((entry) => String(entry?.review?.window_review?.status || '').trim() === '时段命中').length;
			const windowMiss = reviewedWindows.filter((entry) => String(entry?.review?.window_review?.status || '').trim() === '时段未命中').length;
			const pending = Math.max(records.length - reviewed.length, 0);
			const successRate = reviewed.length > 0 ? Math.round((success / reviewed.length) * 100) : null;
			const windowHitRate = reviewedWindows.length > 0 ? Math.round((windowHit / reviewedWindows.length) * 100) : null;

			return {
				total: records.length,
				reviewed: reviewed.length,
				success,
				failure,
				pending,
				successRate,
				windowReviewed: reviewedWindows.length,
				windowHit,
				windowMiss,
				windowHitRate,
				latestWindowRepeatStreak: buildRepeatStreak(records, (entry) => getWindowValue(entry)),
				latestTitleRepeatStreak: buildRepeatStreak(records, (entry) => entry?.title || entry?.prompt || ''),
			};
		}

		function buildDailyFocus(warning, previousWarning, gaugeScore, historyStats) {
			const summary = warning?.summary || {};
			const riskLevel = scoreTone(gaugeScore).text;
			const topStockName = String(summary.top_stock_name || '').trim() || '高分前排';
			const highRiskCount = Number(summary.high_risk_count ?? 0);
			const watchCount = Number(summary.watch_count ?? 0);
			const highRiskRatio = Number(summary.high_risk_ratio ?? 0);
			const topFinancingPressureScore = Number(summary.top_financing_pressure_score ?? 0);
			const windowValue = getWindowValue(warning) || '10:05 - 10:40';
			const { start: windowStart, end: windowEnd } = extractTimeWindow(windowValue, '10:05', '10:40');
			const windowLabel = `${windowStart} - ${windowEnd}`;
			const discipline = getWarningValue(warning, '执行纪律')
				|| '别追一致性，优先等第一次回踩承接。';
			const previousSummary = previousWarning?.summary || {};
			const previousGaugeScore = Number(previousWarning?.gauge_score ?? NaN);
			const previousWindowValue = getWindowValue(previousWarning) || '';
			const gaugeDelta = Number.isFinite(previousGaugeScore) ? gaugeScore - previousGaugeScore : null;
			const highRiskDelta = previousWarning ? highRiskCount - Number(previousSummary.high_risk_count ?? 0) : null;

			let evidenceText = `${riskLevel}环境，高风险样本 ${highRiskCount} 只，观察样本 ${watchCount} 只。`;
			if (topFinancingPressureScore >= 90) {
				evidenceText += `${topStockName} 这类前排票的杠杆压力已经很高，更适合当风险信号，不适合当追价理由。`;
			} else if (highRiskRatio >= 0.1) {
				evidenceText += '今天真正该防的是拥挤交易，不是单纯去背某个时段。';
			} else {
				evidenceText += '今天更像是先确认承接，再决定是否参与。';
			}

			let changeText = '历史样本不足，暂时无法判断风险是在升温还是降温。';
			if (previousWarning) {
				const sameWindow = previousWindowValue && previousWindowValue === windowValue;
				const sameRiskBand = gaugeDelta !== null && Math.abs(gaugeDelta) <= 2;
				const sameRiskCount = highRiskDelta !== null && Math.abs(highRiskDelta) <= 1;

				if (sameWindow && sameRiskBand && sameRiskCount) {
					changeText = '和上一期相比变化不大，今天没有足够的新信息支持更激进的判断。';
				} else {
					const parts = [];
					if (gaugeDelta !== null && Math.abs(gaugeDelta) > 0) {
						parts.push(`风险温度 ${gaugeDelta > 0 ? '上升' : '下降'} ${Math.abs(gaugeDelta)} 分`);
					}
					if (highRiskDelta !== null && Math.abs(highRiskDelta) > 0) {
						parts.push(`高风险样本 ${highRiskDelta > 0 ? '增加' : '减少'} ${Math.abs(highRiskDelta)} 只`);
					}
					if (previousWindowValue && previousWindowValue !== windowValue) {
						parts.push(`风险窗口改成 ${windowValue}`);
					}
					changeText = parts.length > 0
						? `相较上一期，${parts.join('，')}。`
						: '今天和上一期只有细微变化，仍然要以盘中承接验证为主。';
				}
			}

			const reviewContext = historyStats?.windowReviewed > 0
				? `时段判断单独复盘 ${historyStats.windowReviewed} 次，命中 ${historyStats.windowHit} 次。`
				: `现有 ${historyStats?.reviewed || 0} 次复盘只记录了大方向，尚未单独验证具体时段。`;

			return [
				{
					eyebrow: '',
					title: '风险依据',
					text: `${evidenceText}${changeText}`,
				},
				{
					eyebrow: '',
					title: '盘中怎么确认',
					text: `${windowLabel} 只作为观察窗口。强票跌破开盘价或分时均线、反抽又没有量，才算风险得到确认。`,
				},
				{
					eyebrow: '',
					title: '这条判断何时作废',
					text: `若 ${windowEnd} 前，前排核心回踩后重新放量站稳，且板块同步走强，就撤销“冲高回落”假设。${reviewContext}`,
				},
			];
		}

		function buildFreshnessSummary(currentWarning, previousWarning, historyStats) {
			const repeatStreak = Number(historyStats?.latestWindowRepeatStreak ?? 0);
			if (repeatStreak >= 3) {
				return {
					value: '偏少',
					note: `同一风险窗口连续 ${repeatStreak} 天`,
				};
			}

			if (!previousWarning) {
				return {
					value: '首日',
					note: '需要更多历史样本对比',
				};
			}

			const currentWindow = getWindowValue(currentWarning);
			const previousWindow = getWindowValue(previousWarning);
			const currentRiskCount = Number(currentWarning?.summary?.high_risk_count ?? 0);
			const previousRiskCount = Number(previousWarning?.summary?.high_risk_count ?? 0);

			if (currentWindow && previousWindow && currentWindow !== previousWindow) {
				return {
					value: '有变化',
					note: `风险窗口改为 ${currentWindow}`,
				};
			}

			if (Math.abs(currentRiskCount - previousRiskCount) >= 2) {
				return {
					value: '有变化',
					note: `高风险样本 ${previousRiskCount} -> ${currentRiskCount}`,
				};
			}

			return {
				value: '一般',
				note: '和上一期差异不大',
			};
		}

		function buildMicroRankings(stocks, warning) {
			const summary = warning?.summary || {};
			const focusCode = String(summary.top_stock_code || '').trim();
			const riskPivot = Number(warning?.gauge_score ?? summary.gauge_score ?? 55);
			const breakoutCenter = Math.min(58, Math.max(46, riskPivot - 2));
			const exportedEnvironment = summary.breakout_environment || null;

			const trendSamples = (Array.isArray(stocks) ? stocks : [])
				.map((stock) => ensureStockShape(stock)?.trend)
				.filter((trend) => trend && trend.available);
			const fallbackEnvironment = (() => {
				if (trendSamples.length < 4) {
					return { state: 'neutral', score_multiplier: 1, min_return_3d_pct: 0, max_ma5_gap_pct: -2.5 };
				}
				const positiveRatio = trendSamples.filter((trend) => Number(trend.return_3d_pct ?? 0) >= 1 && Number(trend.ma5_gap_pct ?? 0) >= -1).length / trendSamples.length;
				const weakRatio = trendSamples.filter((trend) => Number(trend.return_5d_pct ?? 0) <= -4 || Number(trend.ma5_gap_pct ?? 0) <= -3).length / trendSamples.length;
				if (riskPivot >= 66 || weakRatio >= 0.5) {
					return { state: 'tight', score_multiplier: 0.88, min_return_3d_pct: 1, max_ma5_gap_pct: -1 };
				}
				if (positiveRatio >= 0.55 && weakRatio <= 0.25 && riskPivot <= 58) {
					return { state: 'open', score_multiplier: 1.04, min_return_3d_pct: -0.5, max_ma5_gap_pct: -2.5 };
				}
				return { state: 'neutral', score_multiplier: 1, min_return_3d_pct: 0, max_ma5_gap_pct: -2 };
			})();
			const breakoutEnvironment = exportedEnvironment || fallbackEnvironment;

			const records = (Array.isArray(stocks) ? stocks : []).map((stock) => {
				const safeStock = ensureStockShape(stock);
				const metrics = safeStock.metrics || {};
				const trend = safeStock.trend || {};
				const trapScore = Number(safeStock.score ?? 0);
				const purityScore = Number(metrics.business_purity_score ?? 0);
				const turnoverScore = Number(metrics.turnover_heat_score ?? 0);
				const turnoverZScore = Number(metrics.turnover_z_score ?? NaN);
				const financingScore = Number(metrics.financing_pressure_score ?? 0);
				const focusBonus = safeStock.code === focusCode ? 8 : 0;
				const avoidScore = trapScore * 0.5
					+ financingScore * 0.28
					+ turnoverScore * 0.17
					+ Math.max(trapScore - 65, 0) * 0.35
					+ focusBonus;
				const turnoverSetup = Number.isFinite(turnoverZScore)
					? Math.max(0, 100 - Math.abs(turnoverZScore - 1.2) * (turnoverZScore >= 0 ? 22 : 30))
					: Math.max(0, 100 - Math.abs(turnoverScore - 52) * 2.0);
				const breakoutWindow = Math.max(0, 100 - Math.abs(trapScore - breakoutCenter) * 2.6);
				const rawWatchScore = purityScore * 0.38
					+ turnoverSetup * 0.28
					+ (100 - financingScore) * 0.18
					+ breakoutWindow * 0.16;
				const trendScore = trend.available
					? (
						Math.max(0, Math.min(100, ((Number(trend.return_3d_pct ?? 0) + 2.5) / 6.5) * 100))
						+ Math.max(0, Math.min(100, ((Number(trend.return_5d_pct ?? 0) + 4) / 9) * 100))
						+ Math.max(0, Math.min(100, ((Number(trend.ma5_gap_pct ?? 0) + 4) / 7) * 100))
						+ Math.max(0, Math.min(100, ((Number(trend.ma10_gap_pct ?? 0) + 7) / 10) * 100))
					) / 4
					: null;
				const reboundBonus = trend.available && Number(trend.return_3d_pct ?? 0) >= 1.5 && Number(trend.ma5_gap_pct ?? 0) >= -0.5 ? 6 : 0;
				const crowdingPenalty = Math.max(trapScore - 68, 0) * 0.25;
				const watchScore = trend.available
					? Math.max(0, Math.min(100, (rawWatchScore * 0.62 + trendScore * 0.38 + reboundBonus) * Number(breakoutEnvironment.score_multiplier ?? 1) - crowdingPenalty))
					: Math.max(0, Math.min(100, rawWatchScore * 0.84 * Number(breakoutEnvironment.score_multiplier ?? 1) - crowdingPenalty));

				let avoidReason = '前排拥挤度偏高';
				if (financingScore >= 85) {
					avoidReason = '杠杆压力过高';
				} else if (turnoverScore >= 80) {
					avoidReason = '换手过热，容易一致性兑现';
				} else if (trapScore >= 70) {
					avoidReason = '综合陷阱分已进高危区';
				}

				let watchReason = '先看候选强度，再等趋势确认';
				if (breakoutEnvironment.state === 'tight' && trend.available && (Number(trend.return_3d_pct ?? 0) < Number(breakoutEnvironment.min_return_3d_pct ?? 0) || Number(trend.ma5_gap_pct ?? 0) < Number(breakoutEnvironment.max_ma5_gap_pct ?? -2))) {
					watchReason = '环境偏弱，只看最强修复票';
				} else if (trend.available && Number(trend.return_3d_pct ?? 0) >= 2 && Number(trend.ma5_gap_pct ?? 0) >= -0.5) {
					watchReason = '短线修复最完整，优先等回踩不破再跟';
				} else if (purityScore >= 70 && turnoverScore >= 32 && turnoverScore <= 68 && financingScore <= 60) {
					watchReason = Number.isFinite(turnoverZScore)
						? `相对换手抬升 ${turnoverZScore.toFixed(1)}σ，具备二次放量条件`
						: '题材纯度高，量能在启动区，具备二次放量条件';
				} else if (trapScore >= 46 && trapScore <= 62) {
					watchReason = '位置不挤、杠杆不热，向上试错空间更大';
				}

				return {
					...safeStock,
					avoidScore,
					watchScore,
					avoidReason,
					watchReason,
					trendLabel: '待趋势确认',
					trapScore,
					purityScore,
					turnoverScore,
					turnoverZScore,
					financingScore,
				};
			});

			const avoidList = [...records]
				.sort((left, right) => {
					return right.avoidScore - left.avoidScore
						|| right.trapScore - left.trapScore
						|| right.financingScore - left.financingScore;
				})
				.slice(0, 3);

			const watchPool = records
				.filter((stock) => stock.trapScore >= 40 && stock.trapScore < 70 && stock.financingScore < 85)
				.sort((left, right) => {
					return right.watchScore - left.watchScore
						|| right.purityScore - left.purityScore
						|| left.financingScore - right.financingScore;
				})
				.slice(0, 3);

			const watchList = watchPool.length === 3
				? watchPool
				: records
					.filter((stock) => !avoidList.some((item) => item.code === stock.code) && stock.financingScore < 85)
					.sort((left, right) => {
						return right.watchScore - left.watchScore
							|| right.purityScore - left.purityScore
							|| left.financingScore - right.financingScore;
					})
					.slice(0, 3);

			return { avoidList, watchList };
		}

		function fillRankingSlots(list, size) {
			const records = Array.isArray(list) ? [...list] : [];
			while (records.length < size) {
				records.push({
					code: '',
					name: '暂无更多标的',
					score: '-',
					reason: '今日先只看通过筛选的样本',
					placeholder: true,
				});
			}
			return records;
		}

		function RankingListItem({ stock, index, tone }) {
			const palette = tone === 'danger'
				? {
					reason: 'text-red-100/75',
					score: 'text-red-100',
					label: 'text-red-100/45',

			const shouldAppendTrendLabel = Boolean(
				stock.trendLabel
				&& !stock.placeholder
				&& !String(baseReason).includes(String(stock.trendLabel))
			);

				? stock.reason
				: `${baseReason}${shouldAppendTrendLabel ? ` · ${stock.trendLabel}` : ''}`;

			return (
				<div className={`grid grid-cols-[minmax(0,1fr)_56px] items-start gap-3 rounded-xl border px-3 ${stock.placeholder ? 'border-white/8 bg-white/5 py-2' : 'border-white/10 bg-black/15 py-2.5'}`}>

					</div>
					<div className={`rounded-lg border px-2 py-1 text-right ${stock.placeholder ? 'border-white/10 bg-white/5' : palette.panel}`}>
						<div className={`font-display text-xl leading-none ${stock.placeholder ? 'text-slate-500' : palette.score}`}>{stock.score}</div>
						{!stock.placeholder && <div className={`mt-1 text-[10px] leading-3 uppercase tracking-[0.12em] ${palette.label}`}>{stock.scoreLabel}</div>}
					</div>
				</div>
			);
		}

		function App() {
			const fallbackRecords = React.useMemo(
				() => Object.values(fallbackDatabase).map((stock) => ensureStockShape(stock)),
				[]
			);
			const [stockSource, setStockSource] = React.useState({
				generatedAt: '',
				dataFreshness: normalizeDataFreshness(null),
				formula: fallbackFormula,
				runSource: '',
				dailyWarning: fallbackWarningHistory[0],
				warningHistory: fallbackWarningHistory,
				stocks: fallbackRecords,
			});
			const [selectedWarningDate, setSelectedWarningDate] = React.useState(fallbackWarningHistory[0].date);
			const [leftInput, setLeftInput] = React.useState('300308');
			const [rightInput, setRightInput] = React.useState('002230');
			const [leftSubmittedQuery, setLeftSubmittedQuery] = React.useState('300308');
			const [rightSubmittedQuery, setRightSubmittedQuery] = React.useState('002230');
			const [loadState, setLoadState] = React.useState('idle');
			const [loadMessage, setLoadMessage] = React.useState(fallbackPrompt);

			React.useEffect(() => {
				async function loadData() {
					try {
						setLoadState('loading');
						let payload = globalThis.__QUANT_DATA__;
						if (!payload) {
							const response = await fetch('./data.json', { cache: 'no-store' });
							if (!response.ok) {
								throw new Error(`HTTP ${response.status}`);
							}

							payload = await response.json();
						}
						const normalized = normalizeStockData(payload);
						if (!normalized || normalized.stocks.length === 0) {
							throw new Error('data.json 中没有可用股票数据');
						}

						setStockSource(normalized);
						setSelectedWarningDate(normalized.warningHistory[0]?.date || normalized.dailyWarning?.date || '');
						if (normalized.stocks[0]?.code) {
							setLeftInput(normalized.stocks[0].code);
							setLeftSubmittedQuery(normalized.stocks[0].code);
						}
						if (normalized.stocks[1]?.code) {
							setRightInput(normalized.stocks[1].code);
							setRightSubmittedQuery(normalized.stocks[1].code);
						} else if (normalized.stocks[0]?.code) {
							setRightInput(normalized.stocks[0].code);
							setRightSubmittedQuery(normalized.stocks[0].code);
						}
						setLoadState('ready');
						setLoadMessage(`已加载实时数据，共 ${normalized.stocks.length} 只股票。`);
					} catch (error) {
						setLoadState('fallback');
						setLoadMessage('未读取到实时数据，当前展示静态样本。请先运行 Python 脚本生成 data.json 和 data.js。');
					}
				}

				loadData();
			}, [fallbackRecords]);

			const aliases = React.useMemo(() => buildAliasMap(stockSource.stocks), [stockSource]);
			const currentWarning = React.useMemo(() => {
				return stockSource.warningHistory.find((entry) => entry.date === selectedWarningDate)
					|| stockSource.dailyWarning
					|| fallbackWarningHistory[0];
			}, [selectedWarningDate, stockSource]);
			const previousWarning = React.useMemo(() => {
				const currentIndex = stockSource.warningHistory.findIndex((entry) => entry.date === currentWarning?.date);
				if (currentIndex < 0) {
					return null;
				}
				return stockSource.warningHistory[currentIndex + 1] || null;
			}, [currentWarning, stockSource.warningHistory]);
			const fallbackLeftCode = stockSource.stocks[0]?.code || '300308';
			const fallbackRightCode = stockSource.stocks[1]?.code || stockSource.stocks[0]?.code || '002230';
			const leftLiveMatch = findStockMatch(leftInput, stockSource.stocks, aliases);
			const rightLiveMatch = findStockMatch(rightInput, stockSource.stocks, aliases);
			const leftStock = leftLiveMatch || resolveStock(leftSubmittedQuery, fallbackLeftCode, stockSource.stocks, aliases);
			const rightStock = rightLiveMatch || resolveStock(rightSubmittedQuery, fallbackRightCode, stockSource.stocks, aliases);
			const gaugeScore = currentWarning?.gauge_score ?? Math.max(leftStock.score, rightStock.score);
			const reviewSuccess = isReviewSuccessful(currentWarning?.review);
			const reviewFailure = isReviewFailure(currentWarning?.review);
			const reviewBadge = reviewTone(currentWarning?.review);
			const windowReviewBadge = windowReviewTone(currentWarning?.review?.window_review);
			const topCohortAverage = currentWarning?.summary?.top_cohort_avg_trap_score;
			const topCohortSize = currentWarning?.summary?.top_cohort_size;
			const windowBasis = currentWarning?.summary?.window_basis;
			const historyStats = React.useMemo(() => buildHistoryStats(stockSource.warningHistory), [stockSource.warningHistory]);
			const riskSummary = React.useMemo(() => buildRiskSummary(currentWarning, previousWarning, gaugeScore, historyStats), [currentWarning, previousWarning, gaugeScore, historyStats]);
			const dailyFocus = React.useMemo(() => buildDailyFocus(currentWarning, previousWarning, gaugeScore, historyStats), [currentWarning, previousWarning, gaugeScore, historyStats]);
			const freshnessSummary = React.useMemo(() => buildFreshnessSummary(currentWarning, previousWarning, historyStats), [currentWarning, previousWarning, historyStats]);
			const topTrapRanking = React.useMemo(() => {
				return [...stockSource.stocks]
					.sort((a, b) => b.score - a.score)
					.slice(0, 5);
			}, [stockSource]);
			const hasStoredRankings = Boolean(
				currentWarning?.rankings
				&& (
					currentWarning.rankings.logicVersion
					|| currentWarning.rankings.avoidList?.length
					|| currentWarning.rankings.watchList?.length
				)
			);
			const canUseFallbackRankings = currentWarning?.date === stockSource.dailyWarning?.date;
			const microRankings = React.useMemo(() => {
				if (hasStoredRankings) {
					return currentWarning.rankings;
				}
				if (!canUseFallbackRankings) {
					return { avoidList: [], watchList: [] };
				}
				return buildMicroRankings(stockSource.stocks, currentWarning);
			}, [stockSource.stocks, currentWarning, hasStoredRankings, canUseFallbackRankings]);
			const rankingHistoryUnavailable = !hasStoredRankings && !canUseFallbackRankings;
			const displayRankings = React.useMemo(() => ({
				avoidList: fillRankingSlots(microRankings?.avoidList, 3),
				watchList: fillRankingSlots(microRankings?.watchList, 3),
			}), [microRankings]);
			const summary = currentWarning?.summary || {};
			const formula = stockSource.formula || fallbackFormula;
			const trapWeightPurity = Math.round((Number(formula.business_purity_weight ?? 0) || 0) * 100);
			const trapWeightFinancing = Math.round((Number(formula.financing_pressure_weight ?? 0) || 0) * 100);
			const trapWeightTurnover = Math.round((Number(formula.turnover_heat_weight ?? 0) || 0) * 100);
			const dashboardStats = [
				{
					label: '预警目标日',
					value: formatMonthDayLabel(stockSource.dataFreshness.warningTargetDate || currentWarning.date),
					note: '',
				},
				{
					label: '信息增量',
					value: freshnessSummary.value,
					note: freshnessSummary.note,
				},
				{
					label: '高风险样本',
					value: `${Number(summary.high_risk_count ?? 0)} 只`,
					note: '优先避开一致性追高',
				},
			];

			function applyQueries() {
				setLeftSubmittedQuery(leftInput);
				setRightSubmittedQuery(rightInput);
			}

			return (
				<main className="mx-auto flex min-h-screen w-full max-w-7xl flex-col px-4 py-4 sm:px-6 lg:px-8 lg:py-5">
					<section className="grid grid-cols-1 gap-4 md:grid-cols-[1.02fr_0.98fr]">
						<div className="rounded-[28px] border border-white/10 bg-[linear-gradient(135deg,rgba(10,17,35,0.92),rgba(8,12,24,0.82))] p-5 shadow-neon backdrop-blur-xl sm:p-6 lg:p-7">
							<div>
									<h1 className="max-w-2xl font-display text-2xl font-extrabold leading-tight text-white sm:text-3xl lg:text-4xl">
										量化陷阱预警系统
									</h1>
									<div className="mt-3 flex flex-wrap items-center gap-2 text-xs text-slate-300">
										<div className="rounded-full border border-white/10 bg-white/5 px-3 py-1.5">
											历史方向命中 {historyStats.successRate === null ? '待积累' : `${historyStats.successRate}%`}
										</div>
										<div className="rounded-full border border-white/10 bg-white/5 px-3 py-1.5">
											{historyStats.latestWindowRepeatStreak >= 3 ? `同一窗口连续 ${historyStats.latestWindowRepeatStreak} 天` : historyStats.windowHitRate === null ? '时段命中待积累' : `时段命中 ${historyStats.windowHitRate}%`}
										</div>
									</div>
							</div>

							<div className="mt-5 grid max-w-3xl gap-3 sm:grid-cols-3">
								{dashboardStats.map((item, index) => {
									const cardTone = [
										'border-white/10 bg-white/5',
										index === 2 ? 'shadow-[0_0_30px_rgba(89,243,255,0.1)]' : '',
									].join(' ');

									return (
										<div key={item.label} className={`rounded-[20px] border p-4 ${cardTone}`}>
											<div className="text-xs uppercase tracking-[0.3em] text-slate-500">{item.label}</div>
											<div className="mt-2 font-display text-2xl font-bold text-white">{item.value}</div>
											{item.note ? <div className="mt-1 text-xs text-slate-300">{item.note}</div> : null}
										</div>
									);
								})}
							</div>

							<div className="mt-10 flex flex-col items-center gap-10 xl:flex-row xl:justify-between">
								<Gauge score={gaugeScore} />
								<div className="w-full max-w-xl space-y-5">
									<div className="rounded-full border border-white/10 bg-white/5 px-3 py-2 text-xs uppercase tracking-[0.28em] text-slate-300">
										{formatWarningUpdatedAt(stockSource.generatedAt, currentWarning.date)}
									</div>
									<div className="grid gap-4 sm:grid-cols-3">
										{currentWarning.signals.map((signal, index) => {
											const cardClass = [
												'rounded-2xl border p-4',
												index === 0 ? 'border-cyanGlow/15 bg-cyanGlow/10' : '',
												index === 1 ? 'border-amber-300/15 bg-amber-300/10' : '',
												index === 2 ? 'border-red-400/15 bg-red-400/10' : '',
											].join(' ');

											return (
												<div key={signal.label} className={cardClass}>
													<div className="text-xs uppercase tracking-[0.28em] text-slate-200/80">{signal.label}</div>
													<div className="mt-2 font-display text-3xl text-white">{signal.value}</div>
													<div className="mt-1 text-slate-300">{signal.note}</div>
												</div>
											);
										})}
									</div>
								</div>
							</div>
						</div>

						<div className="rounded-[28px] border border-white/10 bg-[linear-gradient(180deg,rgba(16,24,44,0.88),rgba(6,10,24,0.92))] p-5 shadow-neon sm:p-6">
							<div className="rounded-2xl border border-white/10 bg-white/5 p-4">
								<div className="flex items-center justify-between gap-3">
									<div>
										<div className="text-base font-semibold leading-6 text-white">{riskSummary.headline}</div>
									</div>
									<div className="rounded-full border border-white/10 bg-slate-950/40 px-3 py-1 text-xs uppercase tracking-[0.22em] text-slate-300">
										{riskSummary.credibilityLabel}
									</div>
								</div>
								<div className="mt-3 space-y-2">
									{dailyFocus.map((item, index) => (
										<div key={`${item.title}-${index}`} className="rounded-2xl border border-white/10 bg-slate-950/30 p-2.5">
											<div className={`${item.eyebrow ? 'mt-1' : ''} text-base font-semibold leading-6 text-white`}>{item.title}</div>
											<div className="mt-1 text-xs leading-5 text-slate-300">{item.text}</div>
										</div>
									))}
								</div>
								<div className="mt-2 rounded-2xl border border-amber-300/15 bg-amber-300/10 px-4 py-2.5 text-xs leading-5 text-amber-50">{riskSummary.closingNote}</div>
							</div>
							{!rankingHistoryUnavailable && (displayRankings.avoidList.length > 0 || displayRankings.watchList.length > 0) && (
								<div className="mt-3 grid gap-3 sm:grid-cols-2">
									<div className="rounded-2xl border border-red-300/15 bg-red-400/10 p-4">
										<div className="flex items-center justify-between gap-2">
											<div className="text-xs uppercase tracking-[0.28em] text-red-100/75">今日最不适合追高</div>
											<div className="text-xs text-red-100/70">前 3 只</div>
										</div>
										<div className="mt-1 text-[11px] leading-4 text-red-100/65">不等于看跌，只代表今天追进去更容易买在拥挤位置。</div>
										<div className="mt-3 space-y-2">
											{displayRankings.avoidList.map((stock, index) => (
												<RankingListItem key={`${stock.code || 'avoid-empty'}-${index}`} stock={stock} index={index} tone="danger" />
											))}
										</div>
									</div>
									<div className="rounded-2xl border border-cyanGlow/15 bg-cyanGlow/10 p-4">
										<div className="flex items-center justify-between gap-2">
											<div className="text-xs uppercase tracking-[0.28em] text-cyanGlow/90">最有爆发潜力</div>
											<div className="text-xs text-cyanGlow/75">前 3 只</div>
										</div>
										<div className="mt-1 text-[11px] leading-4 text-cyanGlow/70">不等于必涨，只代表今天更值得优先观察强趋势与成交结构。</div>
										<div className="mt-3 space-y-2">
											{displayRankings.watchList.map((stock, index) => (
												<RankingListItem key={`${stock.code || 'watch-empty'}-${index}`} stock={stock} index={index} tone="watch" />
											))}
										</div>
									</div>
								</div>
							)}
							<details className="group mt-2 rounded-2xl border border-white/10 bg-white/5 p-3 open:bg-white/5">
								<summary className="flex cursor-pointer list-none items-center justify-between gap-3 select-none">
									<div>
										<div className="text-xs uppercase tracking-[0.3em] text-slate-400">历史回顾</div>
										<div className="mt-1 text-xs text-slate-300">已复盘 {historyStats.reviewed} 次，对了 {historyStats.success} 次，错了 {historyStats.failure} 次。</div>
									</div>
									<div className="flex items-center gap-2">
										<select
											value={selectedWarningDate}
											onChange={(event) => setSelectedWarningDate(event.target.value)}
											className="rounded-full border border-white/10 bg-panel px-4 py-2 text-sm text-slate-100 outline-none"
										>
											{stockSource.warningHistory.map((entry) => (
												<option key={entry.date} value={entry.date}>
													{formatWarningDate(entry.date)}
												</option>
											))}
										</select>
										<div className="text-sm text-slate-400 transition duration-300 group-open:rotate-180">⌄</div>
									</div>
								</summary>
								<div className="mt-3 rounded-2xl border border-white/10 bg-slate-950/30 p-3">
									<div className="flex flex-wrap items-center gap-3">
										<div className="text-xs uppercase tracking-[0.28em] text-slate-500">复盘结果</div>
										<div className={`rounded-full border px-3 py-1 text-sm font-semibold ${reviewBadge.className}`}>
											{reviewBadge.label}
										</div>
										{currentWarning?.review?.window_review ? (
											<div className={`rounded-full border px-3 py-1 text-sm font-semibold ${windowReviewBadge.className}`}>
												{windowReviewBadge.label}
											</div>
										) : null}
									</div>
									<p className="mt-2 text-xs leading-5 text-slate-300">
										{currentWarning.review?.note || '该日期暂无复盘说明。'}
									</p>
								</div>
							</details>
							<details className="group mt-2 rounded-2xl border border-red-400/20 bg-red-500/10 p-3 text-sm text-slate-200 transition duration-300 open:border-red-300/35">
								<summary className="flex cursor-pointer list-none items-center justify-between gap-3 select-none font-semibold text-white">
									<span className="text-sm uppercase tracking-[0.28em] text-red-100/80">最高量化陷阱分 TOP 5</span>
									<div className="flex items-center gap-2 text-xs font-normal uppercase tracking-[0.22em] text-red-100/70">
										<span>展开</span>
										<span className="text-lg leading-none transition duration-300 group-open:rotate-180">⌄</span>
									</div>
								</summary>
								<div className="mt-3 text-xs text-red-100/70">按综合陷阱分降序</div>
								<div className="mt-4 space-y-2">
									{topTrapRanking.map((stock, index) => (
										<div key={`${stock.code}-${index}`} className="flex items-center justify-between rounded-xl border border-white/10 bg-white/5 px-3 py-2">
											<div className="flex items-center gap-3">
												<div className="w-6 text-sm font-bold text-red-200">#{index + 1}</div>
												<div>
													<div className="text-sm font-semibold text-white">{stock.name}</div>
													<div className="text-xs text-slate-300">{stock.code}</div>
												</div>
											</div>
											<div className="font-display text-xl font-bold text-red-100">{stock.score}</div>
										</div>
									))}
								</div>
							</details>
							<details className="group mt-2 w-full rounded-2xl border border-cyanGlow/20 bg-cyanGlow/10 px-4 py-2.5 text-sm text-slate-200 transition duration-300 open:border-cyanGlow/40">
								<summary className="flex cursor-pointer list-none items-center justify-between gap-3 select-none font-semibold text-white">
									<span>理论依据</span>
									<div className="flex items-center gap-2 text-xs font-normal uppercase tracking-[0.22em] text-cyanGlow/75">
										<span>展开</span>
										<span className="text-lg leading-none transition duration-300 group-open:rotate-180">⌄</span>
									</div>
								</summary>
								<p className="mt-3 leading-7 text-slate-300">
									页面有价值的前提，不是天天重复一句风险时段，而是能说明今天为什么警惕、和昨天哪里不同、以及这类判断过去到底准不准。后面会按结果复盘，对错分开记。
								</p>
								<div className="mt-3 rounded-2xl border border-white/10 bg-slate-950/30 p-3 leading-7 text-slate-300">
									<div className="text-sm font-semibold text-white">陷阱分怎么算</div>
									<p className="mt-2">陷阱分 = 主营纯度 {trapWeightPurity}% + 融资压力 {trapWeightFinancing}% + 换手热度 {trapWeightTurnover}%。分数越高，代表这只票当前位置越拥挤、越容易追进去买在不舒服的位置。</p>
									<p className="mt-2">{formula.financing_pressure_rule}</p>
									<p className="mt-2">{formula.incremental_financing_rule}</p>
									<p className="mt-2">{formula.margin_burden_rule}</p>
									<p className="mt-2">{formula.turnover_heat_rule}</p>
								</div>
								<div className="mt-3 rounded-2xl border border-white/10 bg-slate-950/30 p-3 leading-7 text-slate-300">
									<div className="text-sm font-semibold text-white">爆发分怎么算</div>
									<p className="mt-2">爆发分 = 候选强度 62% + 趋势确认 38% + 短线修复加分 - 位置过热扣分。分数越高，代表这只票越像“还能继续向上走一段”的强候选。</p>
									<p className="mt-2">候选强度 = 题材纯度 38% + 启动区换手 28% + 融资不过热 18% + 位置激活度 16%。核心不是找最冷的票，而是找热度刚起来、但还没挤到高危区的票。</p>
									<p className="mt-2">趋势确认主要看近 3 到 10 日涨跌、5 日和 10 日均线偏离、以及近 8 日回撤。短线修复更完整、趋势未坏的票，会排得更靠前。</p>
									<p className="mt-2">{formula.watch_ranking_rule}</p>
									<p className="mt-2">趋势走弱、连跌、回撤过深的样本会被降权或直接剔除；趋势数据缺失的样本只能补位，不能优先霸榜。</p>
								</div>
								{topCohortAverage > 0 ? (
									<p className="mt-3 leading-7 text-slate-300">
										这一版重点看前 {topCohortSize || '-'} 只高分样本的平均陷阱分，目前是 {topCohortAverage.toFixed(1)} 分。
									</p>
								) : null}
								{windowBasis ? (
									<p className="mt-3 leading-7 text-slate-300">
										时段判断依据：{windowBasis}
									</p>
								) : null}
								{historyStats.latestWindowRepeatStreak >= 3 ? (
									<p className="mt-3 leading-7 text-amber-100">
										同一风险窗口已连续出现 {historyStats.latestWindowRepeatStreak} 天。如果没有新的依据变化，这部分只能当观察模板，不能当新增预测结论。
									</p>
								) : null}
								<p className="mt-3 leading-7 text-slate-300">
									风险温度的汇总方式：{formula.gauge_score_rule}
								</p>
								<div className="mt-3 space-y-3 leading-7">
									{metricGlossary.map((item) => (
										<div key={item.label}>
											<span className="font-semibold text-white">{item.label}：</span>
											{item.description}
										</div>
									))}
								</div>
							</details>
						</div>
					</section>

					<section className="mt-6 rounded-[32px] border border-white/10 bg-[linear-gradient(180deg,rgba(8,12,25,0.95),rgba(9,13,29,0.88))] p-6 shadow-neon backdrop-blur-xl sm:p-8 lg:p-10">
						<div className="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
							<div>
								<div className="text-xs uppercase tracking-[0.45em] text-cyanGlow/70">Stock PK</div>
								<h2 className="mt-3 font-display text-3xl font-bold text-white sm:text-4xl">个股量化陷阱查询 和 PK擂台</h2>
							</div>
						
							<div className="text-sm text-slate-500">分数高，不代表一定跌；代表你此时追进去，更容易买在拥挤位置。</div>
						</div>

						<div className="mt-8 grid gap-5 lg:grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] lg:items-end">
							<SearchField value={leftInput} onChange={setLeftInput} onSubmit={applyQueries} />
							<button
								type="button"
								onClick={applyQueries}
								className="inline-flex min-h-[60px] items-center justify-center self-end rounded-2xl border border-cyanGlow/25 bg-cyanGlow/15 px-6 py-3 font-display text-lg font-bold tracking-[0.12em] text-cyanGlow transition duration-300 hover:border-cyanGlow/45 hover:bg-cyanGlow/20"
							>
								查询 / PK
							</button>
							<SearchField value={rightInput} onChange={setRightInput} onSubmit={applyQueries} />
						</div>

						<div className="mt-6 rounded-[28px] border border-white/10 bg-white/5 p-5">
							<div>
								<div className={`text-sm ${loadState === 'ready' ? 'text-emerald-200' : loadState === 'loading' ? 'text-amber-200' : 'text-slate-300'}`}>
									{loadMessage}
								</div>
								<div className="mt-2 text-xs uppercase tracking-[0.3em] text-slate-500">
									{formatGeneratedAt(stockSource.generatedAt)}
								</div>
							</div>
						</div>

						<div className="mt-8 grid gap-6 lg:grid-cols-2">
							<StockCard title="候选 A" stock={leftStock} />
							<StockCard title="候选 B" stock={rightStock} />
						</div>

						<div className="mt-8 rounded-[28px] border border-white/10 bg-[linear-gradient(90deg,rgba(89,243,255,0.08),rgba(255,93,125,0.08))] px-6 py-5 text-lg leading-8 text-slate-100 sm:text-xl">
							<span className="mr-3 inline-flex rounded-full border border-white/10 bg-white/10 px-3 py-1 text-xs uppercase tracking-[0.35em] text-cyanGlow/75">PK 结论</span>
							{buildConclusion(leftStock, rightStock)}
						</div>
					</section>
				</main>
			);
		}

		ReactDOM.createRoot(document.getElementById('root')).render(<App />);
	</script>
</body>
</html>
