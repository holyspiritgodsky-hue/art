<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>AI量化预警网站</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: {
						display: ['Bahnschrift', 'Segoe UI', 'sans-serif'],
						body: ['Segoe UI Variable', 'Microsoft YaHei UI', 'sans-serif'],
					},
					boxShadow: {
						neon: '0 0 0 1px rgba(255,255,255,0.05), 0 22px 80px rgba(0, 0, 0, 0.48)',
						glow: '0 0 32px rgba(250, 204, 21, 0.14)',
					},
					colors: {
						ink: '#050816',
						panel: '#0b1120',
						panelSoft: '#111a31',
						cyanGlow: '#59f3ff',
						redGlow: '#ff5d7d',
						amberGlow: '#ffcb57',
						limeGlow: '#53f0a2',
					},
					backgroundImage: {
						grid: 'linear-gradient(rgba(120,154,255,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(120,154,255,0.09) 1px, transparent 1px)',
					},
				},
			},
		};
	</script>
	<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
	<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
	<script src="./data.js"></script>
</head>
<body class="min-h-screen overflow-x-hidden bg-ink text-slate-100 antialiased">
	<div class="pointer-events-none fixed inset-0 bg-[radial-gradient(circle_at_top_left,_rgba(89,243,255,0.16),_transparent_28%),radial-gradient(circle_at_82%_18%,_rgba(255,93,125,0.14),_transparent_24%),radial-gradient(circle_at_50%_120%,_rgba(255,203,87,0.12),_transparent_35%)]"></div>
	<div class="pointer-events-none fixed inset-0 bg-grid bg-[length:36px_36px] opacity-30"></div>
	<div id="root" class="relative"></div>

	<script type="text/babel">
		const fallbackDatabase = {
			'300308': {
				code: '300308',
				name: '中际旭创',
				score: 25,
				dims: [
					{ label: 'AI / 主营纯度', value: 31 },
					{ label: '筹码集中度', value: 22 },
					{ label: '杠杆虚胖度', value: 19 },
				],
			},
			'002230': {
				code: '002230',
				name: '科大讯飞',
				score: 72,
				dims: [
					{ label: 'AI / 主营纯度', value: 75 },
					{ label: '筹码集中度', value: 68 },
					{ label: '杠杆虚胖度', value: 73 },
				],
			},
			'688256': {
				code: '688256',
				name: '寒武纪',
				score: 81,
				dims: [
					{ label: 'AI / 主营纯度', value: 84 },
					{ label: '筹码集中度', value: 79 },
					{ label: '杠杆虚胖度', value: 76 },
				],
			},
			'002415': {
				code: '002415',
				name: '海康威视',
				score: 39,
				dims: [
					{ label: 'AI / 主营纯度', value: 44 },
					{ label: '筹码集中度', value: 35 },
					{ label: '杠杆虚胖度', value: 29 },
				],
			},
		};

		const defaultPrompt = '量化高频资金在连续拉高后有回撤兑现迹象，明日更适合做低吸辨真伪，避免追高接一致性。';
		const fallbackPrompt = '暂无实时量化结论，先用静态样本演示。若要读取最新结果，请先运行 Python 脚本生成 data.json，并用本地静态服务打开页面。';
		const fallbackWarningHistory = [
			{
				date: '2026-07-24',
				title: '量化高危区，先看承接，再谈进攻。',
				gauge_score: 68,
				prompt: defaultPrompt,
				signals: [
					{ label: '高频异动', value: '14', note: '疑似假突破样本' },
					{ label: '筹码拥挤', value: '67%', note: '热点集中在前排' },
					{ label: '两融升温', value: '+21%', note: '杠杆风险放大' },
				],
				warnings: [
					{ label: '风格漂移预警', value: '算力硬件优于纯题材映射' },
					{ label: '量化踩踏窗口', value: '10:05 - 10:40 易放大冲高回落' },
					{ label: '执行纪律', value: '避免追涨，优先确认量价背离' },
				],
				strategy: '当板块一致性预期过满时，陷阱往往不是来自逻辑错误，而是来自交易位置错误。先审视筹码，再决定出手。',
				review: { status: '待复盘', note: '次日收盘后可补充结果，观察预警是否兑现。' },
			},
		];

		function scoreTone(score) {
			if (score >= 70) {
				return {
					text: '高危',
					ring: '#ff5d7d',
					glow: 'shadow-[0_0_45px_rgba(255,93,125,0.25)]',
					chip: 'bg-red-500/15 text-red-200 border-red-400/30',
					bar: 'from-red-400 to-pink-500',
				};
			}
			if (score >= 45) {
				return {
					text: '警惕',
					ring: '#ffcb57',
					glow: 'shadow-[0_0_45px_rgba(255,203,87,0.2)]',
					chip: 'bg-amber-400/15 text-amber-100 border-amber-300/30',
					bar: 'from-amber-300 to-orange-400',
				};
			}
			return {
				text: '安全',
				ring: '#53f0a2',
				glow: 'shadow-[0_0_45px_rgba(83,240,162,0.18)]',
				chip: 'bg-emerald-400/15 text-emerald-100 border-emerald-300/30',
				bar: 'from-emerald-300 to-teal-400',
			};
		}

		function normalizeStockData(payload) {
			if (!payload || !Array.isArray(payload.stocks)) {
				return null;
			}

			const records = payload.stocks
				.filter((item) => item && item.code)
				.map((item) => {
					const purityScore = Math.round(item.metrics?.business_purity_score ?? 0);
					const turnoverScore = Math.round(item.metrics?.turnover_heat_score ?? 0);
					const financingScore = Math.round(item.metrics?.financing_pressure_score ?? 0);

					return {
						code: item.code,
						name: item.name || item.code,
						score: Math.round(item.trap_score ?? 0),
						marginDate: item.margin_date || '-',
						metrics: item.metrics || {},
						dims: [
							{ label: '板块主营相关度', value: purityScore },
							{ label: '高频诱多 / 砸盘频率', value: turnoverScore },
							{ label: '两融杠杆压力', value: financingScore },
						],
					};
				});

			return {
				generatedAt: payload.generated_at || '',
				dailyWarning: normalizeWarningEntry(payload.daily_warning),
				warningHistory: normalizeWarningHistory(payload.warning_history, payload.daily_warning),
				stocks: records,
			};
		}

		function normalizeWarningEntry(entry) {
			if (!entry) {
				return null;
			}

			return {
				date: entry.date || '',
				title: entry.title || '暂无预警标题',
				gauge_score: Math.round(entry.gauge_score ?? 0),
				prompt: entry.prompt || fallbackPrompt,
				signals: Array.isArray(entry.signals) ? entry.signals : [],
				warnings: Array.isArray(entry.warnings) ? entry.warnings : [],
				strategy: entry.strategy || '',
				review: entry.review || { status: '待复盘', note: '' },
			};
		}

		function normalizeWarningHistory(history, dailyWarning) {
			const records = Array.isArray(history) ? history.map(normalizeWarningEntry).filter(Boolean) : [];
			if (records.length > 0) {
				return records;
			}
			if (dailyWarning) {
				return [normalizeWarningEntry(dailyWarning)];
			}
			return fallbackWarningHistory.map(normalizeWarningEntry);
		}

		function formatWarningDate(value) {
			if (!value) {
				return '未命名日期';
			}
			return value.replace(/-/g, '.');
		}

		function formatAmount(value) {
			if (value === null || value === undefined || value === '') {
				return '-';
			}

			const numericValue = Number(String(value).replace(/,/g, ''));
			if (!Number.isFinite(numericValue)) {
				return value;
			}

			const absValue = Math.abs(numericValue);
			if (absValue >= 100000000) {
				return `${(numericValue / 100000000).toFixed(2)}亿`;
			}
			if (absValue >= 10000) {
				return `${(numericValue / 10000).toFixed(2)}万`;
			}

			return numericValue.toLocaleString('zh-CN');
		}

		function ensureStockShape(stock) {
			if (!stock) {
				return {
					code: '',
					name: '-',
					score: 0,
					marginDate: '-',
					metrics: {},
					dims: [],
				};
			}

			return {
				code: stock.code || '',
				name: stock.name || stock.code || '-',
				score: Math.round(stock.score ?? 0),
				marginDate: stock.marginDate || '-',
				metrics: stock.metrics || {},
				dims: Array.isArray(stock.dims) ? stock.dims : [],
			};
		}

		function buildAliasMap(stockList) {
			return stockList.reduce((map, stock) => {
				const code = String(stock.code || '').trim();
				const name = String(stock.name || '').trim().toLowerCase();
				if (code) {
					map[code] = stock;
				}
				if (name) {
					map[name] = stock;
				}
				return map;
			}, {});
		}

		function findStockMatch(query, stockList, aliases) {
			const normalized = query.trim().toLowerCase();
			if (!normalized) {
				return null;
			}

			if (aliases[normalized]) {
				return aliases[normalized];
			}

			return stockList.find((stock) => {
				const code = String(stock.code || '').toLowerCase();
				const name = String(stock.name || '').toLowerCase();
				return code.startsWith(normalized) || name.includes(normalized);
			}) || null;
		}

		function resolveStock(query, fallbackCode, stockList, aliases) {
			return findStockMatch(query, stockList, aliases) || aliases[fallbackCode];
		}

		function Gauge({ score }) {
			const tone = scoreTone(score);
			const angle = score * 3.6;

			return (
				<div className="relative flex h-[320px] w-[320px] items-center justify-center sm:h-[360px] sm:w-[360px]">
					<div
						className={`absolute inset-0 rounded-full border border-white/10 bg-slate-950/40 backdrop-blur-xl ${tone.glow}`}
						style={{
							background: `conic-gradient(${tone.ring} 0deg ${angle}deg, rgba(255,255,255,0.06) ${angle}deg 360deg)`,
						}}
					/>
					<div className="absolute inset-[18px] rounded-full border border-white/10 bg-[radial-gradient(circle_at_top,_rgba(255,255,255,0.14),_rgba(4,8,20,0.92)_60%)]"></div>
					<div className="absolute inset-[58px] rounded-full border border-white/10 bg-ink/95 shadow-[inset_0_0_40px_rgba(89,243,255,0.08)]"></div>
					<div className="relative z-10 flex flex-col items-center text-center">
						
						<div className="font-display text-6xl font-extrabold sm:text-7xl">{score}</div>
						<div className={`mt-3 rounded-full border px-4 py-1 text-sm tracking-[0.25em] ${tone.chip}`}>{tone.text}</div>
						<div className="mt-5 text-xs uppercase tracking-[0.35em] text-slate-400">明日量化陷阱指数</div>
					</div>
				</div>
			);
		}

		function SearchField({ label, value, onChange, onSubmit }) {
			return (
				<label className="block">
					<div className="mb-3 text-xs uppercase tracking-[0.35em] text-slate-400">{label}</div>
					<div className="flex items-center gap-3 rounded-2xl border border-white/10 bg-white/5 px-4 py-4 shadow-neon backdrop-blur-md transition duration-300 focus-within:border-cyanGlow/40 focus-within:bg-white/10">
						<span className="text-lg text-cyanGlow">⌕</span>
						<input
							value={value}
							onChange={(event) => onChange(event.target.value)}
							onKeyDown={(event) => {
								if (event.key === 'Enter') {
									event.preventDefault();
									onSubmit();
								}
							}}
							className="w-full bg-transparent text-lg text-white outline-none placeholder:text-slate-500"
							placeholder="输入代码 / 名称，例如 300308 或 科大讯飞"
						/>
					</div>
				</label>
			);
		}

		function DimensionBar({ dimension, score }) {
			const tone = scoreTone(score);
			return (
				<div>
					<div className="mb-2 flex items-center justify-between text-sm">
						<span className="text-slate-300">{dimension.label}</span>
						<span className="font-display text-base text-white">{dimension.value}</span>
					</div>
					<div className="h-3 overflow-hidden rounded-full bg-white/8">
						<div
							className={`h-full rounded-full bg-gradient-to-r ${tone.bar}`}
							style={{ width: `${dimension.value}%` }}
						/>
					</div>
				</div>
			);
		}

		function StockCard({ title, stock }) {
			const safeStock = ensureStockShape(stock);
			const metrics = safeStock.metrics;
			const tone = scoreTone(safeStock.score);

			return (
				<div className="group rounded-[28px] border border-white/10 bg-[linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03))] p-6 shadow-neon backdrop-blur-xl transition duration-500 hover:-translate-y-1 hover:border-white/20">
					<div className="mb-6 flex items-start justify-between gap-4">
						<div>
							<div className="text-xs uppercase tracking-[0.35em] text-slate-500">{title}</div>
							<div className="mt-3 font-display text-3xl font-bold tracking-[0.08em]">{safeStock.name}</div>
							<div className="mt-1 text-slate-400">{safeStock.code}</div>
						</div>
						<div className={`rounded-2xl border px-4 py-3 text-right ${tone.chip}`}>
							<div className="text-xs uppercase tracking-[0.3em]">综合陷阱分</div>
							<div className="mt-1 font-display text-3xl font-extrabold">{safeStock.score}</div>
						</div>
					</div>

					<div className="space-y-5">
						{safeStock.dims.map((dimension) => (
							<DimensionBar key={dimension.label} dimension={dimension} score={dimension.value} />
						))}
					</div>

					<div className="mt-5 grid gap-3 text-sm text-slate-300 sm:grid-cols-2">
						<div className="rounded-2xl border border-white/10 bg-white/5 px-4 py-3">
							<div className="text-xs uppercase tracking-[0.25em] text-slate-500">融资余额</div>
							<div className="mt-2 text-base text-white">{formatAmount(metrics.margin_balance)}</div>
						</div>
						<div className="rounded-2xl border border-white/10 bg-white/5 px-4 py-3">
							<div className="text-xs uppercase tracking-[0.25em] text-slate-500">融资买入额</div>
							<div className="mt-2 text-base text-white">{formatAmount(metrics.margin_buy)}</div>
						</div>
						<div className="rounded-2xl border border-white/10 bg-white/5 px-4 py-3">
							<div className="text-xs uppercase tracking-[0.25em] text-slate-500">换手率</div>
							<div className="mt-2 text-base text-white">{metrics.turnover_rate ?? '-'}</div>
						</div>
						<div className="rounded-2xl border border-white/10 bg-white/5 px-4 py-3">
							<div className="text-xs uppercase tracking-[0.25em] text-slate-500">两融日期</div>
							<div className="mt-2 text-base text-white">{safeStock.marginDate}</div>
						</div>
					</div>
				</div>
			);
		}

		function buildConclusion(leftStock, rightStock) {
			const delta = rightStock.score - leftStock.score;
			if (Math.abs(delta) <= 8) {
				return `${leftStock.name}和${rightStock.name}看下来都不算便宜，现在去追都容易挨套，先等它们回落一点再看。`;
			}
			if (delta > 0) {
				return `${leftStock.name}这边相对安全一点，但也不要梭哈；${rightStock.name}现在更容易冲高回落，尽量别追。`;
			}
			return `${rightStock.name}这边相对安全一点，但也不要梭哈；${leftStock.name}现在更容易冲高回落，尽量别追。`;
		}

		function App() {
			const fallbackRecords = React.useMemo(
				() => Object.values(fallbackDatabase).map((stock) => ensureStockShape(stock)),
				[]
			);
			const [stockSource, setStockSource] = React.useState({
				generatedAt: '',
				dailyWarning: fallbackWarningHistory[0],
				warningHistory: fallbackWarningHistory,
				stocks: fallbackRecords,
			});
			const [selectedWarningDate, setSelectedWarningDate] = React.useState(fallbackWarningHistory[0].date);
			const [leftInput, setLeftInput] = React.useState('300308');
			const [rightInput, setRightInput] = React.useState('002230');
			const [leftSubmittedQuery, setLeftSubmittedQuery] = React.useState('300308');
			const [rightSubmittedQuery, setRightSubmittedQuery] = React.useState('002230');
			const [loadState, setLoadState] = React.useState('idle');
			const [loadMessage, setLoadMessage] = React.useState(fallbackPrompt);

			React.useEffect(() => {
				async function loadData() {
					try {
						setLoadState('loading');
						let payload = globalThis.__QUANT_DATA__;
						if (!payload) {
							const response = await fetch('./data.json', { cache: 'no-store' });
							if (!response.ok) {
								throw new Error(`HTTP ${response.status}`);
							}

							payload = await response.json();
						}
						const normalized = normalizeStockData(payload);
						if (!normalized || normalized.stocks.length === 0) {
							throw new Error('data.json 中没有可用股票数据');
						}

						setStockSource(normalized);
						setSelectedWarningDate(normalized.warningHistory[0]?.date || normalized.dailyWarning?.date || '');
						if (normalized.stocks[0]?.code) {
							setLeftInput(normalized.stocks[0].code);
							setLeftSubmittedQuery(normalized.stocks[0].code);
						}
						if (normalized.stocks[1]?.code) {
							setRightInput(normalized.stocks[1].code);
							setRightSubmittedQuery(normalized.stocks[1].code);
						} else if (normalized.stocks[0]?.code) {
							setRightInput(normalized.stocks[0].code);
							setRightSubmittedQuery(normalized.stocks[0].code);
						}
						setLoadState('ready');
						setLoadMessage(`已加载实时数据，共 ${normalized.stocks.length} 只股票。`);
					} catch (error) {
						setLoadState('fallback');
						setLoadMessage('未读取到实时数据，当前展示静态样本。请先运行 Python 脚本生成 data.json 和 data.js。');
					}
				}

				loadData();
			}, [fallbackRecords]);

			const aliases = React.useMemo(() => buildAliasMap(stockSource.stocks), [stockSource]);
			const currentWarning = React.useMemo(() => {
				return stockSource.warningHistory.find((entry) => entry.date === selectedWarningDate)
					|| stockSource.dailyWarning
					|| fallbackWarningHistory[0];
			}, [selectedWarningDate, stockSource]);
			const fallbackLeftCode = stockSource.stocks[0]?.code || '300308';
			const fallbackRightCode = stockSource.stocks[1]?.code || stockSource.stocks[0]?.code || '002230';
			const leftLiveMatch = findStockMatch(leftInput, stockSource.stocks, aliases);
			const rightLiveMatch = findStockMatch(rightInput, stockSource.stocks, aliases);
			const leftStock = leftLiveMatch || resolveStock(leftSubmittedQuery, fallbackLeftCode, stockSource.stocks, aliases);
			const rightStock = rightLiveMatch || resolveStock(rightSubmittedQuery, fallbackRightCode, stockSource.stocks, aliases);
			const gaugeScore = currentWarning?.gauge_score ?? Math.max(leftStock.score, rightStock.score);

			function applyQueries() {
				setLeftSubmittedQuery(leftInput);
				setRightSubmittedQuery(rightInput);
			}

			return (
				<main className="mx-auto flex min-h-screen w-full max-w-7xl flex-col px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
					<section className="grid min-h-[52vh] grid-cols-1 gap-6 lg:grid-cols-[1.1fr_0.9fr]">
						<div className="rounded-[32px] border border-white/10 bg-[linear-gradient(135deg,rgba(10,17,35,0.92),rgba(8,12,24,0.82))] p-6 shadow-neon backdrop-blur-xl sm:p-8 lg:p-10">
							<div className="flex flex-wrap items-center justify-between gap-4">
								<div>
						
									<h1 className="mt-3 max-w-2xl font-display text-3xl font-extrabold leading-tight text-white sm:text-4xl lg:text-5xl">
										AI量化预警网站
									</h1>
									<p className="mt-4 max-w-2xl text-base text-slate-300 sm:text-lg">
										识别明日 AI 方向中容易出现的一致性追涨、筹码拥挤与两融透支风险，帮助你在开盘前先避坑。
									</p>
								</div>
								
							</div>

							<div className="mt-10 flex flex-col items-center gap-10 xl:flex-row xl:justify-between">
								<Gauge score={gaugeScore} />
								<div className="w-full max-w-xl space-y-5">
									<div className="rounded-[28px] border border-white/10 bg-white/5 p-6 shadow-neon">
										<div className="text-xs uppercase tracking-[0.35em] text-slate-400">明日操作提示词</div>
										<div className="mt-4 text-2xl font-semibold leading-relaxed text-white sm:text-3xl">
											{currentWarning.title}
										</div>
										<p className="mt-4 text-lg leading-8 text-slate-300">
											{currentWarning.prompt}
										</p>
										<div className="mt-5 flex flex-wrap items-center gap-3">
											<div className="rounded-full border border-white/10 bg-white/5 px-3 py-2 text-xs uppercase tracking-[0.28em] text-slate-300">
												预警日期 {formatWarningDate(currentWarning.date)}
											</div>
											<select
												value={selectedWarningDate}
												onChange={(event) => setSelectedWarningDate(event.target.value)}
												className="rounded-full border border-white/10 bg-panel px-4 py-2 text-sm text-slate-100 outline-none"
											>
												{stockSource.warningHistory.map((entry) => (
													<option key={entry.date} value={entry.date}>
														{formatWarningDate(entry.date)}
													</option>
												))}
											</select>
										</div>
									</div>

									<div className="grid gap-4 sm:grid-cols-3">
										{currentWarning.signals.map((signal, index) => {
											const cardClass = [
												'rounded-2xl border p-4',
												index === 0 ? 'border-cyanGlow/15 bg-cyanGlow/10' : '',
												index === 1 ? 'border-amber-300/15 bg-amber-300/10' : '',
												index === 2 ? 'border-red-400/15 bg-red-400/10' : '',
											].join(' ');

											return (
												<div key={signal.label} className={cardClass}>
													<div className="text-xs uppercase tracking-[0.28em] text-slate-200/80">{signal.label}</div>
													<div className="mt-2 font-display text-3xl text-white">{signal.value}</div>
													<div className="mt-1 text-slate-300">{signal.note}</div>
												</div>
											);
										})}
									</div>
								</div>
							</div>
						</div>

						<div className="rounded-[32px] border border-white/10 bg-[linear-gradient(180deg,rgba(16,24,44,0.88),rgba(6,10,24,0.92))] p-6 shadow-neon sm:p-8">
							<div className="text-xs uppercase tracking-[0.45em] text-slate-400">明日风险预警</div>
							<div className="mt-4 space-y-4">
								{currentWarning.warnings.map((warning) => (
									<div key={warning.label} className="rounded-2xl border border-white/10 bg-white/5 p-5">
										<div className="text-sm text-slate-400">{warning.label}</div>
										<div className="mt-2 text-2xl font-semibold text-white">{warning.value}</div>
									</div>
								))}
							</div>

							<div className="mt-6 rounded-[28px] border border-cyanGlow/15 bg-[linear-gradient(180deg,rgba(89,243,255,0.09),rgba(89,243,255,0.02))] p-6">
								<div className="text-xs uppercase tracking-[0.35em] text-cyanGlow/75">战略建议</div>
								<p className="mt-4 text-lg leading-8 text-slate-200">
									{currentWarning.strategy}
								</p>
								<div className="mt-4 rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-slate-300">
									<span className="text-slate-500">复盘状态：</span>
									{currentWarning.review?.status || '待复盘'}
									<span className="ml-3 text-slate-400">{currentWarning.review?.note || ''}</span>
								</div>
							</div>
						</div>
					</section>

					<section className="mt-6 rounded-[32px] border border-white/10 bg-[linear-gradient(180deg,rgba(8,12,25,0.95),rgba(9,13,29,0.88))] p-6 shadow-neon backdrop-blur-xl sm:p-8 lg:p-10">
						<div className="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
							<div>
								<div className="text-xs uppercase tracking-[0.45em] text-cyanGlow/70">Stock PK</div>
								<h2 className="mt-3 font-display text-3xl font-bold text-white sm:text-4xl">个股量化陷阱查询 和 PK擂台</h2>
							</div>
							<div className="text-base text-slate-400">支持输入代码或名称，对比两只 AI 热门股的风险结构。</div>
						</div>

						<div className="mt-8 grid gap-5 lg:grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] lg:items-end">
							<SearchField label="左侧标的" value={leftInput} onChange={setLeftInput} onSubmit={applyQueries} />
							<button
								type="button"
								onClick={applyQueries}
								className="inline-flex min-h-[60px] items-center justify-center self-end rounded-2xl border border-cyanGlow/25 bg-cyanGlow/15 px-6 py-3 font-display text-lg font-bold tracking-[0.12em] text-cyanGlow transition duration-300 hover:border-cyanGlow/45 hover:bg-cyanGlow/20"
							>
								查询 / PK
							</button>
							<SearchField label="右侧标的" value={rightInput} onChange={setRightInput} onSubmit={applyQueries} />
						</div>

						<div className="mt-6 rounded-[28px] border border-white/10 bg-white/5 p-5">
							<div>
								<div className={`text-sm ${loadState === 'ready' ? 'text-emerald-200' : loadState === 'loading' ? 'text-amber-200' : 'text-slate-300'}`}>
									{loadMessage}
								</div>
								<div className="mt-2 text-xs uppercase tracking-[0.3em] text-slate-500">
									{stockSource.generatedAt ? `数据生成时间 ${stockSource.generatedAt}` : '未检测到实时数据文件'}
								</div>
							</div>
						</div>

						<div className="mt-8 grid gap-6 lg:grid-cols-2">
							<StockCard title="候选 A" stock={leftStock} />
							<StockCard title="候选 B" stock={rightStock} />
						</div>

						<div className="mt-8 rounded-[28px] border border-white/10 bg-[linear-gradient(90deg,rgba(89,243,255,0.08),rgba(255,93,125,0.08))] px-6 py-5 text-lg leading-8 text-slate-100 sm:text-xl">
							<span className="mr-3 inline-flex rounded-full border border-white/10 bg-white/10 px-3 py-1 text-xs uppercase tracking-[0.35em] text-cyanGlow/75">PK 结论</span>
							{buildConclusion(leftStock, rightStock)}
						</div>
					</section>
				</main>
			);
		}

		ReactDOM.createRoot(document.getElementById('root')).render(<App />);
	</script>
</body>
</html>
