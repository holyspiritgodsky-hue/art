<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>热血足球: 英雄 6v6</title>
  <style>
    :root {
      --ink: #f5f2dc;
      --line: rgba(255, 255, 255, 0.24);
      --panel: rgba(10, 16, 24, 0.72);
      --blue: #6cc0ff;
      --red: #ff8574;
      --field-a: #305f2e;
      --field-b: #244924;
      --field-c: #7ab35c;
      --goal: #f8edd0;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 14%, #3f7040 0%, transparent 38%),
        radial-gradient(circle at 84% 80%, #2f5a36 0%, transparent 44%),
        linear-gradient(160deg, #1e3322 0%, #223c27 48%, #1a2e20 100%);
      user-select: none;
    }

    #game {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    #hud {
      position: fixed;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      pointer-events: none;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      backdrop-filter: blur(4px);
      padding: 8px 12px;
      pointer-events: auto;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
    }

    #score {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      min-width: 170px;
      text-align: center;
    }

    #clock {
      min-width: 86px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
    }

    #actions {
      display: inline-flex;
      gap: 8px;
      pointer-events: auto;
    }

    .is-hidden {
      display: none !important;
    }

    .btn {
      border: 1px solid var(--line);
      background: rgba(26, 36, 50, 0.85);
      color: var(--ink);
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn:hover { filter: brightness(1.1); }

    .mini-input {
      border: 1px solid var(--line);
      background: rgba(26, 36, 50, 0.85);
      color: var(--ink);
      height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 12px;
      min-width: 210px;
    }

    #netStatus {
      font-size: 12px;
      color: #ffe0a2;
      min-width: 180px;
      display: inline-flex;
      align-items: center;
      padding: 0 4px;
    }

    #draftOverlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(8, 13, 22, 0.72);
      backdrop-filter: blur(5px);
    }

    #draftOverlay.show {
      display: flex;
    }

    .draft-panel {
      width: min(980px, 100%);
      max-height: min(86vh, 760px);
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 14px;
      background: linear-gradient(160deg, rgba(23, 34, 50, 0.92), rgba(18, 28, 41, 0.92));
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.38);
      padding: 14px;
    }

    .draft-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .draft-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #e8f1ff;
    }

    .draft-sub {
      font-size: 12px;
      color: rgba(231, 241, 255, 0.88);
      margin-top: 3px;
    }

    #draftHint {
      font-size: 12px;
      color: #ffe0a2;
      margin-top: 6px;
      min-height: 16px;
    }

    #draftCount {
      font-size: 13px;
      font-weight: 700;
      color: #ffdca2;
    }

    #draftList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
      gap: 8px;
    }

    .hero-pick {
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 10px;
      background: rgba(35, 49, 68, 0.7);
      color: #eff4ff;
      cursor: pointer;
      min-height: 92px;
    }

    .hero-pick.on {
      border-color: rgba(125, 194, 255, 0.9);
      background: rgba(48, 72, 101, 0.88);
      box-shadow: inset 0 0 0 1px rgba(160, 218, 255, 0.32);
    }

    .hero-name {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .hero-stat {
      font-size: 11px;
      opacity: 0.92;
      line-height: 1.45;
    }

    .hero-order {
      font-size: 11px;
      font-weight: 800;
      color: #ffd486;
      margin-top: 5px;
      min-height: 14px;
    }

    .draft-actions {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    @media (max-width: 900px), (pointer: coarse) {
      #hud { top: 8px; left: 8px; right: 8px; }
      #score { font-size: 16px; }
      #clock { font-size: 14px; }
      .btn { height: 32px; font-size: 12px; }
      .mini-input { height: 32px; min-width: 140px; font-size: 11px; }
      .draft-panel { padding: 12px; }
      .draft-title { font-size: 16px; }
      #draftList { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="score" class="card">蜀汉联队 0 : 0 群雄联队</div>
    <div id="clock" class="card">03:00</div>
    <div id="actions" class="card">
      <button class="btn" id="soloModeBtn" type="button">单人</button>
      <button class="btn" id="onlineModeBtn" type="button">联机</button>
      <input class="mini-input" id="serverInput" placeholder="ws://host:8080" />
      <button class="btn" id="connectBtn" type="button">连接并匹配</button>
      <span id="netStatus">单人模式</span>
      <a class="btn" id="backBtn" href="index.html">返回战场</a>
      <button class="btn" id="pauseBtn" type="button">暂停</button>
      <button class="btn" id="restartBtn" type="button">重开</button>
    </div>
  </div>

  <div id="draftOverlay" class="show">
    <div class="draft-panel">
      <div class="draft-head">
        <div>
          <div class="draft-title">选我方 6 人首发</div>
          <div class="draft-sub">敌方将随机出战，阵容会自动记忆到本机</div>
          <div id="draftHint">提示: Esc 可退出当前选阵容页</div>
        </div>
        <div id="draftCount">已选 0/6</div>
      </div>
      <div id="draftList"></div>
      <div class="draft-actions">
        <button class="btn" id="draftExitBtn" type="button">退出</button>
        <button class="btn" id="draftResetBtn" type="button">清空重选</button>
        <button class="btn" id="startMatchBtn" type="button" disabled>开赛</button>
      </div>
    </div>
  </div>

  <script src="heroes.js"></script>
  <script src="sense.js"></script>
  <script>
    (function () {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const hudEl = document.getElementById("hud");
      const scoreEl = document.getElementById("score");
      const clockEl = document.getElementById("clock");
      const pauseBtn = document.getElementById("pauseBtn");
      const restartBtn = document.getElementById("restartBtn");
      const draftOverlayEl = document.getElementById("draftOverlay");
      const draftListEl = document.getElementById("draftList");
      const draftCountEl = document.getElementById("draftCount");
      const startMatchBtn = document.getElementById("startMatchBtn");
      const draftResetBtn = document.getElementById("draftResetBtn");
      const draftTitleEl = document.querySelector(".draft-title");
      const draftSubEl = document.querySelector(".draft-sub");
      const draftHintEl = document.getElementById("draftHint");
      const draftExitBtn = document.getElementById("draftExitBtn");
      const soloModeBtn = document.getElementById("soloModeBtn");
      const onlineModeBtn = document.getElementById("onlineModeBtn");
      const serverInputEl = document.getElementById("serverInput");
      const connectBtn = document.getElementById("connectBtn");
      const netStatusEl = document.getElementById("netStatus");
      const backBtn = document.getElementById("backBtn");

      const heroStore = window.WarHeroes;
      const renderStd = window.WarSense || null;
      const heroDetail = heroStore && heroStore.detailRuntime ? heroStore.detailRuntime : null;
      const heroPool = heroStore && Array.isArray(heroStore.HERO_IDS)
        ? heroStore.HERO_IDS.slice()
        : ["zhugeliang", "lancelot", "sanada", "sunshangxiang", "daqiao", "xiaoqiao", "elizabeth"];

      const W = 1760;
      const H = 1040;
      const GOAL_H = 248;
      const HALF_X = W * 0.5;
      const CAMERA_PAD_X = 72;
      const CAMERA_PAD_Y = 28;
      const MATCH_SECONDS = 180;
      const PLAYER_COUNT = 6;
      const DOWN_KNOCKOUT = 3.6;
      const REVIVE_HP_RATIO = 0.55;
      const BLUE_LINEUP_KEY = "warFootballBlueLineupV1";
      const IS_MOBILE_VIEW = window.matchMedia("(pointer: coarse), (max-width: 900px)").matches;
      const MOBILE_BASE_SCALE = 0.56;
      const MAX_SKILL_FX = IS_MOBILE_VIEW ? 18 : 34;
      const LIGHTNING_POINTS = IS_MOBILE_VIEW ? 8 : 9;
      const ENABLE_LIGHTNING_OVERLAY = !IS_MOBILE_VIEW;
      const MAX_CRATERS = IS_MOBILE_VIEW ? 6 : 10;

      const state = {
        blue: [],
        red: [],
        ball: {
          x: HALF_X,
          y: H * 0.5,
          vx: 0,
          vy: 0,
          r: 10,
          carrier: null
        },
        blueScore: 0,
        redScore: 0,
        paused: false,
        elapsed: 0,
        gameOver: false,
        pointerTarget: null,
        pointerDown: false,
        skillFx: [],
        craters: [],
        frameMsEma: 16,
        selectedBlueIds: [],
        selectedRedIds: [],
        inDraft: true,
        camera: {
          x: 0,
          y: 0,
          smooth: IS_MOBILE_VIEW ? 0.22 : 0.18,
          scale: IS_MOBILE_VIEW ? MOBILE_BASE_SCALE : 1
        }
      };

      const net = {
        mode: "solo",
        socket: null,
        connected: false,
        side: null,
        host: false,
        readySent: false,
        remoteInput: { w: false, a: false, s: false, d: false, j: false },
        remoteReadyA: false,
        remoteReadyB: false,
        snapshotTimer: 0,
        statusText: "单人模式",
        waitingSince: 0
      };

      const input = {
        w: false,
        a: false,
        s: false,
        d: false,
        j: false
      };

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function normalize(x, y) {
        const d = Math.hypot(x, y) || 0.001;
        return { x: x / d, y: y / d };
      }

      function autoSocketURL() {
        const wsProto = location.protocol === "https:" ? "wss" : "ws";
        return wsProto + "://" + location.host;
      }

      function setNetStatus(text, waiting) {
        netStatusEl.textContent = text;
        net.statusText = text;
        net.waitingSince = waiting ? (net.waitingSince || Date.now()) : 0;
        refreshActionBar();
        updateDraftHint();
      }

      function setHidden(el, hidden) {
        if (!el) return;
        el.classList.toggle("is-hidden", !!hidden);
      }

      function refreshActionBar() {
        const inDraft = state.inDraft;
        const online = net.mode === "online";

        // 只在选阵容阶段显示模式和联机配置，比赛中自动收起减少横向占位。
        setHidden(soloModeBtn, !inDraft);
        setHidden(onlineModeBtn, !inDraft);
        setHidden(serverInputEl, !inDraft || !online);
        setHidden(connectBtn, !inDraft || !online);
        setHidden(netStatusEl, !inDraft || !online);

        setHidden(pauseBtn, inDraft);
        setHidden(restartBtn, inDraft || (online && !net.host));

        if (inDraft && online) {
          connectBtn.textContent = net.connected ? "重新匹配" : "连接并匹配";
        } else {
          connectBtn.textContent = "连接并匹配";
        }

        backBtn.textContent = inDraft ? "返回战场" : "返回战场";
      }

      function updateDraftHint() {
        if (!draftHintEl) return;
        if (net.mode === "online") {
          if (net.waitingSince > 0) {
            const waited = Math.max(0, Math.floor((Date.now() - net.waitingSince) / 1000));
            draftHintEl.textContent = net.statusText + " (已等待 " + waited + " 秒)  |  Esc 可退出联机";
          } else {
            draftHintEl.textContent = net.statusText + "  |  Esc 可退出联机";
          }
          return;
        }
        draftHintEl.textContent = "提示: Esc 可快速开赛并退出选阵容页";
      }

      function sendNet(payload) {
        if (!net.socket || net.socket.readyState !== WebSocket.OPEN) return;
        net.socket.send(JSON.stringify(payload));
      }

      function setMode(mode) {
        net.mode = mode;
        if (mode === "solo") {
          setNetStatus("单人模式", false);
          if (net.socket && net.socket.readyState === WebSocket.OPEN) {
            net.socket.close();
          }
          net.connected = false;
          net.side = null;
          net.host = false;
          net.readySent = false;
          net.waitingSince = 0;
          net.remoteInput = { w: false, a: false, s: false, d: false, j: false };
          state.selectedRedIds = [];
          showDraftOverlay();
        } else {
          setNetStatus("联机模式: 点击连接并匹配", false);
          showDraftOverlay();
        }
        refreshActionBar();
      }

      function connectOnline() {
        if (net.mode !== "online") {
          setNetStatus("先切到联机模式", false);
          return;
        }

        if (net.socket && net.socket.readyState === WebSocket.OPEN) {
          sendNet({ type: "findMatch" });
          setNetStatus("正在匹配...", true);
          return;
        }

        const url = (serverInputEl.value || "").trim() || autoSocketURL();
        serverInputEl.value = url;
        net.socket = new WebSocket(url);
        setNetStatus("连接中...", true);

        net.socket.addEventListener("open", function () {
          net.connected = true;
          sendNet({ type: "findMatch" });
          setNetStatus("已连接，匹配中...", true);
        });

        net.socket.addEventListener("close", function () {
          net.connected = false;
          net.side = null;
          net.host = false;
          net.readySent = false;
          net.waitingSince = 0;
          setNetStatus(net.mode === "online" ? "连接断开" : "单人模式", false);
        });

        net.socket.addEventListener("error", function () {
          setNetStatus("连接错误", false);
        });

        net.socket.addEventListener("message", function (evt) {
          let msg;
          try {
            msg = JSON.parse(evt.data);
          } catch (_err) {
            return;
          }

          if (msg.type === "welcome") {
            setNetStatus("已连接服务器", false);
            return;
          }

          if (msg.type === "waiting") {
            setNetStatus(msg.message || "等待对手...", true);
            return;
          }

          if (msg.type === "matched") {
            net.side = msg.side;
            net.host = msg.side === "A";
            net.readySent = false;
            net.remoteReadyA = false;
            net.remoteReadyB = false;
            state.selectedBlueIds = [];
            showDraftOverlay();
            setNetStatus("匹配成功: 你是" + (net.host ? "主机(蜀汉)" : "客机(群雄)"), false);
            return;
          }

          if (msg.type === "draftStart") {
            if (Array.isArray(msg.heroPool) && msg.heroPool.length) {
              heroPool.length = 0;
              for (let i = 0; i < msg.heroPool.length; i += 1) {
                heroPool.push(msg.heroPool[i]);
              }
            }
            renderDraftList();
            setNetStatus("请选择 6 人并准备", false);
            return;
          }

          if (msg.type === "draftUpdate") {
            net.remoteReadyA = !!msg.readyA;
            net.remoteReadyB = !!msg.readyB;
            setNetStatus("准备状态 A:" + (net.remoteReadyA ? "Y" : "N") + " B:" + (net.remoteReadyB ? "Y" : "N"), false);
            return;
          }

          if (msg.type === "matchStart") {
            net.host = !!msg.isHost;
            net.side = msg.yourSide === "blue" ? "A" : "B";
            net.readySent = false;
            state.selectedBlueIds = Array.isArray(msg.blueLineup) ? msg.blueLineup.slice(0, PLAYER_COUNT) : [];
            state.selectedRedIds = Array.isArray(msg.redLineup) ? msg.redLineup.slice(0, PLAYER_COUNT) : [];
            draftOverlayEl.classList.remove("show");
            hudEl.style.display = "flex";
            state.inDraft = false;
            resetMatch();
            setNetStatus(net.host ? "联机开赛: 你控蜀汉" : "联机开赛: 你控群雄", false);
            return;
          }

          if (msg.type === "guestInput" && net.host) {
            const incoming = msg.input || {};
            net.remoteInput.w = !!incoming.w;
            net.remoteInput.a = !!incoming.a;
            net.remoteInput.s = !!incoming.s;
            net.remoteInput.d = !!incoming.d;
            net.remoteInput.j = !!incoming.j;
            return;
          }

          if (msg.type === "snapshot" && !net.host) {
            applySnapshot(msg.snapshot);
            return;
          }

          if (msg.type === "opponentLeft") {
            setNetStatus("对手离线，重新匹配中...", true);
            showDraftOverlay();
            return;
          }

          if (msg.type === "error") {
            setNetStatus(msg.message || "服务器错误", false);
          }
        });
      }

      function exitDraft() {
        if (!state.inDraft) return;

        if (net.mode === "online") {
          if (net.socket && net.socket.readyState === WebSocket.OPEN) {
            net.socket.close();
          }
          net.connected = false;
          net.side = null;
          net.host = false;
          net.readySent = false;
          net.waitingSince = 0;
          setMode("solo");
          setNetStatus("已退出联机，切换到单人", false);
          return;
        }

        state.selectedBlueIds = normalizeBlueLineup(
          state.selectedBlueIds.length ? state.selectedBlueIds : parseSavedBlueLineup()
        );
        draftOverlayEl.classList.remove("show");
        hudEl.style.display = "flex";
        state.inDraft = false;
        state.selectedRedIds = [];
        resetMatch();
      }

      function pickHeroId(i, teamTag) {
        if (!heroPool.length) return "lancelot";
        return heroPool[(i + (teamTag === "red" ? 3 : 0)) % heroPool.length];
      }

      function getHeroDef(id) {
        if (heroStore && heroStore.getHeroDefinition) {
          return heroStore.getHeroDefinition(id);
        }
        return null;
      }

      function getHeroName(id) {
        const def = getHeroDef(id);
        if (def && def.name) return def.name;
        return id;
      }

      function parseSavedBlueLineup() {
        try {
          const raw = localStorage.getItem(BLUE_LINEUP_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          const seen = Object.create(null);
          const list = [];
          for (let i = 0; i < parsed.length; i += 1) {
            const id = parsed[i];
            if (!heroPool.includes(id) || seen[id]) continue;
            seen[id] = true;
            list.push(id);
          }
          return list;
        } catch (_err) {
          return [];
        }
      }

      function saveBlueLineup(ids) {
        try {
          localStorage.setItem(BLUE_LINEUP_KEY, JSON.stringify(ids.slice(0, PLAYER_COUNT)));
        } catch (_err) {
          // Ignore storage failures on restricted environments.
        }
      }

      function normalizeBlueLineup(ids) {
        const seen = Object.create(null);
        const normalized = [];
        for (let i = 0; i < ids.length; i += 1) {
          const id = ids[i];
          if (!heroPool.includes(id) || seen[id]) continue;
          seen[id] = true;
          normalized.push(id);
          if (normalized.length >= PLAYER_COUNT) break;
        }
        for (let i = 0; i < heroPool.length && normalized.length < PLAYER_COUNT; i += 1) {
          const id = heroPool[i];
          if (seen[id]) continue;
          seen[id] = true;
          normalized.push(id);
        }
        return normalized.slice(0, PLAYER_COUNT);
      }

      function randomEnemyLineup() {
        const source = heroPool.slice();
        for (let i = source.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = source[i];
          source[i] = source[j];
          source[j] = t;
        }
        const out = [];
        if (!source.length) {
          for (let i = 0; i < PLAYER_COUNT; i += 1) out.push("lancelot");
          return out;
        }
        while (out.length < PLAYER_COUNT) {
          out.push(source[out.length % source.length]);
        }
        return out.slice(0, PLAYER_COUNT);
      }

      function updateDraftHud() {
        draftCountEl.textContent = "已选 " + state.selectedBlueIds.length + "/" + PLAYER_COUNT;
        if (net.mode === "online") {
          startMatchBtn.disabled = state.selectedBlueIds.length !== PLAYER_COUNT || net.readySent;
        } else {
          startMatchBtn.disabled = state.selectedBlueIds.length !== PLAYER_COUNT;
        }
      }

      function renderDraftList() {
        const selectedIndex = Object.create(null);
        for (let i = 0; i < state.selectedBlueIds.length; i += 1) {
          selectedIndex[state.selectedBlueIds[i]] = i + 1;
        }
        draftListEl.innerHTML = "";

        for (let i = 0; i < heroPool.length; i += 1) {
          const id = heroPool[i];
          const def = getHeroDef(id);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "hero-pick" + (selectedIndex[id] ? " on" : "");
          btn.dataset.heroId = id;
          const speed = def && def.stats ? def.stats.speed : "-";
          const hp = def && def.stats ? def.stats.hp : "-";
          const range = def && def.stats ? def.stats.attackRange : "-";
          btn.innerHTML =
            '<div class="hero-name">' + getHeroName(id) + '</div>' +
            '<div class="hero-stat">速度 ' + speed + '<br>血量 ' + hp + '<br>攻击距 ' + range + '</div>' +
            '<div class="hero-order">' + (selectedIndex[id] ? ("第" + selectedIndex[id] + "顺位") : "") + '</div>';
          draftListEl.appendChild(btn);
        }

        updateDraftHud();
      }

      function toggleDraftHero(heroId) {
        if (net.mode === "online") net.readySent = false;
        const idx = state.selectedBlueIds.indexOf(heroId);
        if (idx >= 0) {
          state.selectedBlueIds.splice(idx, 1);
        } else if (state.selectedBlueIds.length < PLAYER_COUNT) {
          state.selectedBlueIds.push(heroId);
        }
        renderDraftList();
      }

      function showDraftOverlay() {
        state.inDraft = true;
        state.paused = false;
        pauseBtn.textContent = "暂停";
        if (net.mode === "online") {
          draftTitleEl.textContent = "联机选我方 6 人首发";
          draftSubEl.textContent = net.host
            ? "你将控制蜀汉联队，锁定阵容后点击准备"
            : "你将控制群雄联队，锁定阵容后点击准备";
          startMatchBtn.textContent = "锁定并准备";
          draftExitBtn.textContent = "退出联机";
        } else {
          draftTitleEl.textContent = "选我方 6 人首发";
          draftSubEl.textContent = "敌方将随机出战，阵容会自动记忆到本机";
          startMatchBtn.textContent = "开赛";
          draftExitBtn.textContent = "跳过选人并开赛";
        }
        draftOverlayEl.classList.add("show");
        hudEl.style.display = "none";
        renderDraftList();
        updateDraftHint();
        refreshActionBar();
      }

      function closeDraftAndStart() {
        if (state.selectedBlueIds.length !== PLAYER_COUNT) return;
        if (net.mode === "online") {
          if (!net.connected || !net.side) {
            setNetStatus("请先连接并匹配对手");
            return;
          }
          sendNet({ type: "setLineup", lineup: state.selectedBlueIds.slice(0, PLAYER_COUNT) });
          sendNet({ type: "ready" });
          net.readySent = true;
          setNetStatus("已准备，等待对手...");
          return;
        }

        saveBlueLineup(state.selectedBlueIds);
        draftOverlayEl.classList.remove("show");
        hudEl.style.display = "flex";
        state.inDraft = false;
        state.selectedRedIds = [];
        resetMatch();
        refreshActionBar();
      }

      function makeHero(teamTag, slot, x, y, forcedId) {
        const id = forcedId || pickHeroId(slot, teamTag);
        if (heroStore && heroStore.createFootballHero) {
          return heroStore.createFootballHero(id, x, y, {
            id: teamTag + "-" + slot,
            team: teamTag,
            dir: teamTag === "blue" ? 0 : Math.PI,
            homeX: x,
            homeY: y
          });
        }

        const base = heroStore && heroStore.createCompanion
          ? heroStore.createCompanion(id, x, y)
          : null;
        const speed = base && base.speed ? base.speed : 210;
        const maxHp = base && base.maxHp ? base.maxHp : 320;
        const damage = base && base.skill && base.skill.damage ? base.skill.damage : 42;
        return {
          id: teamTag + "-" + slot,
          heroId: id,
          name: base && base.name ? base.name : id,
          x: x,
          y: y,
          vx: 0,
          vy: 0,
          dir: teamTag === "blue" ? 0 : Math.PI,
          r: 13,
          team: teamTag,
          speed: clamp(speed * 0.98, 180, 300),
          sprint: clamp(speed * 1.22, 220, 360),
          hp: maxHp,
          maxHp: maxHp,
          damage: clamp(damage * 0.42, 16, 34),
          attackCd: 0,
          hitFlash: 0,
          down: false,
          downTimer: 0,
          recoverTimer: 0,
          mounted: !!(base && base.mounted),
          body: base && base.body ? base.body : (teamTag === "blue" ? "#63b8ff" : "#ff7f71"),
          head: base && base.head ? base.head : "#efcda2",
          accent: base && base.accent ? base.accent : (teamTag === "blue" ? "#d4efff" : "#ffe2c6"),
          homeX: x,
          homeY: y
        };
      }

      function setupTeams() {
        state.blue.length = 0;
        state.red.length = 0;
        const blueIds = normalizeBlueLineup(state.selectedBlueIds);
        const redIds = state.selectedRedIds.length === PLAYER_COUNT
          ? normalizeBlueLineup(state.selectedRedIds)
          : randomEnemyLineup();

        const rows = [0.18, 0.34, 0.5, 0.66, 0.82, 0.5];
        for (let i = 0; i < PLAYER_COUNT; i += 1) {
          const xBlue = i === PLAYER_COUNT - 1 ? 120 : 260 + (i % 2) * 120;
          const y = H * rows[i];
          state.blue.push(makeHero("blue", i, xBlue, y, blueIds[i]));
        }

        for (let i = 0; i < PLAYER_COUNT; i += 1) {
          const xRed = i === PLAYER_COUNT - 1 ? W - 120 : W - 260 - (i % 2) * 120;
          const y = H * rows[i];
          state.red.push(makeHero("red", i, xRed, y, redIds[i]));
        }

        // Each side has one fixed goalkeeper.
        state.blue[PLAYER_COUNT - 1].isGoalkeeper = true;
        state.red[PLAYER_COUNT - 1].isGoalkeeper = true;
        state.blue[PLAYER_COUNT - 1].name = state.blue[PLAYER_COUNT - 1].name + "(门将)";
        state.red[PLAYER_COUNT - 1].name = state.red[PLAYER_COUNT - 1].name + "(门将)";

        // 蓝队第 1 人作为玩家操控的队长。
        state.blue[0].name = state.blue[0].name + "(你)";
      }

      function resetPositions(kickoffTeam) {
        const all = state.blue.concat(state.red);
        for (let i = 0; i < all.length; i += 1) {
          const p = all[i];
          p.x = p.homeX;
          p.y = p.homeY;
          p.vx = 0;
          p.vy = 0;
          p.attackCd = 0;
          p.down = false;
          p.downTimer = 0;
          p.recoverTimer = 0;
          p.hp = p.maxHp;
        }

        state.ball.x = HALF_X;
        state.ball.y = H * 0.5;
        state.ball.vx = kickoffTeam === "blue" ? 90 : -90;
        state.ball.vy = 0;
        state.ball.carrier = null;
        state.craters.length = 0;
        const viewW = window.innerWidth / state.camera.scale;
        const viewH = window.innerHeight / state.camera.scale;
        const minX = -CAMERA_PAD_X;
        const maxX = Math.max(minX, W - viewW + CAMERA_PAD_X);
        const minY = -CAMERA_PAD_Y;
        const maxY = Math.max(minY, H - viewH + CAMERA_PAD_Y);
        state.camera.x = clamp(HALF_X - viewW * 0.5, minX, maxX);
        state.camera.y = clamp(H * 0.5 - viewH * 0.5, minY, maxY);
      }

      function resetMatch() {
        state.blueScore = 0;
        state.redScore = 0;
        state.elapsed = 0;
        state.gameOver = false;
        setupTeams();
        resetPositions("blue");
        refreshHud();
      }

      function resize() {
        const rawDpr = window.devicePixelRatio || 1;
        const dprCap = IS_MOBILE_VIEW ? 1.5 : 2;
        const dpr = Math.max(1, Math.min(rawDpr, dprCap));

        if (IS_MOBILE_VIEW) {
          const shortSide = Math.min(window.innerWidth, window.innerHeight);
          let mobileScale = MOBILE_BASE_SCALE;
          if (shortSide <= 360) mobileScale = 0.52;
          else if (shortSide > 460) mobileScale = 0.6;
          if (window.innerWidth > window.innerHeight) mobileScale += 0.06;
          state.camera.scale = clamp(mobileScale, 0.5, 0.72);
        }

        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function worldToScreen(x, y) {
        const scale = state.camera.scale;
        const offsetX = -state.camera.x * scale;
        const offsetY = -state.camera.y * scale;
        return {
          x: offsetX + x * scale,
          y: offsetY + y * scale,
          scale: scale,
          ox: offsetX,
          oy: offsetY
        };
      }

      function screenToWorld(x, y) {
        const t = worldToScreen(0, 0);
        return {
          x: clamp((x - t.ox) / t.scale, 0, W),
          y: clamp((y - t.oy) / t.scale, 0, H)
        };
      }

      function refreshHud() {
        scoreEl.textContent = "蜀汉联队 " + state.blueScore + " : " + state.redScore + " 群雄联队";
        const remain = Math.max(0, Math.ceil(MATCH_SECONDS - state.elapsed));
        const mm = String(Math.floor(remain / 60)).padStart(2, "0");
        const ss = String(remain % 60).padStart(2, "0");
        clockEl.textContent = mm + ":" + ss;
      }

      function showFlash(text) {
        void text;
      }

      function generateLightningSegs(x1, y1, x2, y2, roughness) {
        const pts = [{ x: x1, y: y1 }];
        for (let i = 1; i < LIGHTNING_POINTS - 1; i += 1) {
          const t = i / (LIGHTNING_POINTS - 1);
          pts.push({
            x: x1 + (x2 - x1) * t + (Math.random() - 0.5) * roughness * 2,
            y: y1 + (y2 - y1) * t
          });
        }
        pts.push({ x: x2, y: y2 });
        return pts;
      }

      function createLightningFx(sx, sy, tx, ty) {
        void sx;
        void sy;
        return {
          kind: "lightning",
          segs: generateLightningSegs(tx, ty - 280, tx, ty, 40),
          tx: tx,
          ty: ty,
          splashR: 52,
          life: 1
        };
      }

      function createSkillFx(kind, sx, sy, tx, ty) {
        const rough = kind === "sunray" ? 14 : (kind === "meteor" ? 26 : (kind === "kame" ? 16 : 20));
        const splash = kind === "sunray"
          ? 52
          : (kind === "pulse"
            ? 44
            : (kind === "meteor"
              ? 78
              : (kind === "kame" ? 58 : (kind === "fire" ? 40 : 34))));
        const life = kind === "sunray"
          ? 1.08
          : (kind === "meteor" ? 1.18 : (kind === "kame" ? 1.02 : 0.92));
        return {
          kind: kind,
          sx: sx,
          sy: sy,
          segs: generateLightningSegs(sx, sy, tx, ty, rough),
          tx: tx,
          ty: ty,
          splashR: splash,
          life: life,
          maxLife: life
        };
      }

      function pushLightningFx(sx, sy, tx, ty) {
        if (state.skillFx.length >= MAX_SKILL_FX) {
          state.skillFx.splice(0, state.skillFx.length - MAX_SKILL_FX + 1);
        }
        state.skillFx.push(createLightningFx(sx, sy, tx, ty));
      }

      function updateSkillFx(dt) {
        if (state.skillFx.length > MAX_SKILL_FX) {
          state.skillFx.splice(0, state.skillFx.length - MAX_SKILL_FX);
        }
        for (let i = state.skillFx.length - 1; i >= 0; i -= 1) {
          const fx = state.skillFx[i];
          const kind = fx.kind || "lightning";
          const decay = kind === "lightning"
            ? 3.1
            : (kind === "sunray" ? 1.9 : (kind === "meteor" ? 1.5 : 2.25));
          fx.life -= dt * decay;
          if (fx.life <= 0) state.skillFx.splice(i, 1);
        }
      }

      function spawnCrater(x, y, r) {
        if (state.craters.length >= MAX_CRATERS) {
          state.craters.splice(0, state.craters.length - MAX_CRATERS + 1);
        }
        state.craters.push({
          x: clamp(x, 40, W - 40),
          y: clamp(y, 40, H - 40),
          r: clamp(r, 30, 90),
          life: 24
        });
      }

      function updateCraters(dt) {
        for (let i = state.craters.length - 1; i >= 0; i -= 1) {
          state.craters[i].life -= dt;
          if (state.craters[i].life <= 0) state.craters.splice(i, 1);
        }
      }

      function applyAreaImpact(enemies, x, y, radius, damage, attacker) {
        for (let i = 0; i < enemies.length; i += 1) {
          const e = enemies[i];
          if (!e || e.down) continue;
          const dx = e.x - x;
          const dy = e.y - y;
          const d = Math.hypot(dx, dy);
          if (d > radius) continue;
          const ratio = 1 - d / radius;
          e.hp -= damage * (0.35 + ratio * 0.65);
          e.hitFlash = Math.max(e.hitFlash || 0, 0.6);
          const nx = d > 0.001 ? dx / d : Math.cos((attacker && attacker.dir) || 0);
          const ny = d > 0.001 ? dy / d : Math.sin((attacker && attacker.dir) || 0);
          e.vx += nx * (120 + 170 * ratio);
          e.vy += ny * (100 + 130 * ratio);
          if (e.hp <= 0 && !e.down) {
            e.down = true;
            e.downTimer = DOWN_KNOCKOUT;
            e.hp = 0;
            if (state.ball.carrier === e) state.ball.carrier = null;
          }
        }

        const bdx = state.ball.x - x;
        const bdy = state.ball.y - y;
        const bd = Math.hypot(bdx, bdy);
        if (bd <= radius * 1.15) {
          const n = bd > 0.001 ? { x: bdx / bd, y: bdy / bd } : normalize(Math.cos((attacker && attacker.dir) || 0), Math.sin((attacker && attacker.dir) || 0));
          const force = (1 - Math.min(1, bd / (radius * 1.15))) * 320;
          if (!state.ball.carrier) {
            state.ball.vx += n.x * force;
            state.ball.vy += n.y * force;
          }
        }
      }

      function runZhugeSkillLikeOrigin(team, enemies, dt) {
        if (!heroDetail || !heroDetail.updateZhugeliangAlly) return;
        for (let i = 0; i < team.length; i += 1) {
          const p = team[i];
          if (p.down || p.heroId !== "zhugeliang") continue;

          heroDetail.updateZhugeliangAlly({
            hero: p,
            dt: dt,
            player: p,
            enemyUnits: enemies,
            enemyLeaders: [],
            dist: dist,
            moveToward: function (h, x, y, speed, delta) {
              movePlayer(h, x, y, speed, delta);
            },
            createLightningFx: createLightningFx,
            skillFx: state.skillFx
          });
        }
      }

      function drawSkillFx(t) {
        const minX = -90;
        const minY = -90;
        const maxX = window.innerWidth + 90;
        const maxY = window.innerHeight + 90;
        const lowPowerMode = IS_MOBILE_VIEW && (state.frameMsEma > 19.5 || state.skillFx.length > 10);
        for (let i = 0; i < state.skillFx.length; i += 1) {
          const fx = state.skillFx[i];
          const kind = fx.kind || "lightning";
          const mapped = {
            life: fx.life,
            maxLife: fx.maxLife || 1,
            sx: t.ox + (fx.sx !== undefined ? fx.sx : fx.tx) * t.scale,
            sy: t.oy + (fx.sy !== undefined ? fx.sy : fx.ty) * t.scale,
            tx: t.ox + fx.tx * t.scale,
            ty: t.oy + fx.ty * t.scale,
            splashR: fx.splashR * t.scale,
            segs: []
          };
          for (let j = 0; j < fx.segs.length; j += 1) {
            mapped.segs.push({
              x: t.ox + fx.segs[j].x * t.scale,
              y: t.oy + fx.segs[j].y * t.scale
            });
          }

          if (mapped.tx < minX || mapped.tx > maxX || mapped.ty < minY || mapped.ty > maxY) {
            continue;
          }

          if (kind === "meteor") {
            const p = 1 - clamp(mapped.life / Math.max(0.001, mapped.maxLife), 0, 1);
            const fromX = mapped.tx + (mapped.sx - mapped.tx) * (1 - p * 0.9);
            const fromY = (mapped.ty - 320 * t.scale) + (mapped.ty - (mapped.ty - 320 * t.scale)) * p;
            const r = Math.max(4, (5 + p * 9) * t.scale);

            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            ctx.strokeStyle = "rgba(255,142,86," + (0.45 + mapped.life * 0.45) + ")";
            ctx.lineWidth = Math.max(2, 5 * t.scale);
            ctx.shadowColor = "rgba(255,110,56," + (0.45 + mapped.life * 0.4) + ")";
            ctx.shadowBlur = Math.max(6, 14 * t.scale);
            ctx.beginPath();
            ctx.moveTo(fromX, fromY - 18 * t.scale);
            ctx.lineTo(mapped.tx, mapped.ty);
            ctx.stroke();

            ctx.fillStyle = "rgba(92,72,58," + (0.8 + mapped.life * 0.12) + ")";
            ctx.beginPath();
            ctx.arc(fromX, fromY, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "rgba(255,173,108," + (mapped.life * 0.95) + ")";
            ctx.lineWidth = Math.max(1.8, 3 * t.scale);
            ctx.beginPath();
            ctx.arc(mapped.tx, mapped.ty, mapped.splashR * (0.55 + p * 0.7), 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
            continue;
          }

          if (kind === "fire") {
            const n = normalize(mapped.tx - mapped.sx, mapped.ty - mapped.sy);
            const px = -n.y;
            const py = n.x;
            const spread = Math.max(6, 14 * t.scale);

            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            ctx.fillStyle = "rgba(255,120,62," + (mapped.life * 0.78) + ")";
            ctx.beginPath();
            ctx.moveTo(mapped.sx + px * spread * 0.26, mapped.sy + py * spread * 0.26);
            ctx.lineTo(mapped.sx - px * spread * 0.26, mapped.sy - py * spread * 0.26);
            ctx.lineTo(mapped.tx - px * spread, mapped.ty - py * spread);
            ctx.lineTo(mapped.tx + px * spread, mapped.ty + py * spread);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = "rgba(255,220,136," + (mapped.life * 0.88) + ")";
            ctx.lineWidth = Math.max(1.4, 2.4 * t.scale);
            ctx.beginPath();
            ctx.moveTo(mapped.sx, mapped.sy);
            ctx.lineTo(mapped.tx, mapped.ty);
            ctx.stroke();

            for (let pIdx = 0; pIdx < 3; pIdx += 1) {
              const q = (pIdx + 1) / 4;
              const fxX = mapped.sx + (mapped.tx - mapped.sx) * q + (Math.random() - 0.5) * spread;
              const fxY = mapped.sy + (mapped.ty - mapped.sy) * q + (Math.random() - 0.5) * spread;
              ctx.fillStyle = "rgba(255,183,93," + (mapped.life * (0.6 - pIdx * 0.12)) + ")";
              ctx.beginPath();
              ctx.arc(fxX, fxY, Math.max(1.2, (3.2 - pIdx) * t.scale), 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
            continue;
          }

          if (kind === "lightning" && renderStd && renderStd.drawLightningFx && (!IS_MOBILE_VIEW || !lowPowerMode)) {
            renderStd.drawLightningFx(ctx, mapped);
          } else {
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            let stroke = "rgba(255,164,198," + (fx.life * 0.92) + ")";
            if (kind === "sunray") stroke = "rgba(255,120,96," + (fx.life * 0.98) + ")";
            else if (kind === "pulse") stroke = "rgba(255,226,130," + (fx.life * 0.96) + ")";
            else if (kind === "meteor") stroke = "rgba(255,120,62," + (fx.life * 0.98) + ")";
            else if (kind === "kame") stroke = "rgba(121,220,255," + (fx.life * 0.95) + ")";
            else if (kind === "fire") stroke = "rgba(255,124,72," + (fx.life * 0.94) + ")";
            else if (kind === "arrow") stroke = "rgba(166,255,234," + (fx.life * 0.9) + ")";
            ctx.strokeStyle = stroke;
            ctx.shadowColor = stroke;
            const blurBase = lowPowerMode
              ? (kind === "sunray" ? 8 : 6)
              : (IS_MOBILE_VIEW
                ? (kind === "sunray" ? 14 : (kind === "meteor" ? 16 : 10))
                : (kind === "sunray" ? 20 : (kind === "meteor" ? 24 : 15)));
            ctx.shadowBlur = Math.max(5, blurBase * t.scale);
            ctx.lineWidth = Math.max(1.8, (kind === "sunray" ? 4.8 : 3.6) * t.scale);
            ctx.beginPath();
            ctx.moveTo(mapped.segs[0].x, mapped.segs[0].y);
            for (let k = 1; k < mapped.segs.length; k += 1) {
              ctx.lineTo(mapped.segs[k].x, mapped.segs[k].y);
            }
            ctx.stroke();

            ctx.shadowBlur = Math.max(3, 8 * t.scale);
            ctx.strokeStyle = "rgba(255,255,255," + (fx.life * 0.9) + ")";
            ctx.lineWidth = Math.max(1.2, 2 * t.scale);
            ctx.beginPath();
            ctx.moveTo(mapped.segs[0].x, mapped.segs[0].y);
            for (let k = 1; k < mapped.segs.length; k += 1) {
              ctx.lineTo(mapped.segs[k].x, mapped.segs[k].y);
            }
            ctx.stroke();

            ctx.strokeStyle = stroke;
            ctx.lineWidth = Math.max(1.4, 2.6 * t.scale);
            ctx.beginPath();
            ctx.arc(mapped.tx, mapped.ty, mapped.splashR * (0.65 + (1 - fx.life) * 0.45), 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "rgba(255,255,255," + (fx.life * 0.4) + ")";
            ctx.beginPath();
            ctx.arc(mapped.tx, mapped.ty, Math.max(1.5, 4.2 * t.scale), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          if (kind === "lightning" && (ENABLE_LIGHTNING_OVERLAY || (IS_MOBILE_VIEW && !lowPowerMode))) {
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            ctx.strokeStyle = "rgba(210,240,255," + (fx.life * 0.55) + ")";
            ctx.shadowColor = "rgba(170,225,255," + (fx.life * 0.7) + ")";
            ctx.shadowBlur = Math.max(6, 13 * t.scale);
            ctx.lineWidth = Math.max(1.4, 2.1 * t.scale);
            ctx.beginPath();
            ctx.moveTo(mapped.segs[0].x, mapped.segs[0].y);
            for (let k = 1; k < mapped.segs.length; k += 1) {
              ctx.lineTo(mapped.segs[k].x, mapped.segs[k].y);
            }
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      function runUSASkillPack(team, enemies, dt) {
        if (!heroDetail || !heroDetail.updateCompanion) return;
        const activeIds = {
          sunshangxiang: true,
          blackwidow: true,
          ironman: true,
          homelander: true,
          hawkeye: true,
          supersaiyan: true,
          liuxiu: true,
          diablo: true
        };
        const teamLeader = team && team.length ? team[0] : null;

        function nearestEnemy(hero, range) {
          let target = null;
          let best = Infinity;
          for (let i = 0; i < enemies.length; i += 1) {
            const e = enemies[i];
            if (!e || e.down) continue;
            const d = dist(hero, e);
            if (d < range && d < best) {
              target = e;
              best = d;
            }
          }
          return target ? { target: target, d: best } : null;
        }

        for (let i = 0; i < team.length; i += 1) {
          const p = team[i];
          if (!p || p.down || !activeIds[p.heroId]) continue;

          heroDetail.updateCompanion({
            hero: p,
            dt: dt,
            player: teamLeader || p,
            dist: dist,
            nearestEnemy: nearestEnemy,
            moveToward: function (h, x, y, speed, delta) {
              movePlayer(h, x, y, speed, delta);
            },
            fireArrow: function (h, target, damage) {
              if (!target || target.down) return;
              target.hp -= damage;
              if (target.hitFlash !== undefined) {
                target.hitFlash = Math.max(target.hitFlash || 0, 0.55);
              }
              if (state.skillFx.length >= MAX_SKILL_FX) {
                state.skillFx.splice(0, state.skillFx.length - MAX_SKILL_FX + 1);
              }
              state.skillFx.push(createSkillFx("arrow", h.x, h.y - 8, target.x, target.y - 8));
            },
            applyAreaImpact: function (x, y, radius, damage, attacker) {
              applyAreaImpact(enemies, x, y, radius, damage, attacker || p);
            },
            spawnCrater: spawnCrater,
            skillFx: state.skillFx,
            createSkillFx: createSkillFx
          });
        }
      }

      function nearestAlive(list, target) {
        let best = null;
        let bestD = Infinity;
        for (let i = 0; i < list.length; i += 1) {
          const p = list[i];
          if (p.down) continue;
          const d = dist(p, target);
          if (d < bestD) {
            best = p;
            bestD = d;
          }
        }
        return { unit: best, d: bestD };
      }

      function applyDamage(target, amount, n) {
        target.hp -= amount;
        target.hitFlash = 0.45;
        if (n) {
          target.vx += n.x * 170;
          target.vy += n.y * 170;
        }

        if (target.hp <= 0 && !target.down) {
          target.down = true;
          target.downTimer = DOWN_KNOCKOUT;
          target.hp = 0;
          if (state.ball.carrier === target) {
            state.ball.carrier = null;
            if (n) {
              state.ball.vx = n.x * 190;
              state.ball.vy = n.y * 120;
            }
          }
        }
      }

      function tryTackle(attacker, enemyList, dt) {
        if (attacker.down) return;
        attacker.attackCd = Math.max(0, attacker.attackCd - dt);
        if (attacker.attackCd > 0) return;

        let target = null;
        let bestD = 32;
        for (let i = 0; i < enemyList.length; i += 1) {
          const e = enemyList[i];
          if (e.down) continue;
          const d = dist(attacker, e);
          if (d < bestD) {
            bestD = d;
            target = e;
          }
        }

        if (!target) return;
        attacker.attackCd = 0.62;
        const n = normalize(target.x - attacker.x, target.y - attacker.y);
        applyDamage(target, attacker.damage, n);
      }

      function carryBallLogic(p) {
        const dir = normalize(Math.cos(p.dir), Math.sin(p.dir));
        state.ball.x = p.x + dir.x * (p.r + 11);
        state.ball.y = p.y + dir.y * (p.r + 8);
        state.ball.vx = p.vx;
        state.ball.vy = p.vy;
      }

      function pickBallIfClose(list) {
        if (state.ball.carrier) return;
        for (let i = 0; i < list.length; i += 1) {
          const p = list[i];
          if (p.down) continue;
          const catchBonus = p.isGoalkeeper ? 8 : 0;
          if (dist(p, state.ball) < p.r + state.ball.r + 2 + catchBonus) {
            state.ball.carrier = p;
            return;
          }
        }
      }

      function movePlayer(p, tx, ty, speed, dt) {
        const dx = tx - p.x;
        const dy = ty - p.y;
        const d = Math.hypot(dx, dy);
        if (d < 1) return;
        const step = Math.min(d, speed * dt);
        const nx = dx / d;
        const ny = dy / d;
        p.x += nx * step;
        p.y += ny * step;
        p.dir = Math.atan2(ny, nx);
      }

      function updateDownState(p, dt) {
        p.hitFlash = Math.max(0, p.hitFlash - dt * 1.7);
        if (!p.down) return;

        p.downTimer -= dt;
        p.vx *= 0.88;
        p.vy *= 0.88;

        if (p.downTimer > 0) return;

        p.recoverTimer += dt;
        p.hp = Math.min(p.maxHp * REVIVE_HP_RATIO, p.hp + p.maxHp * 0.12 * dt);
        if (p.recoverTimer > 2.1 && p.hp >= p.maxHp * REVIVE_HP_RATIO) {
          p.down = false;
          p.recoverTimer = 0;
          p.vx = 0;
          p.vy = 0;
        }
      }

      function updateUserCaptain(dt) {
        const p = state.blue[0];
        updateManualCaptain(p, input, state.red, dt);
      }

      function updateManualCaptain(p, ctrl, enemies, dt) {
        if (!p || p.down) return;

        let mx = 0;
        let my = 0;
        if (ctrl.w) my -= 1;
        if (ctrl.s) my += 1;
        if (ctrl.a) mx -= 1;
        if (ctrl.d) mx += 1;

        if (mx !== 0 || my !== 0) {
          const n = normalize(mx, my);
          movePlayer(p, p.x + n.x * 100, p.y + n.y * 100, p.sprint, dt);
        } else if (ctrl === input && state.pointerTarget) {
          movePlayer(p, state.pointerTarget.x, state.pointerTarget.y, p.speed, dt);
        }

        if (ctrl.j) {
          tryTackle(p, enemies, dt);
        }

      }

      function getAttackTarget(p, mates, enemies) {
        if (p.down) return null;

        if (p.isGoalkeeper) {
          const goalX = p.team === "blue" ? 64 : (W - 64);
          const lineY = clamp(state.ball.y, H * 0.5 - GOAL_H * 0.58, H * 0.5 + GOAL_H * 0.58);
          const nearOwnGoal = p.team === "blue" ? (state.ball.x < 260) : (state.ball.x > W - 260);
          const closeToBall = dist(p, state.ball) < 120;
          if ((nearOwnGoal || closeToBall) && !state.ball.carrier) {
            return { x: state.ball.x, y: state.ball.y };
          }
          if (state.ball.carrier && state.ball.carrier.team !== p.team) {
            const carrier = state.ball.carrier;
            const danger = p.team === "blue" ? (carrier.x < 300) : (carrier.x > W - 300);
            if (danger) return { x: carrier.x, y: carrier.y };
          }
          return { x: goalX, y: lineY };
        }

        const carrier = state.ball.carrier;
        if (carrier && carrier.team !== p.team && !carrier.down) {
          return carrier;
        }

        if (!carrier) {
          return state.ball;
        }

        if (carrier.team === p.team) {
          const gx = p.team === "blue" ? W : 0;
          const gy = H * 0.5;
          const laneBias = (mates.indexOf(p) - 2.5) * 52;
          return { x: (carrier.x + gx) * 0.5, y: clamp((carrier.y + gy) * 0.5 + laneBias, 34, H - 34) };
        }

        return carrier;
      }

      function updateAiTeam(team, enemies, dt, isBlue, skipFirst) {
        for (let i = 0; i < team.length; i += 1) {
          const p = team[i];
          if ((isBlue && i === 0) || (skipFirst && i === 0)) continue;

          if (p.down) continue;

          const target = getAttackTarget(p, team, enemies);
          if (target) {
            const fast = state.ball.carrier === p ? p.sprint : p.speed;
            movePlayer(p, target.x, target.y, fast, dt);
          }

          if (state.ball.carrier === p) {
            if (p.isGoalkeeper) {
              const clearX = p.team === "blue" ? W - 180 : 180;
              const clearY = H * (0.35 + Math.random() * 0.3);
              const n = normalize(clearX - p.x, clearY - p.y);
              state.ball.carrier = null;
              state.ball.vx = n.x * 520;
              state.ball.vy = n.y * 400;
              continue;
            }
          }

          tryTackle(p, enemies, dt);
        }
      }

      function integratePhysics(list, dt) {
        for (let i = 0; i < list.length; i += 1) {
          const p = list[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= p.down ? 0.88 : 0.8;
          p.vy *= p.down ? 0.88 : 0.8;
          p.x = clamp(p.x, 22, W - 22);
          p.y = clamp(p.y, 22, H - 22);
        }
      }

      function keepSeparation(all, dt) {
        for (let i = 0; i < all.length; i += 1) {
          for (let j = i + 1; j < all.length; j += 1) {
            const a = all[i];
            const b = all[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const d = Math.hypot(dx, dy) || 0.001;
            const minD = (a.down || b.down) ? 20 : 24;
            if (d >= minD) continue;
            const push = (minD - d) * 0.5;
            const nx = dx / d;
            const ny = dy / d;
            a.x -= nx * push * dt * 36;
            a.y -= ny * push * dt * 36;
            b.x += nx * push * dt * 36;
            b.y += ny * push * dt * 36;
          }
        }
      }

      function updateBall(dt) {
        if (state.ball.carrier && state.ball.carrier.down) {
          state.ball.carrier = null;
        }

        function checkGoalScored() {
          const inGoalMouth = state.ball.y > (H - GOAL_H) * 0.5 && state.ball.y < (H + GOAL_H) * 0.5;
          if (!inGoalMouth) return false;

          if (state.ball.x < 0) {
            state.redScore += 1;
            showFlash("群雄联队 破门!");
            resetPositions("blue");
            return true;
          }
          if (state.ball.x > W) {
            state.blueScore += 1;
            showFlash("蜀汉联队 破门!");
            resetPositions("red");
            return true;
          }
          return false;
        }

        if (state.ball.carrier) {
          carryBallLogic(state.ball.carrier);
          if (checkGoalScored()) return;
          return;
        }

        state.ball.x += state.ball.vx * dt;
        state.ball.y += state.ball.vy * dt;
        state.ball.vx *= 0.992;
        state.ball.vy *= 0.992;

        if (state.ball.y < 14) {
          state.ball.y = 14;
          state.ball.vy *= -0.78;
        }
        if (state.ball.y > H - 14) {
          state.ball.y = H - 14;
          state.ball.vy *= -0.78;
        }

        if (checkGoalScored()) return;

        if (state.ball.x < 10) {
          state.ball.x = 10;
          state.ball.vx *= -0.82;
        }
        if (state.ball.x > W - 10) {
          state.ball.x = W - 10;
          state.ball.vx *= -0.82;
        }
      }

      function updateCamera() {
        const p = state.blue[0];
        if (!p) return;
        const viewW = window.innerWidth / state.camera.scale;
        const viewH = window.innerHeight / state.camera.scale;
        const minX = -CAMERA_PAD_X;
        const maxX = Math.max(minX, W - viewW + CAMERA_PAD_X);
        const minY = -CAMERA_PAD_Y;
        const maxY = Math.max(minY, H - viewH + CAMERA_PAD_Y);
        const b = state.ball;
        const dx = b.x - p.x;
        const dy = b.y - p.y;
        const d = Math.hypot(dx, dy);
        const ballWeight = d > 180 ? 0.32 : 0.18;
        const focusX = p.x * (1 - ballWeight) + b.x * ballWeight;
        const focusY = p.y * (1 - ballWeight) + b.y * ballWeight;
        const tx = clamp(focusX - viewW * 0.5, minX, maxX);
        const ty = clamp(focusY - viewH * 0.5, minY, maxY);
        state.camera.x += (tx - state.camera.x) * state.camera.smooth;
        state.camera.y += (ty - state.camera.y) * state.camera.smooth;
      }

      function update(dt) {
        if (state.inDraft || state.paused || state.gameOver) return;

        if (net.mode === "online" && !net.host) {
          refreshHud();
          return;
        }

        state.elapsed += dt;
        if (state.elapsed >= MATCH_SECONDS) {
          state.gameOver = true;
          if (state.blueScore > state.redScore) showFlash("比赛结束: 蜀汉联队胜利!");
          else if (state.blueScore < state.redScore) showFlash("比赛结束: 群雄联队胜利!");
          else showFlash("比赛结束: 平局!");
        }

        const all = state.blue.concat(state.red);

        for (let i = 0; i < all.length; i += 1) {
          all[i].attackCd = Math.max(0, (all[i].attackCd || 0) - dt);
          all[i].dead = !!all[i].down;
          updateDownState(all[i], dt);
        }

        if (net.mode === "online") {
          updateManualCaptain(state.blue[0], input, state.red, dt);
          updateManualCaptain(state.red[0], net.remoteInput, state.blue, dt);
          updateAiTeam(state.blue, state.red, dt, true, false);
          updateAiTeam(state.red, state.blue, dt, false, true);
        } else {
          updateUserCaptain(dt);
          updateAiTeam(state.blue, state.red, dt, true, false);
          updateAiTeam(state.red, state.blue, dt, false, false);
        }
        runZhugeSkillLikeOrigin(state.blue, state.red, dt);
        runZhugeSkillLikeOrigin(state.red, state.blue, dt);
        runUSASkillPack(state.blue, state.red, dt);
        runUSASkillPack(state.red, state.blue, dt);

        integratePhysics(state.blue, dt);
        integratePhysics(state.red, dt);
        keepSeparation(all, dt);

        pickBallIfClose(state.blue);
        pickBallIfClose(state.red);
        updateBall(dt);
        updateSkillFx(dt);
        updateCraters(dt);
        updateCamera();

        refreshHud();

        if (net.mode === "online" && net.host && net.connected) {
          net.snapshotTimer += dt;
          if (net.snapshotTimer >= 1 / 20) {
            net.snapshotTimer = 0;
            sendNet({ type: "snapshot", snapshot: serializeStateSnapshot() });
          }
        }
      }

      function drawField(t) {
        const scale = t.scale;
        const ox = t.ox;
        const oy = t.oy;

        ctx.fillStyle = "#1c2e1f";
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        const grad = ctx.createLinearGradient(0, oy, 0, oy + H * scale);
        grad.addColorStop(0, "#3f7a3d");
        grad.addColorStop(1, "#2b5e2c");
        ctx.fillStyle = grad;
        ctx.fillRect(ox, oy, W * scale, H * scale);

        ctx.globalAlpha = 0.22;
        for (let i = 0; i < 12; i += 1) {
          ctx.fillStyle = i % 2 ? "#7ab35c" : "#244924";
          ctx.fillRect(ox + (W / 12) * i * scale, oy, (W / 12) * scale, H * scale);
        }
        ctx.globalAlpha = 1;

        for (let i = 0; i < state.craters.length; i += 1) {
          const c = state.craters[i];
          const alpha = Math.max(0.18, Math.min(0.44, c.life / 24 * 0.44));
          ctx.fillStyle = "rgba(58,38,30," + alpha + ")";
          ctx.beginPath();
          ctx.ellipse(ox + c.x * scale, oy + c.y * scale, c.r * scale, c.r * 0.72 * scale, 0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(88,60,42," + (alpha * 0.9) + ")";
          ctx.lineWidth = Math.max(1.2, 2.2 * scale);
          ctx.stroke();
        }

        ctx.strokeStyle = "rgba(245, 240, 218, 0.86)";
        ctx.lineWidth = Math.max(2, 3 * scale);
        ctx.strokeRect(ox, oy, W * scale, H * scale);

        ctx.beginPath();
        ctx.moveTo(ox + HALF_X * scale, oy);
        ctx.lineTo(ox + HALF_X * scale, oy + H * scale);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ox + HALF_X * scale, oy + H * 0.5 * scale, 92 * scale, 0, Math.PI * 2);
        ctx.stroke();

        const gy = (H - GOAL_H) * 0.5;
        ctx.strokeRect(ox - 10 * scale, oy + gy * scale, 10 * scale, GOAL_H * scale);
        ctx.strokeRect(ox + W * scale, oy + gy * scale, 10 * scale, GOAL_H * scale);
      }

      function drawHero(p, t) {
        const sx = t.ox + p.x * t.scale;
        const sy = t.oy + p.y * t.scale;
        const r = p.r * t.scale;
        const visualScale = p.heroId === "diablo" ? 2 : 1;
        const allyNameColor = "#9dd9ff";
        const enemyNameColor = "#ff8b8b";
        const allyHpColor = "#7fd2ff";
        const enemyHpColor = "#ffb0a0";
        const downHpColor = "#ffd789";

        if (p.down) {
          ctx.fillStyle = "rgba(30, 20, 20, 0.35)";
          ctx.beginPath();
          ctx.ellipse(sx, sy + r * 0.62, r * 1.2, r * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        if (renderStd && renderStd.drawUprightUnit) {
          const bodyColor = p.body;
          const accentColor = p.accent;
          const scaleBoost = 0.95 + t.scale * 0.25;

          const specialDrawMap = {
            zhugeliang: heroDetail && heroDetail.drawZhugeliangHero,
            lancelot: heroDetail && heroDetail.drawLancelotHero,
            sunshangxiang: heroDetail && heroDetail.drawSunshangxiang,
            daqiao: heroDetail && heroDetail.drawDaqiao,
            xiaoqiao: heroDetail && heroDetail.drawXiaoqiao,
            elizabeth: heroDetail && heroDetail.drawElizabeth,
            blackwidow: heroDetail && heroDetail.drawBlackwidowHero,
            ironman: heroDetail && heroDetail.drawIronmanHero,
            homelander: heroDetail && heroDetail.drawHomelanderHero,
            hawkeye: heroDetail && heroDetail.drawHawkeyeHero,
            supersaiyan: heroDetail && heroDetail.drawSupersaiyanHero,
            liuxiu: heroDetail && heroDetail.drawLiuxiuHero,
            diablo: heroDetail && heroDetail.drawDiabloHero,
            zhangliao: heroDetail && heroDetail.drawEnemyGeneralHero,
            caocao: heroDetail && heroDetail.drawEnemyGeneralHero,
            xuchu: heroDetail && heroDetail.drawEnemyGeneralHero
          };

          const specialDrawFn = !p.down ? specialDrawMap[p.heroId] : null;
          const canUseSpecialDraw = !!specialDrawFn;

          if (canUseSpecialDraw) {
            const drawHealthBarScreen = function (x, y, w, hp, maxHp, color) {
              const barW = Math.max(20, w * Math.max(0.72, t.scale) * (p.heroId === "diablo" ? 1.28 : 1));
              const barH = Math.max(3, 4 * t.scale);
              const ratio = clamp(hp / Math.max(1, maxHp), 0, 1);
              const teamColor = p.down ? downHpColor : (p.team === "red" ? enemyHpColor : allyHpColor);
              ctx.fillStyle = "rgba(0,0,0,0.54)";
              ctx.fillRect(x - barW * 0.5, y, barW, barH);
              void color;
              ctx.fillStyle = teamColor;
              ctx.fillRect(x - barW * 0.5 + 1, y + 1, (barW - 2) * ratio, Math.max(1, barH - 2));
            };

            ctx.save();
            ctx.fillStyle = p.team === "blue" ? "rgba(96,184,255,0.35)" : "rgba(255,126,104,0.35)";
            ctx.beginPath();
            ctx.ellipse(sx, sy + r * 0.72, r * 0.94 * visualScale, r * 0.36 * visualScale, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            const specialOpts = {
              hero: {
                x: sx,
                y: sy,
                dir: p.dir,
                hitFlash: p.hitFlash,
                hp: p.hp,
                maxHp: p.maxHp,
                name: p.name,
                slashTimer: p.slashTimer || 0,
                weaponType: p.weaponType || "saber",
                sizeScale: visualScale
              },
              ctx: ctx,
              drawHealthBar: drawHealthBarScreen,
              showName: false
            };

            if (p.heroId === "xiaoqiao") {
              specialOpts.drawSoldier = function (entity, _isFemale, body, accent) {
                renderStd.drawUprightUnit(ctx, {
                  x: entity.x,
                  y: entity.y,
                  dir: entity.dir,
                  mounted: false,
                  body: body || entity.body,
                  head: entity.head || p.head,
                  accent: accent || entity.accent
                }, {
                  unitScale: scaleBoost,
                  hideHeadband: false,
                  shadowColor: "rgba(0,0,0,0.25)"
                });
              };
            }

            specialDrawFn(specialOpts);

            const shortName = p.name.length > 8 ? p.name.slice(0, 8) : p.name;
            ctx.fillStyle = p.team === "red" ? enemyNameColor : allyNameColor;
            ctx.font = "700 " + Math.max(10, 12 * t.scale) + "px Microsoft YaHei";
            ctx.textAlign = "center";
            const nameOffset = p.heroId === "diablo" ? 52 : 31;
            ctx.fillText(shortName, sx, sy - nameOffset * Math.max(0.78, t.scale));

            return;
          }

          ctx.save();
          ctx.fillStyle = p.team === "blue" ? "rgba(96,184,255,0.35)" : "rgba(255,126,104,0.35)";
          ctx.beginPath();
          ctx.ellipse(sx, sy + r * 0.72, r * 0.94, r * 0.36, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          if (p.down) {
            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(p.team === "blue" ? -1.02 : 1.02);
            renderStd.drawUprightUnit(ctx, {
              x: 0,
              y: 0,
              dir: p.dir,
              mounted: false,
              body: bodyColor,
              head: p.head,
              accent: accentColor
            }, {
              unitScale: scaleBoost,
              hideHeadband: false,
              shadowColor: "rgba(0,0,0,0.3)",
              shadowRX: 7,
              shadowRY: 2.2
            });
            ctx.restore();
          } else {
            renderStd.drawUprightUnit(ctx, {
              x: sx,
              y: sy,
              dir: p.dir,
              mounted: p.mounted,
              body: bodyColor,
              head: p.head,
              accent: accentColor
            }, {
              unitScale: scaleBoost,
              hideHeadband: false,
              mountLegs: true
            });
          }

          if (p.hitFlash > 0) {
            ctx.fillStyle = "rgba(255, 240, 220, " + (p.hitFlash * 0.6) + ")";
            ctx.beginPath();
            ctx.arc(sx, sy, r * 1.24, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          ctx.save();
          ctx.translate(sx, sy);
          if (p.down) ctx.rotate(p.team === "blue" ? -0.9 : 0.9);

          ctx.fillStyle = p.body;
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = p.head;
          ctx.beginPath();
          ctx.arc(0, -r * 0.68, r * 0.55, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = p.accent;
          ctx.lineWidth = Math.max(1, 2 * t.scale);
          ctx.beginPath();
          ctx.moveTo(-r * 0.9, r * 0.2);
          ctx.lineTo(r * 0.9, r * 0.2);
          ctx.stroke();

          if (p.hitFlash > 0) {
            ctx.fillStyle = "rgba(255, 240, 220, " + (p.hitFlash * 0.6) + ")";
            ctx.beginPath();
            ctx.arc(0, 0, r * 1.24, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }

        const barW = 36 * t.scale;
        const barH = Math.max(3, 4 * t.scale);
        const bx = sx - barW * 0.5;
        const by = sy - r - 12 * t.scale;
        const ratio = clamp(p.hp / Math.max(1, p.maxHp), 0, 1);

        ctx.fillStyle = "rgba(0,0,0,0.54)";
        ctx.fillRect(bx, by, barW, barH);
        ctx.fillStyle = p.down ? downHpColor : (p.team === "red" ? enemyHpColor : allyHpColor);
        ctx.fillRect(bx + 1, by + 1, (barW - 2) * ratio, Math.max(1, barH - 2));

        ctx.fillStyle = p.team === "red" ? enemyNameColor : allyNameColor;
        ctx.font = "600 " + Math.max(10, 11 * t.scale) + "px Microsoft YaHei";
        ctx.textAlign = "center";
        const shortName = p.name.length > 8 ? p.name.slice(0, 8) : p.name;
        ctx.fillText(shortName, sx, by - 3 * t.scale);

      }

      function drawBall(t) {
        const sx = t.ox + state.ball.x * t.scale;
        const sy = t.oy + state.ball.y * t.scale;
        const r = state.ball.r * t.scale;
        ctx.fillStyle = "#f7f2de";
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#754f34";
        ctx.lineWidth = Math.max(1, 1.5 * t.scale);
        ctx.beginPath();
        ctx.arc(sx, sy, r * 0.56, 0, Math.PI * 2);
        ctx.stroke();
      }

      function draw() {
        const t = worldToScreen(0, 0);
        drawField(t);

        const all = state.blue.concat(state.red);
        for (let i = 0; i < all.length; i += 1) {
          drawHero(all[i], t);
        }

        drawBall(t);
        drawSkillFx(t);

        if (state.paused) {
          ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
          ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
          ctx.fillStyle = "#fff2c4";
          ctx.font = "700 clamp(28px,5vw,48px) Microsoft YaHei";
          ctx.textAlign = "center";
          ctx.fillText("已暂停", window.innerWidth * 0.5, window.innerHeight * 0.5);
        }
      }

      function serializeStateSnapshot() {
        const carrierId = state.ball.carrier ? state.ball.carrier.id : null;
        return {
          blue: state.blue.map(function (p) { return Object.assign({}, p); }),
          red: state.red.map(function (p) { return Object.assign({}, p); }),
          ball: Object.assign({}, state.ball, { carrierId: carrierId }),
          blueScore: state.blueScore,
          redScore: state.redScore,
          elapsed: state.elapsed,
          gameOver: state.gameOver,
          paused: state.paused,
          skillFx: state.skillFx.slice(),
          craters: state.craters.slice(),
          camera: Object.assign({}, state.camera)
        };
      }

      function applySnapshot(snapshot) {
        if (!snapshot || !Array.isArray(snapshot.blue) || !Array.isArray(snapshot.red) || !snapshot.ball) return;

        state.blue = snapshot.blue.map(function (p) { return Object.assign({}, p); });
        state.red = snapshot.red.map(function (p) { return Object.assign({}, p); });
        state.ball = Object.assign({}, snapshot.ball);
        const carrierId = snapshot.ball.carrierId;
        state.ball.carrier = null;
        if (carrierId) {
          const all = state.blue.concat(state.red);
          for (let i = 0; i < all.length; i += 1) {
            if (all[i].id === carrierId) {
              state.ball.carrier = all[i];
              break;
            }
          }
        }

        state.blueScore = Number(snapshot.blueScore || 0);
        state.redScore = Number(snapshot.redScore || 0);
        state.elapsed = Number(snapshot.elapsed || 0);
        state.gameOver = !!snapshot.gameOver;
        state.paused = !!snapshot.paused;
        state.skillFx = Array.isArray(snapshot.skillFx) ? snapshot.skillFx.slice() : [];
        state.craters = Array.isArray(snapshot.craters) ? snapshot.craters.slice() : [];
        if (snapshot.camera) {
          state.camera.x = Number(snapshot.camera.x || 0);
          state.camera.y = Number(snapshot.camera.y || 0);
          state.camera.scale = Number(snapshot.camera.scale || state.camera.scale);
        }
        refreshHud();
      }

      function frameLoop(ts) {
        if (!frameLoop.last) frameLoop.last = ts;
        const frameMs = clamp(ts - frameLoop.last, 8, 50);
        state.frameMsEma += (frameMs - state.frameMsEma) * 0.08;
        const dt = clamp(frameMs / 1000, 0, 0.033);
        frameLoop.last = ts;
        updateDraftHint();

        if (net.mode === "online" && !net.host && net.connected && !state.inDraft && !state.gameOver) {
          sendNet({ type: "guestInput", input: input });
        }

        update(dt);
        draw();
        requestAnimationFrame(frameLoop);
      }

      function onPointer(clientX, clientY) {
        state.pointerTarget = screenToWorld(clientX, clientY);
      }

      function togglePause() {
        if (net.mode === "online" && !net.host) return;
        state.paused = !state.paused;
        pauseBtn.textContent = state.paused ? "继续" : "暂停";
        refreshActionBar();
      }

      window.addEventListener("resize", resize);

      canvas.addEventListener("pointerdown", function (e) {
        if (state.inDraft) return;
        state.pointerDown = true;
        onPointer(e.clientX, e.clientY);
      });
      canvas.addEventListener("pointermove", function (e) {
        if (state.inDraft) return;
        if (!state.pointerDown) return;
        onPointer(e.clientX, e.clientY);
      });
      window.addEventListener("pointerup", function () {
        state.pointerDown = false;
      });

      window.addEventListener("keydown", function (e) {
        const key = e.key.toLowerCase();
        if (key === "escape") {
          e.preventDefault();
          exitDraft();
          return;
        }
        if (state.inDraft) return;
        if (key === "w") {
          input.w = true;
          state.pointerTarget = null;
        }
        if (key === "a") {
          input.a = true;
          state.pointerTarget = null;
        }
        if (key === "s") {
          input.s = true;
          state.pointerTarget = null;
        }
        if (key === "d") {
          input.d = true;
          state.pointerTarget = null;
        }
        if (key === "j") input.j = true;
        if (key === "p" || e.code === "Space") {
          e.preventDefault();
          togglePause();
        }
      });

      window.addEventListener("keyup", function (e) {
        const key = e.key.toLowerCase();
        if (key === "w") input.w = false;
        if (key === "a") input.a = false;
        if (key === "s") input.s = false;
        if (key === "d") input.d = false;
        if (key === "j") input.j = false;
      });

      pauseBtn.addEventListener("click", function () {
        togglePause();
      });

      soloModeBtn.addEventListener("click", function () {
        setMode("solo");
      });

      onlineModeBtn.addEventListener("click", function () {
        setMode("online");
      });

      connectBtn.addEventListener("click", function () {
        connectOnline();
      });

      restartBtn.addEventListener("click", function () {
        if (net.mode === "online" && !net.host) return;
        resetMatch();
      });

      draftListEl.addEventListener("click", function (e) {
        const btn = e.target.closest(".hero-pick");
        if (!btn) return;
        const heroId = btn.dataset.heroId;
        if (!heroId) return;
        toggleDraftHero(heroId);
      });

      draftResetBtn.addEventListener("click", function () {
        if (net.mode === "online") net.readySent = false;
        state.selectedBlueIds = [];
        renderDraftList();
      });

      draftExitBtn.addEventListener("click", function () {
        exitDraft();
      });

      startMatchBtn.addEventListener("click", function () {
        closeDraftAndStart();
      });

      state.selectedBlueIds = parseSavedBlueLineup();
      state.selectedRedIds = [];

      resize();
      serverInputEl.value = autoSocketURL();
      setMode("solo");
      showDraftOverlay();
      requestAnimationFrame(frameLoop);
    })();
  </script>
</body>
</html>
