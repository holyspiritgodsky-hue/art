<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a0e1a'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%2322d3ee'/%3E%3Cpath d='M10 36c10-8 34-8 44 0' stroke='%23fbbf24' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <script>
        (function () {
            function uniq(list) {
                return Array.from(new Set((list || []).filter(Boolean)));
            }

            window.__worldAssetCandidates = function (relativePath) {
                var clean = String(relativePath || '').replace(/^\.\//, '').replace(/^\//, '');
                var prefixes = ['', './', 'world/', './world/', '../world/'];
                return uniq(prefixes.map(function (prefix) {
                    try {
                        return new URL(prefix + clean, window.location.href).href;
                    } catch (_) {
                        return '';
                    }
                }));
            };

            window.__resolveWorldAssetUrl = function (relativePath) {
                var candidates = window.__worldAssetCandidates(relativePath);
                return candidates[0] || String(relativePath || '');
            };

            window.__fetchWorldAsset = async function (relativePath, init) {
                if (window.location && window.location.protocol === 'file:') {
                    return null;
                }
                var candidates = window.__worldAssetCandidates(relativePath);
                for (var i = 0; i < candidates.length; i += 1) {
                    try {
                        var res = await fetch(candidates[i], init || { cache: 'no-store' });
                        if (res && res.ok) return res;
                    } catch (_) {}
                }
                return null;
            };

            window.__loadImageAsset = function (img, relativePath) {
                if (!img) return '';
                var candidates = window.__worldAssetCandidates(relativePath);
                if (!candidates.length) {
                    img.src = relativePath;
                    return relativePath;
                }

                var index = 0;
                var previousOnError = img.onerror;
                img.onerror = function () {
                    index += 1;
                    if (index < candidates.length) {
                        img.src = candidates[index];
                        return;
                    }
                    if (typeof previousOnError === 'function') previousOnError.apply(this, arguments);
                };

                img.src = candidates[index];
                return candidates[index];
            };
        })();
    </script>
    <style>
        :root {
            --font-ui:    'Courier New', Consolas, 'SF Mono', monospace;
            --font-body:  -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
            --font-mono:  'Courier New', Consolas, monospace;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e1a;
            --bg-panel: rgba(15, 23, 42, 0.92);
            --accent-cyan: #00d9ff;
            --accent-purple: #a855f7;
            --accent-gold: #fbbf24;
            --accent-green: #10b981;
            --text-white: #ffffff;
            --text-gray: #94a3b8;
        }

        body {
            font-family: var(--font-body);
            background: #000;
            color: var(--text-white);
            overflow: hidden;
            min-height: 100vh;
        }

        /* 宇宙画布 */
        .universe-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(ellipse at center, #0a0e1a 0%, #000 100%);
        }

        #universeCanvas {
            width: 100%;
            height: 100%;
        }

        /* UI层 */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .ui-overlay > * {
            pointer-events: auto;
        }

        .mvp-meta {
            position: fixed;
            right: 0.7rem;
            bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            z-index: 1320;
            pointer-events: auto;
        }

        .mvp-version-badge {
            border: 1px solid rgba(148, 163, 184, 0.45);
            background: rgba(15, 23, 42, 0.78);
            color: #cbd5e1;
            border-radius: 999px;
            padding: 0.25rem 0.58rem;
            font-family: var(--font-ui);
            font-size: 0.66rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .mvp-feedback-btn {
            appearance: none;
            -webkit-appearance: none;
            border: 1px solid rgba(0, 217, 255, 0.45);
            background: rgba(15, 23, 42, 0.88);
            color: var(--accent-cyan);
            border-radius: 999px;
            padding: 0.28rem 0.68rem;
            font-family: var(--font-ui);
            font-size: 0.7rem;
            font-weight: 700;
            text-decoration: none;
            backdrop-filter: blur(6px);
            cursor: pointer;
        }

        .mvp-feedback-btn:hover {
            background: rgba(0, 217, 255, 0.16);
            border-color: rgba(0, 217, 255, 0.72);
        }

        @media (max-width: 768px) {
            .mvp-meta { right: 0.45rem; bottom: 0.5rem; gap: 0.35rem; }
            .mvp-feedback-btn { font-size: 0.62rem; padding: 0.24rem 0.52rem; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #solarSystemOverlay {
            display: none !important;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            opacity: 1.0;
            transition: opacity 1.5s ease, filter 1.5s ease, transform 0.3s ease;
            perspective: 2000px;
            perspective-origin: center center;
            transform: rotateX(45deg) scale(0.6);  /* 45度倾斜 */
            transform-style: preserve-3d;
        }
        
        #solarSystemSVG {
            width: 100%;
            height: 100%;
        }

        /* SVG太阳系动画样式 */
        .solar-orbit {
            fill: none;
            stroke: rgba(230, 230, 230, 0.3);
            stroke-width: 3;
        }
        
        .solar-sun {
            fill: url(#sun);
            filter: drop-shadow(0 0 50px orange);
        }
        
        .solar-planet {
            transform-origin: center;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        }
        
        .solar-shadow {
            fill: url(#shadow);
        }
        

        
        /* 根据科技等级调整视角：从地球特写逐渐拉远到完整太阳系 */
        #solarSystemOverlay.tech-level-0 {
            filter: brightness(1.0) saturate(0.9);
        }
        
        #solarSystemOverlay.tech-level-1 {
            filter: brightness(1.0) saturate(1.0) hue-rotate(5deg);
        }
        
        #solarSystemOverlay.tech-level-2 {
            filter: brightness(1.0) saturate(1.1) hue-rotate(10deg);
        }

        #solarSystemOverlay.tech-level-3 {
            filter: brightness(1.0) saturate(1.3) hue-rotate(15deg);
        }

        #solarSystemOverlay.tech-level-4 {
            filter: brightness(1.0) saturate(1.5) hue-rotate(20deg);
        }
        
        /* Lv4扫描线特效 */
        #solarSystemOverlay.tech-level-4::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(147, 112, 219, 0.03) 2px,
                rgba(147, 112, 219, 0.03) 4px
            );
            animation: scanlineMove 8s linear infinite;
            pointer-events: none;
        }
        
        @keyframes scanlineMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(20px); }
        }

        @keyframes nebulaPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        /* ===== CSS行星层（叠在canvas上方，避开跨域限制）===== */
        #planetLayer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            pointer-events: none;   /* 默认不拦截，行星自己开启 */
            z-index: 10;
        }

        .planet-div {
            position: absolute;
            border-radius: 50%;
            background: transparent;
            transform: translate(-50%, -50%);
            cursor: default;
            pointer-events: none;
            transition: filter 0.4s ease, opacity 0.6s ease, box-shadow 0.4s ease;
            border: none;
        }

        .planet-div.locked {
            pointer-events: none;
            opacity: 0;
            border-color: transparent;
        }

        /* 移除所有单独星球图片，使用太阳系图中的行星 */
        .p-sun, .p-mercury, .p-venus, .p-earth, .p-moon, .p-mars, 
        .p-jupiter, .p-saturn, .p-uranus, .p-neptune {
            background: transparent;
        }
        
        /* 太阳特殊处理：无边框，不可点 */
        .p-sun {
            pointer-events: none;
            border: none;
        }

        /* 行星自转动画已移除 - 保持清晰静态展示 */

        /* 解锁时的出现动画 */
        @keyframes planetAppear {
            0%   { transform: translate(-50%,-50%) scale(0); opacity:0; }
            60%  { transform: translate(-50%,-50%) scale(1.15); }
            100% { transform: translate(-50%,-50%) scale(1);  opacity:1; }
        }
        .planet-div.appearing { animation: planetAppear 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    </style>
