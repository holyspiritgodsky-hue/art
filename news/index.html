<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日量化预测</title>
<style>
:root{
  --bg:#f3f6fb;--panel:#ffffff;--panel2:#f1f4f9;--line:#e1e7f0;
  --text:#182230;--muted:#66758b;--up:#dc2626;--down:#168344;--accent:#d89413;--blue:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px}
.logo b{color:var(--accent)}
.date{color:var(--muted)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.pill.lock{color:#8a5b00;border-color:#f0d99f;background:#fff7df}
main{max-width:1280px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:20px 76px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2 small{color:var(--muted);font-weight:400;font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{cursor:pointer;padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px;user-select:none}
.chip.on{color:#111;background:var(--accent);border-color:var(--accent);font-weight:600}
.news{display:flex;flex-direction:column;gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.item:hover{border-color:#b9c6d8}
.imp{grid-row:span 3;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.imp.h .dot{background:var(--up);box-shadow:0 0 8px var(--up)}
.imp.m .dot{background:var(--accent)}
.imp span{font-size:11px;color:var(--muted)}
.t{font-weight:600;font-size:14.5px}
.meta{color:var(--muted);font-size:12px}
.ana{color:#475569;font-size:13px}
.ana::before{content:"▸ ";color:var(--blue)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;padding:1px 8px;border-radius:4px}
.tag.bull{background:rgba(220,38,38,.1);color:#b91c1c}
.tag.bear{background:rgba(22,131,68,.1);color:#13713b}
aside{position:sticky;top:70px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.hero{background:linear-gradient(160deg,#f4f8ff,#ffffff);border-color:#d8e4f5}
.stance{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.stance .big{font-size:26px;font-weight:800;color:var(--up)}
.stance .sub{color:var(--muted);font-size:12px}
.sum{color:#475569;font-size:13px;margin-bottom:4px}
.rank{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.r{display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;align-items:center}
.no{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center}
.r:nth-child(2) .no{background:#c0c8d8;color:#263244}
.r:nth-child(3) .no{background:#c98a5a;color:#fff}
.nm{font-weight:700;font-size:15px}
.pr{font-weight:800;color:var(--up)}
.bar2{grid-column:2/4;height:6px;background:#e5eaf2;border-radius:4px;overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#b91c1c,var(--up))}
.why{grid-column:2/4;color:var(--muted);font-size:12px}
.avoid .nm{color:var(--down)}
.avoid .bar2 i{background:linear-gradient(90deg,#15803d,var(--down))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--panel2);border-radius:8px;padding:8px 4px}
.stats b{display:block;font-size:18px}
.stats span{font-size:11px;color:var(--muted)}
.history-controls{display:flex;align-items:center;gap:8px;margin-top:10px}
.history-controls label{font-size:12px;color:var(--muted);white-space:nowrap}
.history-controls select{max-width:140px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text)}
.history-controls .note{min-width:0}
.hist{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
.h{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#111}
.h[data-date]{cursor:pointer}
.h.w{background:var(--up)}.h.l{background:var(--down)}.h.n{background:#dce2eb;color:#475569}
:root{--c0:#f5b942;--c1:#5b9cff;--c2:#b084ff}
.item{transition:opacity .2s,border-color .2s}
.item.dim{opacity:.35}
.item.hit{border-color:var(--hc)}
.tag .bd{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;margin-right:4px;font-size:10px;font-weight:800;color:#111}
.tag.rk{outline:1px solid var(--rc)}
.r[data-i]{padding:6px;margin:-6px;border-radius:8px;cursor:pointer;transition:background .2s}
.r[data-i]:hover,.r.active{background:rgba(15,23,42,.045)}
.r[data-i] .no{background:var(--rc)!important}
.r[data-i] .bar2 i{background:var(--rc)!important}
.r[data-i] .pr{color:var(--rc)}
#wires{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:5}
#wires .wire{stroke-linecap:round;stroke-dasharray:8 5;animation:wireflow 1s linear infinite}
@keyframes wireflow{to{stroke-dashoffset:-13}}
@media(prefers-reduced-motion:reduce){#wires .wire{animation:none}}
@media(max-width:900px){#wires{display:none}}
.note{font-size:12px;color:var(--muted);line-height:1.7}
.note b{color:#334155}
footer{max-width:1240px;margin:0 auto;padding:10px 20px 40px;color:var(--muted);font-size:12px}
.signal-list{grid-column:2/4;display:flex;gap:5px;flex-wrap:wrap}
.signal{padding:1px 6px;border-radius:4px;background:#eef2f7;color:#475569;font-size:11px}
.news-link{color:inherit;text-decoration:none}
.news-link:hover{color:var(--blue);text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">每日量化预测</div>
    <div class="date" id="date"></div>
    <div class="spacer"></div>
    <span class="pill lock" id="updateStatus">正在读取今日数据…</span>
  </div>
</header>
<svg id="wires"></svg>

<main>
  <section>
    <h2 id="newsHeading">今日要闻 <small id="count"></small></h2>
    <div class="filters" id="filters"></div>
    <div class="news" id="news"></div>
  </section>

  <aside>
    <div class="card hero">
      <h2 id="forecastHeading">今日预测</h2>
      <div class="stance">
        <div class="big" id="marketStance">—</div>
        <div class="sub" id="marketDate">正在读取行情日期…</div>
      </div>
      <p class="sum" id="marketSummary">正在读取市场概况…</p>
      <p class="note" id="scoreMethod">综合信号分用于行业相对排序，不代表上涨概率。</p>
      <div class="rank" id="rank"></div>
    </div>

    <div class="card">
      <h2 id="historyHeading">历史回顾 <small>预测行业当日涨跌</small></h2>
      <div class="stats">
        <div><b id="reviewedCount">0</b><span>已复盘</span></div>
        <div><b id="correctCount">0</b><span>判断正确</span></div>
        <div><b id="wrongCount">0</b><span>判断错误</span></div>
      </div>
      <div class="history-controls">
        <label for="historyDate">查看日期</label>
        <select id="historyDate" aria-label="选择历史预测日期"></select>
        <span id="historyDetail" class="note"></span>
      </div>
      <div class="hist" id="hist"></div>
      <p class="note" id="historyNote" style="margin-top:10px">等待数据加载。</p>
    </div>

    <div class="card note">
      <b>复盘口径：</b>预测行业指数收盘价高于前一交易日收盘价记为正确，否则记为错误。
      <br>仅作信息参考，不构成投资建议。
    </div>
  </aside>
</main>
<footer id="dataFooter">新闻：东方财富快讯；行业行情：申万指数；行业资金流：东方财富；海外指数与商品：新浪财经。以页面显示的数据日期为准。</footer>

<script>
let news=[];
let rank=[];
let forecasts=[];
let backtests=[];
let cur="全部";
let active=-1;
let currentData=null;
let cats=["全部"];
const $=id=>document.getElementById(id);
const RC=["var(--c0)","var(--c1)","var(--c2)"];
const escapeHTML=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const safeURL=value=>{try{const url=new URL(value,location.href);return url.protocol==="https:"?url.href:""}catch{return""}};
const rankIdx=name=>rank.findIndex(item=>item.name===name);
const formatPct=value=>value==null?"—":`${Number(value)>0?"+":""}${Number(value).toFixed(2)}%`;
const formatTime=value=>{const d=new Date(value);return Number.isNaN(d.getTime())?String(value??""):d.toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",hour:"2-digit",minute:"2-digit"})};

function renderFilters(){
  $("filters").innerHTML=cats.map(c=>`<span class="chip ${c===cur?"on":""}" data-c="${escapeHTML(c)}">${escapeHTML(c)}</span>`).join("");
  $("filters").querySelectorAll(".chip").forEach(e=>e.onclick=()=>{cur=e.dataset.c;renderFilters();renderNews()});
}
function renderNews(){
  const list=news.filter(item=>cur==="全部"||item.category===cur);
  $("count").textContent=`共 ${list.length} 条`;
  const importanceLabel={5:"重要",4:"重要",3:"一般",2:"参考",1:"参考"};
  $("news").innerHTML=list.map(item=>{
    const sectors=Array.isArray(item.sectors)?item.sectors:[];
    const ranks=sectors.filter(tag=>Number(tag.impact)>0&&rankIdx(tag.name)>=0).map(tag=>rankIdx(tag.name));
    const tags=sectors.map(tag=>{
      const index=rankIdx(tag.name),positive=Number(tag.impact)>0,negative=Number(tag.impact)<0;
      if(index>=0&&positive)return `<span class="tag bull rk" data-i="${index}" style="--rc:${RC[index]}"><span class="bd" style="background:${RC[index]}">${index+1}</span>利好 ${escapeHTML(tag.name)}</span>`;
      if(positive||negative)return `<span class="tag ${positive?"bull":"bear"}">${positive?"利好":"利空"} ${escapeHTML(tag.name)}</span>`;
      return `<span class="tag">关注 ${escapeHTML(tag.name)}</span>`;
    }).join("");
    const url=safeURL(item.url);
    const title=url?`<a class="news-link" href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(item.title)}</a>`:escapeHTML(item.title);
    const dateLabel=item.archive_date?item.archive_date:formatTime(item.published_at);
    return `<div class="item" data-ranks="${ranks.join(",")}">
      <div class="imp ${Number(item.importance)>=4?"h":Number(item.importance)===3?"m":""}"><div class="dot"></div><span>${importanceLabel[item.importance]||"参考"}</span></div>
      <div class="t">${title}</div>
      <div class="meta">${escapeHTML(dateLabel)} · ${escapeHTML(item.source)} · ${escapeHTML(item.category)}</div>
      <div class="ana">${escapeHTML(item.analysis||item.brief||"")}</div>
      <div class="tags" style="grid-column:2">${tags||'<span class="meta">未映射到申万一级行业</span>'}</div>
    </div>`;
  }).join("");
  applyFocus();
}
function applyFocus(){
  document.querySelectorAll(".item").forEach(el=>{
    const ranks=el.dataset.ranks?el.dataset.ranks.split(",").map(Number):[];
    const hit=active>=0&&ranks.includes(active);
    el.classList.toggle("dim",active>=0&&!hit);
    el.classList.toggle("hit",hit);
    if(hit)el.style.setProperty("--hc",RC[active]);
  });
  document.querySelectorAll(".r[data-i]").forEach(el=>el.classList.toggle("active",+el.dataset.i===active));
  drawWires();
}
function drawWires(){
  const svg=$("wires");svg.innerHTML="";
  if(window.innerWidth<=900)return;
  const top=64,bot=window.innerHeight;
  document.querySelectorAll(".r[data-i]").forEach(row=>{
    const i=+row.dataset.i;if(active>=0&&active!==i)return;
    const rb=row.getBoundingClientRect(),x2=rb.left-4,y2=rb.top+rb.height/2;
    document.querySelectorAll(`.tag.rk[data-i="${i}"]`).forEach(tag=>{
      const item=tag.closest(".item"),ib=item.getBoundingClientRect(),tb=tag.getBoundingClientRect(),y1=tb.top+tb.height/2;
      if(y1<top||y1>bot)return;
      const x1=ib.right+2,mx=(x1+x2)/2,strong=active===i;
      svg.insertAdjacentHTML("beforeend",`<path class="wire" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${RC[i]}" stroke-width="${strong?3.6:2.6}" stroke-opacity="${strong?1:.9}" style="filter:drop-shadow(0 0 3px ${RC[i]})"/><circle cx="${x1}" cy="${y1}" r="5" fill="${RC[i]}" stroke="#fff" stroke-width="2"/><circle cx="${x2}" cy="${y2}" r="5" fill="${RC[i]}" stroke="#fff" stroke-width="2"/>`);
    });
  });
}
function renderRank(){
  if(!rank.length){
    $("rank").innerHTML='<p class="note">暂无明确的偏正面行业线索。</p>';
    return;
  }
  const scoreLabel=currentData.forecast?.score_label||"分";
  $("rank").innerHTML=rank.map((item,i)=>`<div class="r" data-i="${i}" style="--rc:${RC[i]}">
    <div class="no">${i+1}</div><div class="nm">${escapeHTML(item.name)}</div><div class="pr">${Number(item.score).toFixed(1)} ${escapeHTML(scoreLabel)}</div>
    <div class="bar2"><i style="width:${Math.max(0,Math.min(100,Number(item.score)))}%"></i></div>
    <div class="why">${escapeHTML(item.rationale)}</div>
    <div class="signal-list">${Object.entries(item.components||{}).map(([name,value])=>`<span class="signal">${escapeHTML(({news:"新闻",momentum:"5日动量",fund_flow:"资金流",volume:"成交额",overnight:"隔夜映射"})[name]||name)} ${value==null?"—":Number(value).toFixed(0)}</span>`).join("")}</div>
  </div>`).join("");
  document.querySelectorAll(".r[data-i]").forEach(el=>{
    const i=+el.dataset.i;
    el.onmouseenter=()=>{active=i;applyFocus()};
    el.onmouseleave=()=>{active=-1;applyFocus()};
  });
}
function renderHistory(){
  const byDate=new Map();
  for(const item of backtests)byDate.set(item.trading_date,item);
  for(const item of forecasts)byDate.set(item.trading_date,item);
  const records=[...byDate.values()].sort((a,b)=>a.trading_date.localeCompare(b.trading_date));
  const reviewed=records.filter(item=>typeof item.outcome?.top1_correct==="boolean");
  const correct=reviewed.filter(item=>item.outcome.top1_correct).length;
  const wrong=reviewed.length-correct;
  $("reviewedCount").textContent=String(reviewed.length);
  $("correctCount").textContent=String(correct);
  $("wrongCount").textContent=String(wrong);
  $("historyHeading").firstChild.textContent="历史回顾 ";
  $("historyNote").textContent=
    "历史回溯和盘前预测合并统计；按预测行业指数收盘价是否高于前一交易日收盘判断。";

  const selector=$("historyDate");
  const previousSelection=selector.value;
  selector.innerHTML=records.length
    ?records.slice().reverse().map(item=>`<option value="${escapeHTML(item.trading_date)}">${escapeHTML(item.trading_date)}</option>`).join("")
    :'<option value="">暂无记录</option>';
  const selectedDate=records.some(item=>item.trading_date===previousSelection)
    ?previousSelection
    :records.length?records[records.length-1].trading_date:"";
  selector.value=selectedDate;
  selector.onchange=renderHistory;

  const selected=records.find(item=>item.trading_date===selectedDate);
  if(!selected){
    $("historyDetail").textContent="尚无可查看的预测记录。";
  }else{
    const top1=selected.ranked_sectors?.[0]||selected.ranked_sector_details?.[0]?.name||"未记录行业";
    const outcome=selected.outcome;
    const origin=selected.mode==="market_only_backtest"?"历史回溯":"盘前预测";
    const probability=selected.ranked_sector_details?.[0]?.up_probability;
    const probabilityText=probability==null?"":` · 预测上涨概率 ${Number(probability).toFixed(1)}%`;
    const resultText=typeof outcome?.top1_correct==="boolean"
      ?` · 实际 ${formatPct(outcome.top1_close_change_pct)} · ${outcome.top1_correct?"判断正确":"判断错误"}`
      :" · 待复盘";
    $("historyDetail").textContent=`${origin} · ${top1}${probabilityText}${resultText}`;
  }
  $("hist").innerHTML=records.slice(-30).map(item=>{
    const outcome=item.outcome;
    const correct=typeof outcome?.top1_correct==="boolean"?outcome.top1_correct:null;
    const cls=correct===null?"n":correct?"w":"l";
    const symbol=correct===null?"·":correct?"✓":"✕";
    const top1=item.ranked_sectors?.[0]||item.ranked_sector_details?.[0]?.name||"未记录行业";
    const result=correct===null?"待复盘":`${top1} ${correct?"正确":"错误"} ${formatPct(outcome.top1_close_change_pct)}`;
    return `<div class="h ${cls}" data-date="${escapeHTML(item.trading_date)}" title="${escapeHTML(item.trading_date)} ${escapeHTML(result)}">${symbol}</div>`;
  }).join("");
  document.querySelectorAll("#hist .h[data-date]").forEach(el=>{
    el.onclick=()=>{
      selector.value=el.dataset.date;
      renderHistory();
    };
  });
}
async function loadData(){
  let historyError="";
  try{
    const historyResponse=await fetch("./history.json",{cache:"no-store"});
    if(historyResponse.ok){
      const history=await historyResponse.json();
      forecasts=Array.isArray(history.forecasts)?history.forecasts:[];
      backtests=Array.isArray(history.backtests)?history.backtests:[];
    }else if(historyResponse.status!==404){
      historyError=`history.json HTTP ${historyResponse.status}`;
    }
  }catch(error){
    historyError=`history.json: ${error.message}`;
  }
  try{
    const response=await fetch("./data.json",{cache:"no-store"});
    if(!response.ok)throw new Error(`data.json HTTP ${response.status}`);
    currentData=await response.json();
    news=Array.isArray(currentData.news)?currentData.news:[];
    rank=Array.isArray(currentData.forecast?.ranked_sectors)?currentData.forecast.ranked_sectors:[];
    cats=["全部",...new Set(news.map(item=>item.category).filter(Boolean))];
    $("date").textContent=new Date().toLocaleDateString("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"long",day:"numeric",weekday:"long"});
    const isBackfill=currentData.data_mode==="backfill";
    const isNewsArchive=currentData.forecast.ranking_basis==="seven_day_news_archive";
    $("newsHeading").firstChild.textContent=isBackfill?"市场要闻 ":"今日要闻 ";
    $("forecastHeading").textContent=isBackfill
      ?isNewsArchive?"行业预测":"历史回溯排名"
      :"今日预测";
    $("updateStatus").textContent=isBackfill
      ?`新闻数据截至 ${currentData.forecast.market_date}`
      :`🔒 ${formatTime(currentData.generated_at)} 预测已锁定 · 新闻截至 08:30`;
    $("marketStance").textContent=currentData.forecast.market_stance||"震荡";
    $("marketDate").textContent=isBackfill
      ?`预测日期 ${currentData.forecast.trading_date} · 新闻截至 ${currentData.forecast.market_date}`
      :`预测交易日 ${currentData.forecast.trading_date} · 行情截至 ${currentData.forecast.market_date}`;
    if(isBackfill&&isNewsArchive){
      const archiveDates=news.map(item=>item.archive_date).filter(Boolean).sort();
      $("marketSummary").textContent=archiveDates.length
        ?`新闻数据：${archiveDates[0]} 至 ${archiveDates[archiveDates.length-1]}`
        :"新闻数据暂不可用。";
      $("scoreMethod").textContent="新闻线索仅用于行业相对排序，分数不代表上涨概率。";
    }else{
      $("marketSummary").textContent=currentData.forecast.market_summary||"市场概况暂无";
    }
    if(!(isBackfill&&isNewsArchive)){
      $("scoreMethod").textContent=currentData.forecast.score_method||"综合信号分用于行业相对排序，不代表上涨概率。";
    }
    $("dataFooter").textContent=isBackfill
      ?"新闻来源：央视《新闻联播》；按财经及行业关键词筛选。"
      :"新闻：东方财富、财联社、新浪财经、同花顺；行业行情：申万指数；行业资金流：东方财富；海外指数与商品：新浪财经。以页面显示的数据日期为准。";
    renderFilters();renderRank();renderNews();renderHistory();
    if(historyError)$("historyNote").textContent=`历史记录加载失败：${historyError}`;
    if(isBackfill&&!news.length){
      $("news").innerHTML='<div class="card note">这个样例日期没有筛到相关市场新闻。</div>';
    }
  }catch(error){
    $("updateStatus").textContent=backtests.length
      ?"今日预测尚未生成 · 可查看下方历史回溯"
      :"今日数据暂不可用";
    $("marketStance").textContent="—";
    $("marketDate").textContent="没有可展示的今日预测";
    $("marketSummary").textContent=`数据加载失败：${error.message}${historyError?`；历史记录加载失败：${historyError}`:""}`;
    $("news").innerHTML='<div class="card note">暂无已生成的新闻分析。</div>';
    $("rank").innerHTML='<p class="note">暂无已生成的行业预测。</p>';
    renderHistory();
  }
}
addEventListener("scroll",()=>requestAnimationFrame(drawWires),{passive:true});
addEventListener("resize",drawWires);
loadData();
</script>
</body>
</html>
