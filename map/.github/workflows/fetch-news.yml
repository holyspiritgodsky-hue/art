name: Fetch News

on:
  schedule:
    # 每小时整点运行（UTC 时间）
    - cron: '0 * * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch news from CLS
        working-directory: map
        run: node scripts/fetch-news.mjs

      - name: Fetch commodity prices
        working-directory: map
        run: node scripts/fetch-commodities.mjs

      - name: Commit & push if changed
        working-directory: map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news/ public/commodities/
          git diff --cached --quiet || git commit -m "chore: update data $(date -u +%Y-%m-%dT%H:%M)"
          git push
