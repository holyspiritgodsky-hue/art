<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>地球Online 原型</title>
	<style>
		:root {
			--bg: #030712;
			--panel: rgba(8, 18, 34, 0.66);
			--line: rgba(148, 163, 184, 0.35);
			--text: #e5edf8;
			--muted: #9fb2cc;
			--accent: #64d2ff;
			--warn: #ffdd6b;
			--ok: #4ade80;
			--danger: #ff7b7b;
		}

		* { box-sizing: border-box; }

		html,
		body {
			margin: 0;
			width: 100%;
			height: 100%;
			font-family: "Segoe UI", "SF Pro Text", "Helvetica Neue", sans-serif;
			background: radial-gradient(circle at 30% 20%, #142948 0%, #070f1f 44%, #04070f 100%);
			color: var(--text);
			overflow: hidden;
		}

		#app {
			position: relative;
			width: 100%;
			height: 100%;
		}

		#bgVideo {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center 50%;
			background: transparent;
			filter: saturate(1.02) contrast(1.03);
		}

		#sceneFallback {
			position: absolute;
			inset: 0;
			display: none;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 18px;
			font-size: clamp(18px, 2.5vw, 34px);
			font-weight: 600;
			letter-spacing: 0.04em;
			text-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
		}

		#sceneFallback.classic {
			background: radial-gradient(circle at 70% 20%, rgba(159, 212, 255, 0.35), transparent 30%), linear-gradient(130deg, #18355b 0%, #0d1f3f 38%, #071325 100%);
		}

		#sceneFallback.nightRoad {
			background: radial-gradient(circle at 50% 65%, rgba(255, 255, 220, 0.24), transparent 36%), linear-gradient(180deg, #020308 0%, #0d1622 62%, #0a1019 100%);
		}

		#sceneFallback.winter {
			background: linear-gradient(180deg, #6e8db2 0%, #b8cadc 42%, #6d7f98 100%);
		}

		#sceneFallback.ruins {
			background: linear-gradient(160deg, #4b3b31 0%, #241d1b 48%, #120f10 100%);
		}

		#sceneFallback.market {
			background: linear-gradient(140deg, #576f41 0%, #27361c 50%, #141e10 100%);
		}

		#sceneFallback.home {
			background: radial-gradient(circle at 50% 35%, rgba(255, 236, 181, 0.28), transparent 34%), linear-gradient(160deg, #4d3f2b 0%, #272016 52%, #16120d 100%);
		}

		#sceneFallback.scooter {
			background: linear-gradient(120deg, #3c3b3a 0%, #1f2328 50%, #111418 100%);
		}

		#menuBg {
			position: absolute;
			inset: 0;
			background-image: url("img/earth.jpg");
			background-size: contain;
			background-position: center center;
			background-repeat: no-repeat;
			background-color: #02060f;
			filter: saturate(1.05) contrast(1.03);
			display: none;
		}

		.country-balls {
			position: absolute;
			top: 50%;
			left: 50%;
			width: min(100vw, 100vh);
			height: min(100vw, 100vh);
			z-index: 1;
			transform: translate(-50%, -50%);
			pointer-events: none;
		}

		.country-ball {
			position: absolute;
			left: var(--x);
			top: var(--y);
			z-index: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 4px;
			transform: translate(-50%, -50%);
			animation: ball-float 3.2s ease-in-out infinite;
			animation-delay: var(--delay, 0s);
		}

		.speech-tails {
			position: absolute;
			inset: 0;
			z-index: 0;
			width: 100%;
			height: 100%;
			overflow: visible;
			pointer-events: none;
		}

		.speech-tail {
			fill: #fffdf6;
			stroke: #d5deeb;
			stroke-width: 1;
		}

		.country-ball.shift-left {
			left: calc(var(--x) - 13%);
			top: calc(var(--y) - 2%);
		}

		.country-ball.shift-left-more {
			left: calc(var(--x) - 18%);
		}

		.country-ball.shift-northwest {
			left: calc(var(--x) - 21%);
			top: calc(var(--y) - 10%);
		}

		.country-ball.shift-up {
			top: calc(var(--y) - 10%);
		}

		.country-ball.shift-down {
			top: calc(var(--y) - 5%);
		}

		.ball-face {
			position: relative;
			width: clamp(36px, 5vw, 58px);
			aspect-ratio: 1;
			overflow: hidden;
			border: 2px solid rgba(255, 255, 255, 0.9);
			border-radius: 50%;
			box-shadow: 0 5px 16px rgba(0, 0, 0, 0.5), inset -5px -5px 10px rgba(0, 0, 0, 0.2);
		}

		.country-ball.compact .ball-face {
			width: clamp(29px, 3.2vw, 38px);
		}

		.country-ball.compact .ball-eyes i {
			width: 8px;
			height: 11px;
		}

		.country-ball.large-ball .ball-face {
			width: clamp(44px, 5.8vw, 66px);
		}

		.country-ball.compact.large-ball .ball-face {
			width: clamp(40px, 4.4vw, 54px);
		}

		.country-ball.large-ball .ball-eyes i {
			width: clamp(10px, 1.2vw, 15px);
			height: clamp(14px, 1.7vw, 20px);
		}

		.ball-eyes {
			position: absolute;
			left: 50%;
			top: 35%;
			display: flex;
			gap: 3px;
			transform: translateX(-50%) rotate(-7deg);
		}

		.ball-eyes i {
			display: block;
			width: clamp(9px, 1.15vw, 14px);
			height: clamp(13px, 1.65vw, 19px);
			border: 1px solid #252525;
			border-radius: 50%;
			background: #fff;
		}

		.country-name {
			padding: 2px 6px;
			border: 1px solid rgba(220, 235, 255, 0.3);
			border-radius: 999px;
			background: rgba(3, 10, 22, 0.78);
			color: #f4f8ff;
			font-size: clamp(10px, 1vw, 13px);
			line-height: 1.2;
			white-space: nowrap;
			text-shadow: 0 1px 3px #000;
		}

		.speech-bubble {
			position: absolute;
			z-index: 4;
			width: min(240px, 42vw);
			padding: 9px 12px;
			border: 1px solid #d5deeb;
			border-radius: 14px;
			background: #fffdf6;
			color: #172033;
			font-size: clamp(12px, 1.15vw, 15px);
			font-weight: 600;
			line-height: 1.45;
			text-align: left;
			white-space: normal;
			opacity: 0;
			visibility: hidden;
			transition: opacity 0.2s ease, visibility 0.2s ease;
		}

		.speech-bubble.visible {
			opacity: 1;
			visibility: visible;
		}

		.speech-france {
			top: calc(100% - 25px);
			right: calc(100% + 14px);
		}

		.speech-china {
			right: auto;
			bottom: calc(100% + 14px);
			left: calc(100% + 14px);
		}

		.speech-us {
			top: calc(100% + 12px);
			left: calc(100% + 12px);
		}

		.speech-poland {
			right: calc(100% + 14px);
			bottom: calc(100% + 14px);
		}

		.speech-germany {
			top: calc(100% + 10px);
			left: calc(100% + 10px);
		}

		@media (max-width: 600px) {
			.speech-bubble { width: min(190px, 50vw); }
			.speech-france {
				top: calc(100% + 10px);
				right: auto;
				left: calc(100% + 10px);
			}
			.speech-china {
				top: calc(100% + 10px);
				right: calc(100% + 10px);
				bottom: auto;
				left: auto;
			}
			.speech-us {
				top: calc(100% + 10px);
				left: auto;
				right: calc(100% + 10px);
			}
			.speech-poland {
				right: auto;
				bottom: calc(100% + 10px);
				left: calc(100% + 10px);
			}
		}

		.ball-china { background: #d90016; }
		.ball-china::before {
			content: "★";
			position: absolute;
			left: 19%;
			top: 15%;
			color: #ffdf36;
			font-size: 15px;
		}
		.ball-japan { background: radial-gradient(circle, #c9152b 0 25%, transparent 27%), #fff; }
		.ball-russia { background: linear-gradient(to bottom, #fff 0 33.3%, #3155a4 33.3% 66.6%, #d52b35 66.6%); }
		.ball-uk {
			background:
				linear-gradient(to right, transparent 40%, #fff 40% 60%, transparent 60%),
				linear-gradient(to bottom, transparent 35%, #fff 35% 65%, transparent 65%),
				linear-gradient(to right, transparent 45%, #c8102e 45% 55%, transparent 55%),
				linear-gradient(to bottom, transparent 42%, #c8102e 42% 58%, transparent 58%),
				linear-gradient(32deg, transparent 42%, #c8102e 42% 58%, transparent 58%),
				linear-gradient(-32deg, transparent 42%, #c8102e 42% 58%, transparent 58%),
				linear-gradient(32deg, transparent 33%, #fff 33% 67%, transparent 67%),
				linear-gradient(-32deg, transparent 33%, #fff 33% 67%, transparent 67%),
				#012169;
		}
		.ball-france { background: linear-gradient(to right, #21468b 0 33.3%, #fff 33.3% 66.6%, #ed2939 66.6%); }
		.ball-germany { background: linear-gradient(to bottom, #171717 0 33.3%, #d32735 33.3% 66.6%, #ffce00 66.6%); }
		.ball-us { background: repeating-linear-gradient(to bottom, #b22234 0 8%, #fff 8% 16%); }
		.ball-us::before {
			content: "✦";
			position: absolute;
			left: 0;
			top: 0;
			width: 48%;
			height: 48%;
			background: #3c3b6e;
			color: #fff;
			font-size: 10px;
			text-align: center;
		}
		.ball-iran { background: linear-gradient(to bottom, #239f40 0 33.3%, #fff 33.3% 66.6%, #da0000 66.6%); }
		.ball-ukraine { background: linear-gradient(to bottom, #0057b7 0 50%, #ffd700 50%); }
		.ball-poland { background: linear-gradient(to bottom, #fff 0 50%, #dc143c 50%); }
		.ball-yemen { background: linear-gradient(to bottom, #ce1126 0 33.3%, #fff 33.3% 66.6%, #000 66.6%); }
		.ball-saudi { background: #006c35; }
		.ball-saudi::before {
			content: "الله";
			position: absolute;
			top: 12%;
			left: 50%;
			transform: translateX(-50%);
			color: #fff;
			font-size: clamp(8px, 1vw, 12px);
			font-weight: 700;
			white-space: nowrap;
		}
		.ball-saudi::after {
			content: "";
			position: absolute;
			left: 25%;
			right: 25%;
			bottom: 24%;
			height: 2px;
			border-radius: 2px;
			background: #fff;
			transform: rotate(-8deg);
		}

		.country-ball.russia-attacker {
			animation: russia-lunge 4s ease-in-out infinite;
		}

		.country-ball.us-attacker {
			animation: us-lunge 4.2s ease-in-out infinite;
			animation-delay: -2s;
		}

		.country-ball.houthi-attacker {
			animation: houthi-lunge 4.5s ease-in-out infinite;
			animation-delay: -1s;
		}

		.country-ball.under-attack .ball-face {
			animation: target-shake 4s ease-in-out infinite;
		}

		.country-ball.us-target .ball-face {
			animation-duration: 4.2s;
			animation-delay: -2s;
		}

		.country-ball.france-target .ball-face {
			animation-delay: -1s;
		}

		.country-ball.saudi-target .ball-face {
			animation-duration: 4.5s;
			animation-delay: -1s;
		}

		.tears {
			position: absolute;
			inset: 0;
			display: none;
			pointer-events: none;
		}

		.tears i {
			position: absolute;
			top: 47%;
			width: clamp(5px, 0.65vw, 8px);
			height: clamp(11px, 1.25vw, 16px);
			border: 1px solid rgba(232, 250, 255, 0.9);
			border-radius: 3px 6px 7px 7px;
			background: linear-gradient(90deg, #b9f1ff, #42c8ff 48%, #168fce);
			box-shadow: 0 0 7px rgba(66, 200, 255, 0.95);
			animation: tear-fall 1.15s ease-in infinite;
		}

		.tears i:first-child { left: 20%; --tear-angle: -10deg; }
		.tears i:last-child { right: 20%; --tear-angle: 10deg; animation-delay: 0.55s; }
		.country-ball.compact .tears i { width: 6px; height: 12px; }
		.under-attack .tears,
		.crying .tears { display: block; }

		@keyframes russia-lunge {
			0%, 42%, 100% { translate: 0 0; }
			48% { translate: -11px 8px; }
			53% { translate: -3px 2px; }
			58% { translate: 0 0; }
		}

		@keyframes us-lunge {
			0%, 42%, 100% { translate: 0 0; }
			48% { translate: -9px -10px; }
			53% { translate: -2px -2px; }
			58% { translate: 0 0; }
		}

		@keyframes houthi-lunge {
			0%, 42%, 100% { translate: 0 0; }
			48% { translate: -7px -10px; }
			53% { translate: -2px -2px; }
			58% { translate: 0 0; }
		}

		@keyframes target-shake {
			0%, 44%, 100% { transform: rotate(0); }
			48% { transform: translateX(-3px) rotate(-6deg); }
			52% { transform: translateX(3px) rotate(6deg); }
			57% { transform: translateX(-1px) rotate(-2deg); }
		}

		@keyframes tear-fall {
			0%, 12% { opacity: 0; transform: translateY(-2px) rotate(var(--tear-angle)) scaleY(0.6); }
			25% { opacity: 1; }
			100% { opacity: 0; transform: translateY(14px) rotate(var(--tear-angle)) scaleY(1.05); }
		}

		@media (prefers-reduced-motion: reduce) {
			.country-ball,
			.country-ball.russia-attacker,
			.country-ball.us-attacker,
			.country-ball.houthi-attacker,
			.country-ball .ball-face,
			.country-ball.under-attack .ball-face,
			.country-ball.saudi-target .ball-face,
			.tears i { animation: none; }
			.under-attack .tears,
			.crying .tears { display: none; }
			.speech-bubble { transition: none; }
		}

		.vignette {
			position: absolute;
			inset: 0;
			background:
				radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.35) 100%),
				linear-gradient(180deg, rgba(3, 8, 18, 0.65), transparent 26%, transparent 74%, rgba(3, 8, 18, 0.68));
			pointer-events: none;
		}

		.layer {
			position: absolute;
			inset: 0;
			pointer-events: none;
		}

		.panel {
			background: var(--panel);
			border: 1px solid var(--line);
			backdrop-filter: blur(8px);
			border-radius: 12px;
			box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
		}

		.brand {
			position: absolute;
			top: 36px;
			left: 50%;
			transform: translateX(-50%);
			text-align: center;
			letter-spacing: 0.04em;
		}

		.brand h1 {
			margin: 0;
			font-size: clamp(42px, 7vw, 92px);
			line-height: 0.95;
			text-transform: uppercase;
			text-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
		}

		.brand .sub {
			margin-top: 16px;
			font-size: clamp(16px, 1.8vw, 24px);
			color: var(--muted);
		}

		.server {
			margin-top: 12px;
			display: inline-flex;
			align-items: center;
			gap: 8px;
			padding: 8px 14px;
			border-radius: 8px;
			border: 1px solid rgba(159, 178, 204, 0.38);
			background: rgba(10, 20, 38, 0.54);
			color: #d9ecff;
			font-size: 15px;
		}

		.dot {
			width: 10px;
			height: 10px;
			border-radius: 999px;
			background: var(--ok);
			box-shadow: 0 0 12px rgba(74, 222, 128, 0.9);
		}

		.menu {
			position: absolute;
			left: 44px;
			bottom: 72px;
			display: flex;
			flex-direction: column;
			gap: 12px;
			pointer-events: auto;
		}

		.mobile-dialogue {
			display: none;
		}

		.menu button,
		.choice button,
		.scene-card button,
		.back-btn {
			border: 1px solid rgba(154, 176, 212, 0.28);
			color: var(--text);
			background: rgba(8, 17, 32, 0.56);
			padding: 10px 16px;
			font-size: 22px;
			border-radius: 8px;
			text-align: left;
			cursor: pointer;
			transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
		}

		.menu button:hover,
		.choice button:hover,
		.scene-card button:hover,
		.back-btn:hover {
			transform: translateY(-2px);
			border-color: rgba(100, 210, 255, 0.8);
			background: rgba(13, 30, 54, 0.74);
		}

		.scene-select {
			position: absolute;
			top: auto;
			left: 50%;
			right: auto;
			bottom: 40px;
			width: min(82vw, 920px);
			height: auto;
			max-height: min(38vh, 320px);
			padding: 20px;
			pointer-events: auto;
			display: none;
			flex-direction: column;
			gap: 14px;
			transform: translateX(-50%);
		}

		.scene-top {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.scene-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
			gap: 12px;
			overflow: auto;
			padding-right: 4px;
		}

		.scene-card {
			border: 1px solid rgba(144, 170, 208, 0.26);
			border-radius: 10px;
			overflow: hidden;
			background: rgba(8, 16, 32, 0.7);
			min-height: 126px;
			display: flex;
			flex-direction: column;
		}

		.scene-thumb {
			flex: 1;
			min-height: 72px;
			background: linear-gradient(120deg, #24579e 0%, #0f2f5f 40%, #071531 100%);
			background-size: cover;
			background-position: center;
		}

		.scene-card button {
			width: 100%;
			border: none;
			border-top: 1px solid rgba(141, 164, 198, 0.24);
			border-radius: 0;
			font-size: 18px;
			padding: 10px 12px;
		}

		.hud {
			position: absolute;
			top: 18px;
			left: 18px;
			display: none;
			flex-direction: column;
			gap: 10px;
			pointer-events: none;
		}

		.stats {
			width: 220px;
			padding: 10px 12px;
			font-size: 14px;
			line-height: 1.55;
		}

		.task {
			margin-top: 8px;
			width: fit-content;
			max-width: min(70vw, 380px);
			padding: 10px 12px;
			font-size: 26px;
			border-left: 3px solid var(--warn);
		}

		.task small {
			display: block;
			font-size: 14px;
			color: var(--muted);
			margin-bottom: 2px;
		}

		.hint {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			display: none;
			padding: 10px 16px;
			font-size: 38px;
			letter-spacing: 0.03em;
		}

		.hint kbd {
			display: inline-block;
			border: 1px solid rgba(238, 246, 255, 0.45);
			padding: 2px 12px;
			border-radius: 6px;
			background: rgba(7, 16, 30, 0.78);
			margin: 0 4px;
		}

		.choice {
			position: absolute;
			right: 22px;
			bottom: 20px;
			display: none;
			flex-direction: column;
			gap: 10px;
			pointer-events: auto;
			width: min(46vw, 360px);
		}

		.choice button {
			font-size: 17px;
		}

		.status {
			position: absolute;
			right: 18px;
			top: 18px;
			display: none;
			padding: 10px 12px;
			font-size: 13px;
			color: var(--muted);
		}

		.global-back {
			position: absolute;
			right: 18px;
			bottom: 18px;
			display: none;
			z-index: 20;
			pointer-events: auto;
			padding: 10px 14px;
			font-size: 14px;
			border-radius: 10px;
			border: 1px solid rgba(162, 187, 224, 0.45);
			background: rgba(7, 16, 30, 0.72);
			color: var(--text);
			cursor: pointer;
		}

		.global-back:hover {
			border-color: rgba(100, 210, 255, 0.85);
			background: rgba(10, 25, 45, 0.82);
		}

		.center-msg {
			position: absolute;
			left: 50%;
			bottom: 12%;
			transform: translateX(-50%);
			display: none;
			width: min(90vw, 700px);
			text-align: center;
			font-size: clamp(18px, 2.4vw, 28px);
			line-height: 1.35;
			padding: 14px 18px;
		}

		.news-broadcast {
			position: absolute;
			left: 50%;
			bottom: 28px;
			z-index: 15;
			display: none;
			align-items: center;
			gap: 18px;
			width: min(86vw, 700px);
			padding: 16px 20px;
			transform: translateX(-50%);
			color: var(--text);
			font: inherit;
			text-align: left;

		function updateSpeechTails() {
			const bounds = speechTails.getBoundingClientRect();
			speechTails.setAttribute("viewBox", "0 0 " + bounds.width + " " + bounds.height);
			const links = [
				{ path: document.getElementById("franceTail"), bubble: franceSpeech, face: document.querySelector(".ball-france") },
				{ path: document.getElementById("chinaTail"), bubble: chinaSpeech, face: document.querySelector(".ball-china") },
				{ path: document.getElementById("usTail"), bubble: usSpeech, face: document.querySelector(".ball-us") },
				{ path: document.getElementById("polandTail"), bubble: polandSpeech, face: document.querySelector(".ball-poland") },
				{ path: document.getElementById("germanyTail"), bubble: germanySpeech, face: document.querySelector(".ball-germany") }
			];

			links.forEach(({ path, bubble, face }) => {
				if (window.getComputedStyle(bubble).visibility !== "visible") {
					path.setAttribute("d", "");
					return;
				}

				const bubbleRect = bubble.getBoundingClientRect();
				const faceRect = face.getBoundingClientRect();
				const centerX = faceRect.left + faceRect.width / 2;
				const centerY = faceRect.top + faceRect.height / 2;
				const horizontalSide = centerX < bubbleRect.left ? "left" : centerX > bubbleRect.right ? "right" : null;
				const verticalSide = centerY < bubbleRect.top ? "top" : centerY > bubbleRect.bottom ? "bottom" : null;
				let side = horizontalSide || verticalSide;

				if (horizontalSide && verticalSide) {
					const horizontalGap = Math.abs(centerX - (horizontalSide === "left" ? bubbleRect.left : bubbleRect.right));
					const verticalGap = Math.abs(centerY - (verticalSide === "top" ? bubbleRect.top : bubbleRect.bottom));
					side = horizontalGap < verticalGap ? horizontalSide : verticalSide;
				} else if (!side) {
					const gaps = [
						["left", centerX - bubbleRect.left],
						["right", bubbleRect.right - centerX],
						["top", centerY - bubbleRect.top],
						["bottom", bubbleRect.bottom - centerY]
					];
					side = gaps.reduce((nearest, gap) => gap[1] < nearest[1] ? gap : nearest)[0];
				}

				const margin = 12;
				let baseX = Math.max(bubbleRect.left + margin, Math.min(centerX, bubbleRect.right - margin));
				let baseY = Math.max(bubbleRect.top + margin, Math.min(centerY, bubbleRect.bottom - margin));
				let pointA;
				let pointB;

				if (side === "left" || side === "right") {
					baseX = side === "left" ? bubbleRect.left + 2 : bubbleRect.right - 2;
					pointA = { x: baseX, y: baseY - 10 };
					pointB = { x: baseX, y: baseY + 10 };
				} else {
					baseY = side === "top" ? bubbleRect.top + 2 : bubbleRect.bottom - 2;
					pointA = { x: baseX - 10, y: baseY };
					pointB = { x: baseX + 10, y: baseY };
				}

				const dx = centerX - baseX;
				const dy = centerY - baseY;
				const distance = Math.hypot(dx, dy) || 1;
				const radius = Math.min(faceRect.width, faceRect.height) * 0.46;
				const tip = {
					x: centerX - dx / distance * radius,
					y: centerY - dy / distance * radius
				};
				const local = point => (point.x - bounds.left).toFixed(1) + " " + (point.y - bounds.top).toFixed(1);
				path.setAttribute("d", "M " + local(pointA) + " L " + local(tip) + " L " + local(pointB) + " Z");
			});
		}

			taskText.textContent = GAME.mission;
			statsBox.innerHTML = [
				"<strong>LV " + GAME.level + "</strong>",
				"HP: " + GAME.hp,
				"体温: " + GAME.tempC.toFixed(1) + " C",
				"湿度: " + GAME.humidity + "%",
				"饥饿度: " + GAME.hunger + "%"
			].join("<br>");
		}

		function showCenter(text, ms = 1800) {
			centerMsg.textContent = text;
			setVisible(centerMsg, true, "block");
			window.setTimeout(() => setVisible(centerMsg, false), ms);
		}

		function advanceNewsBroadcast() {
			if (newsBroadcastIndex === newsBroadcastLines.length - 1) {
				closeNewsBroadcast();
				return;
			}

			newsBroadcastIndex += 1;
			newsBroadcastText.textContent = newsBroadcastLines[newsBroadcastIndex];
			newsBroadcast.classList.toggle("is-poland", newsBroadcastIndex === 2 || newsBroadcastIndex === 3);
			newsBroadcast.setAttribute("aria-label", newsBroadcastLines[newsBroadcastIndex]);
			newsBroadcast.classList.add("visible");
			menuLayer.classList.add("news-open");
		}

		function closeNewsBroadcast() {
			newsBroadcastIndex = -1;
			newsBroadcast.classList.remove("visible");
			newsBroadcast.classList.remove("is-poland");
			menuLayer.classList.remove("news-open");
		}

		function showSceneFallback(sceneName, reason = "") {
			sceneFallback.className = "";
			sceneFallback.id = "sceneFallback";
			sceneFallback.classList.add(sceneName);
			const imagePath = FALLBACK_IMAGES[sceneName];
			if (imagePath) {
				sceneFallback.style.backgroundImage = "linear-gradient(rgba(3, 9, 18, 0.35), rgba(3, 9, 18, 0.65)), url('" + imagePath + "')";
				sceneFallback.style.backgroundSize = "cover";
				sceneFallback.style.backgroundPosition = "center";
			} else {
				sceneFallback.style.backgroundImage = "";
			}
			sceneFallback.innerHTML = "<div>" +
				"<div style=\"font-size:1.1em;margin-bottom:8px;\">" + sceneName + " 占位画面</div>" +
				"<div style=\"font-size:0.55em;font-weight:400;color:#d2dff1;\">未检测到本地视频，放入 img 文件后将自动替换。</div>" +
				(reason ? "<div style=\"font-size:0.5em;margin-top:8px;color:#9fb2cc;\">" + reason + "</div>" : "") +
				"</div>";
			setVisible(sceneFallback, true, "flex");
		}

		function stopMusic() {
			bgm.pause();
			bgm.removeAttribute("src");
			bgm.load();
			currentMusicSrc = "";
		}

		function loadMusic(sceneName) {
			const src = MUSIC_SOURCES[sceneName];
			if (!src) {
				stopMusic();
				return;
			}

			if (currentMusicSrc !== src) {
				bgm.src = src;
				currentMusicSrc = src;
				bgm.load();
			}

			bgm.play().catch(() => {
				// 音频自动播放可能被浏览器策略拦截。
			});
		}

		function loadScene(sceneName, options = {}) {
			const src = VIDEO_SOURCES[sceneName];
			if (!src) {
				setVisible(video, false);
				stopMusic();
				showSceneFallback(sceneName, "缺少视频映射");
				showCenter("缺少视频资源: " + sceneName, 2300);
				return;
			}
			const { loop = false, muted = true } = options;
			GAME.scene = sceneName;
			setVisible(video, true, "block");
			setVisible(sceneFallback, false);
			loadMusic(sceneName);
			video.style.objectFit = VIDEO_FIT[sceneName] || "cover";
			video.style.objectPosition = VIDEO_VIEWPORT[sceneName] || "center 50%";
			video.src = src;
			video.loop = loop;
			video.muted = muted;
			video.play().catch(() => {
				showCenter("浏览器阻止自动播放，请点击任意按钮继续。", 2600);
			});
		}

		function enterMenu() {
			GAME.state = "menu";
			menuLayer.classList.remove("scene-open");
			GAME.branchOpen = false;
			GAME.canRide = false;
			stopMusic();
			video.pause();
			video.removeAttribute("src");
			video.load();
			setVisible(video, false);
			setVisible(sceneFallback, false);
			setVisible(menuBg, true, "block");
			setVisible(menuLayer, true, "block");
			startMenuDialogue();
			setVisible(sceneSelect, false);
			setVisible(hud, false);
			setVisible(status, false);
			setVisible(hint, false);
			setVisible(choice, false);
			updateGlobalBackVisibility();
		}

		function enterPlay(sceneName) {
			window.clearInterval(chinaSpeechTimer);
			stopMobileDialogue();
			GAME.state = "play";
			GAME.branchOpen = false;
			GAME.canRide = false;
			if (sceneName === "nightRoad") {
				GAME.mission = "去吃肉的路上";
			} else if (sceneName === "market") {
				GAME.mission = "吃肉进行中（阶段一）";
			} else if (sceneName === "home") {
				GAME.mission = "吃肉进行中（阶段二）";
			} else {
				GAME.mission = "探索地图";
			}
			updateHud();

			setVisible(menuLayer, false);
			setVisible(sceneSelect, false);
			setVisible(hud, true, "flex");
			setVisible(status, false);
			setVisible(menuBg, false);
			updateGlobalBackVisibility();

			const shouldLoop = sceneName === "market" || sceneName === "home";
			loadScene(sceneName, { loop: shouldLoop, muted: true });
			if (sceneName === "nightRoad" || sceneName === "market" || sceneName === "home") {
				openBranch();
			}
		}

		function openBranch() {
			if (GAME.branchOpen) {
				return;
			}
			GAME.branchOpen = true;
			setVisible(choice, true, "flex");
			choiceA.textContent = "A: 播放 o1（吃肉过程1）";
			choiceB.textContent = "B: 播放 o2（吃肉过程2）";
			choiceBack.textContent = "返回主页";
			updateGlobalBackVisibility();
		}

		function closeBranch() {
			GAME.branchOpen = false;
			setVisible(choice, false);
			setVisible(hint, false);
			updateGlobalBackVisibility();
		}

		function handleTimeline() {
			if (GAME.state !== "play") {
				return;
			}

			const t = video.currentTime;

			if (GAME.scene === "nightRoad") {
				if (t > 11) {
					openBranch();
				}
			}

			if (video.ended && !video.loop) {
				if (GAME.scene === "scooter") {
					enterMenu();
					showCenter("本轮结束，点击继续再来一次。", 2200);
				}
			}
		}

		document.getElementById("btnContinue").addEventListener("click", () => {
			closeNewsBroadcast();
			setVisible(sceneSelect, sceneSelect.style.display !== "flex", "flex");
			menuLayer.classList.toggle("scene-open", sceneSelect.style.display === "flex");
			updateGlobalBackVisibility();
		});

		document.getElementById("btnAbout").addEventListener("click", () => {
			advanceNewsBroadcast();
		});

		newsBroadcast.addEventListener("click", advanceNewsBroadcast);

		document.getElementById("btnBackMenu").addEventListener("click", () => {
			setVisible(sceneSelect, false);
			menuLayer.classList.remove("scene-open");
			updateGlobalBackVisibility();
		});

		document.querySelectorAll("[data-scene]").forEach((button) => {
			button.addEventListener("click", () => {
				const scene = button.getAttribute("data-scene");
				enterPlay(scene);
			});
		});

		choiceA.addEventListener("click", () => {
			openBranch();
			GAME.mission = "吃肉进行中（阶段一）";
			GAME.hunger = Math.max(0, GAME.hunger - 12);
			updateHud();
			loadScene("market", { loop: true, muted: true });
			showCenter("切换到吃肉过程 o1", 1200);
		});

		choiceB.addEventListener("click", () => {
			openBranch();
			GAME.mission = "吃肉进行中（阶段二）";
			GAME.tempC = 36.2;
			updateHud();
			loadScene("home", { loop: true, muted: true });
			showCenter("切换到吃肉过程 o2", 1200);
		});

		choiceBack.addEventListener("click", () => {
			enterMenu();
		});

		globalBack.addEventListener("click", () => {
			enterMenu();
		});

			document.addEventListener("keydown", (event) => {
			if (GAME.branchOpen && (event.key === "1" || event.key === "2")) {
				if (event.key === "1") {
					choiceA.click();
				} else {
					choiceB.click();
				}
				return;
			}

			if (event.key === "Escape" && GAME.state === "play") {
				enterMenu();
			}
		});

		video.addEventListener("timeupdate", handleTimeline);
		mobileDialogueMedia.addEventListener("change", startMobileDialogue);
		window.addEventListener("resize", updateSpeechTails);
		video.addEventListener("error", () => {
			setVisible(video, false);
			showSceneFallback(GAME.scene, "视频加载失败");
			showCenter("视频加载失败，请将视频放入 img 文件夹。", 2600);
		});

		updateHud();
		enterMenu();
	</script>
</body>
</html>
