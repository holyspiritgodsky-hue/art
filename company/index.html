<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>华鑫投资企业库 · 观测未来</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="app">
		<header class="topbar">
			<div class="topbar-brand">
				<div class="earth" id="earth"></div>
				<div class="titleline"><h1>华鑫创投</h1><p class="subtitle">观测企业未来</p></div>
			</div>
			<div class="top-actions">
				<button class="btn" id="videoButton" type="button">&#9654; 华鑫介绍</button>
				<div class="management">
					<button class="btn" id="managementButton" type="button" aria-haspopup="menu" aria-expanded="false">管理</button>
					<div class="management-menu" id="managementMenu" role="menu" hidden>
						<button id="exportButton" type="button" role="menuitem">导出重点清单</button>
						<button id="addButton" type="button" role="menuitem">新增企业</button>
					</div>
				</div>
			</div>
		</header>
		<p id="earthStatus" hidden role="status"></p>

		<div class="workspace">
			<section class="panel list-panel">
				<div class="section-head">
					<div><h2>企业机会池</h2></div>
					<div class="count-chip" id="resultCount">0 个项目</div>
				</div>
				<div class="filters">
					<input class="control search" id="searchInput" type="search" placeholder="搜索企业、产品、地区" aria-label="搜索企业、产品、地区" />
					<div id="sectorOptionsBar" hidden></div>
				</div>
				<div class="table-wrap">
					<table>
						<thead><tr><th>企业 / 简介</th><th>行业</th><th>企业代表</th><th>重点</th><th>行动</th></tr></thead>
						<tbody id="companyRows"></tbody>
					</table>
				</div>
			</section>

			<aside class="panel detail-panel" id="detailPanel" aria-live="polite"></aside>
		</div>
		<section class="panel guestbook-panel" aria-labelledby="guestbookTitle">
			<div class="guestbook-head">
				<div><h2 id="guestbookTitle">用户留言</h2><p>留下你对企业项目或平台的看法。</p></div>
				<div class="guestbook-contact"><span>联系方式</span><a href="tel:15221056162">15221056162</a></div>
			</div>
			<form class="guestbook-form" id="guestbookForm">
				<input class="control" id="guestbookName" name="name" maxlength="30" placeholder="你的称呼（可选）" />
				<textarea class="control" id="guestbookMessage" name="message" maxlength="300" required placeholder="写下留言"></textarea>
				<button class="btn btn-primary" type="submit">发布留言</button>
			</form>
			<div class="guestbook-entries" id="guestbookEntries" aria-live="polite"></div>
		</section>
	</main>

	<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
		<form class="modal" id="companyForm">
			<div class="modal-head"><h2 id="modalTitle">新增企业</h2><button class="btn btn-small" id="closeModal" type="button" aria-label="关闭">关闭</button></div>
			<div class="form-grid">
				<div class="form-field"><label for="companyName">企业名称 *</label><input class="control" id="companyName" name="name" required maxlength="60" placeholder="如：XX农业科技" /></div>
				<div class="form-field"><label for="companySector">行业 *</label><input class="control" id="companySector" name="sector" required maxlength="30" list="sectorOptions" placeholder="如：中药材" /><datalist id="sectorOptions"></datalist></div>
				<div class="form-field"><label for="companyRegion">所在地区</label><input class="control" id="companyRegion" name="region" maxlength="40" placeholder="省 / 市" /></div>
				<div class="form-field"><label for="companyPath">主要合作方向</label><select class="control" id="companyPath" name="path"><option>供应链</option><option>投资 / 并购</option><option>产业联营</option></select></div>
				<div class="form-field full"><label for="companyProduct">核心产品 / 业务</label><textarea class="control" id="companyProduct" name="product" maxlength="240" placeholder="用一两句话说明产品、业务和已验证的能力"></textarea></div>
				<div class="form-field full"><label for="companyNeed">当前合作诉求</label><textarea class="control" id="companyNeed" name="need" maxlength="240" placeholder="具体希望对接什么资源或解决什么问题"></textarea></div>
				<div class="form-field"><label for="companyFundingAmount">融资金额（万元）</label><input class="control" id="companyFundingAmount" name="fundingAmount" type="number" min="0.1" step="0.1" placeholder="企业提出的金额" /></div>
				<div class="form-field"><label for="companyStatus">推进阶段</label><select class="control" id="companyStatus" name="status"><option>待验证</option><option>重点推进</option><option>持续观察</option><option>暂缓</option></select></div>
				<div class="form-field"><label for="companySource">信息来源 / 更新日期</label><input class="control" id="companySource" name="source" maxlength="80" placeholder="企业访谈 · 2026-11-15" /></div>
				<fieldset class="form-field full potential-fields">
					<legend>手动潜力评估 · 不计入用户看好度</legend>
					<div class="form-hint">结合市场需求、增长空间、竞争优势和团队执行力审慎判断，缺少证据时不宜给高分。填写评分时，请同时填写依据、风险和资料日期；资料不足可全部留空。</div>
					<div class="form-grid">
						<div class="form-field"><label for="potentialScore">潜力评分（0–100）</label><input class="control" id="potentialScore" name="potentialScore" type="number" min="0" max="100" step="1" placeholder="待评估" /></div>
						<div class="form-field"><label for="potentialDate">资料日期</label><input class="control" id="potentialDate" name="potentialDate" type="date" /></div>
						<div class="form-field"><label for="potentialReason">看好理由与依据</label><textarea class="control" id="potentialReason" name="potentialReason" maxlength="500" placeholder="例如：订单、客户或交付记录"></textarea></div>
						<div class="form-field"><label for="potentialRisk">主要风险</label><textarea class="control" id="potentialRisk" name="potentialRisk" maxlength="500" placeholder="例如：待核实事项或经营风险"></textarea></div>
					</div>
				</fieldset>
				<div class="form-field"><label for="scoreBusiness">经营基础（0-100）</label><input class="control" id="scoreBusiness" name="scoreBusiness" type="number" min="0" max="100" placeholder="可留空" /></div>
				<div class="form-field"><label for="scoreEvidence">信息可信度（0-100）</label><input class="control" id="scoreEvidence" name="scoreEvidence" type="number" min="0" max="100" placeholder="可留空" /></div>
				<div class="form-field"><label for="scoreNeed">需求清晰度（0-100）</label><input class="control" id="scoreNeed" name="scoreNeed" type="number" min="0" max="100" placeholder="可留空" /></div>
				<div class="form-field"><label for="scoreReady">对接准备度（0-100）</label><input class="control" id="scoreReady" name="scoreReady" type="number" min="0" max="100" placeholder="可留空" /></div>
				<div class="form-field full"><div class="form-hint">新增企业先以待验证信息入库。评分仅为机会筛选参考，不是投资评级。新增内容保存在当前浏览器。</div></div>
			</div>
			<div class="modal-actions"><button class="btn" id="cancelModal" type="button">取消</button><button class="btn btn-primary" type="submit">保存企业</button></div>
		</form>
	</div>
	<div class="modal-backdrop" id="videoBackdrop" role="dialog" aria-modal="true" aria-labelledby="videoTitle">
		<section class="modal video-modal">
			<div class="modal-head"><h2 id="videoTitle">华鑫集团助力好企业走出来</h2><button class="btn btn-small" id="closeVideo" type="button" aria-label="关闭视频">关闭</button></div>
			<a class="video-poster" href="https://www.bilibili.com/video/BV1XHsE6TESb/" target="_blank" rel="noreferrer" aria-label="在哔哩哔哩观看：华鑫集团助力好企业走出来">
				<img src="https://i2.hdslb.com/bfs/archive/69af058d03d339feda9bd3a6c54b56d7b0a206be.jpg" alt="华鑫集团助力好企业走出来视频封面" loading="lazy" />
				<span class="video-play" aria-hidden="true">&#9654;</span>
				<span class="video-poster-title">华鑫集团助力好企业走出来 · 00:57</span>
			</a>
			<div class="video-footer"><span>视频来源：哔哩哔哩 · 点击封面将在新标签页播放</span><a class="btn btn-small" href="https://www.bilibili.com/video/BV1XHsE6TESb/" target="_blank" rel="noreferrer">在哔哩哔哩打开</a></div>
		</section>
	</div>
	<div class="toast" id="toast" role="status"></div>

	<script src="heroes.js"></script>
	<script src="app.js"></script>
	<script src="globe/globe.bundle.js?v=11" onerror="document.getElementById('earth').classList.add('earth-fallback'); document.getElementById('earthStatus').textContent = '地球程序加载失败；行业筛选仍可使用。';"></script>
</body>
</html>
