<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>华鑫投资储备库 · 让好企业走出来</title>
	<style>
		:root {
			color-scheme: dark;
			--ink: #050816;
			--panel: #0b1120;
			--panel-soft: #111a31;
			--cyan: #59f3ff;
			--red: #ff5d7d;
			--amber: #ffcb57;
			--lime: #53f0a2;
			--line: rgba(255, 255, 255, .09);
			--muted: #8d9ab4;
			--text: #e8eef9;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			color: var(--text);
			font-family: "Segoe UI Variable", "Microsoft YaHei UI", sans-serif;
			background-color: var(--ink);
			background-image:
				radial-gradient(circle at 5% 0%, rgba(89,243,255,.13), transparent 25rem),
				radial-gradient(circle at 96% 8%, rgba(255,93,125,.09), transparent 24rem),
				linear-gradient(rgba(120,154,255,.045) 1px, transparent 1px),
				linear-gradient(90deg, rgba(120,154,255,.045) 1px, transparent 1px);
			background-size: auto, auto, 36px 36px, 36px 36px;
		}
		button, input, select, textarea { font: inherit; }
		button { cursor: pointer; }
		button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
		.app { width: min(1500px, 100%); margin: 0 auto; padding: 28px clamp(16px, 3vw, 40px) 48px; }
		.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
		.brandline { display: flex; align-items: center; gap: 9px; color: var(--cyan); font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
		.signal { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 14px var(--lime); }
		h1 { margin: 9px 0 7px; color: #fff; font-size: clamp(26px, 4vw, 42px); line-height: 1.15; }
		.subtitle { margin: 0; color: #a7b3c9; font-size: 14px; line-height: 1.7; }
		.top-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 9px; }
		.btn { min-height: 40px; padding: 9px 14px; color: #dce5f4; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.055); transition: .18s ease; }
		.btn:hover { border-color: rgba(89,243,255,.42); background: rgba(89,243,255,.1); }
		.btn-primary { color: #071018; border-color: transparent; background: var(--cyan); font-weight: 750; }
		.btn-primary:hover { background: #8af7ff; }
		.btn-small { min-height: 32px; padding: 6px 10px; font-size: 12px; }
		.panel { border: 1px solid var(--line); border-radius: 12px; background: linear-gradient(145deg, rgba(12,19,37,.94), rgba(7,12,25,.94)); box-shadow: 0 20px 70px rgba(0,0,0,.24); }
		.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
		.metric { min-height: 98px; padding: 16px 18px; }
		.metric-label { color: var(--muted); font-size: 12px; }
		.metric-value { margin-top: 9px; color: #fff; font-size: 28px; font-weight: 750; font-variant-numeric: tabular-nums; }
		.metric-note { margin-top: 3px; color: #74839f; font-size: 11px; }
		.workspace { display: grid; grid-template-columns: minmax(0, 1.24fr) minmax(360px, .76fr); gap: 14px; align-items: start; }
		.list-panel, .detail-panel { padding: 18px; }
		.section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
		.section-kicker { color: var(--cyan); font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
		h2 { margin: 5px 0 0; color: #fff; font-size: 19px; }
		.count-chip, .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; color: #c5d0e3; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.045); font-size: 11px; white-space: nowrap; }
		.filters { display: grid; grid-template-columns: minmax(150px, 1fr) repeat(3, minmax(110px, .6fr)); gap: 8px; margin-bottom: 12px; }
		.control { width: 100%; min-height: 38px; padding: 8px 10px; color: #e5ecf7; border: 1px solid rgba(255,255,255,.11); border-radius: 7px; background: #090f1d; }
		.control::placeholder { color: #75839b; }
		.table-wrap { overflow: auto; border: 1px solid rgba(255,255,255,.065); border-radius: 9px; }
		table { width: 100%; border-collapse: collapse; text-align: left; }
		th { padding: 10px 11px; color: #7888a3; background: rgba(255,255,255,.025); font-size: 10px; font-weight: 650; letter-spacing: .08em; white-space: nowrap; }
		td { padding: 12px 11px; border-top: 1px solid rgba(255,255,255,.055); color: #c8d2e3; font-size: 12px; vertical-align: middle; }
		tr.project-row { cursor: pointer; transition: background .16s ease; }
		tr.project-row:hover, tr.project-row.active { background: rgba(89,243,255,.055); }
		.company-name { color: #f5f8ff; font-size: 13px; font-weight: 700; }
		.company-sub { margin-top: 4px; color: #71809a; font-size: 10px; }
		.score-pill { display: inline-flex; min-width: 39px; justify-content: center; padding: 5px 8px; border: 1px solid rgba(89,243,255,.24); border-radius: 6px; color: var(--cyan); background: rgba(89,243,255,.08); font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums; }
		.score-pill.mid { color: var(--amber); border-color: rgba(255,203,87,.23); background: rgba(255,203,87,.07); }
		.score-pill.low { color: #b7c3d7; border-color: rgba(255,255,255,.12); background: rgba(255,255,255,.04); }
		.status { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; border: 1px solid transparent; border-radius: 5px; font-size: 10px; white-space: nowrap; }
		.status-focus { color: #a9f4d0; border-color: rgba(83,240,162,.2); background: rgba(83,240,162,.08); }
		.status-check { color: #ffe29a; border-color: rgba(255,203,87,.2); background: rgba(255,203,87,.07); }
		.status-watch { color: #bdc8dc; border-color: rgba(189,200,220,.15); background: rgba(255,255,255,.035); }
		.status-hold { color: #ffb1c1; border-color: rgba(255,93,125,.2); background: rgba(255,93,125,.07); }
		.row-star { padding: 2px 4px; color: #7d8ba3; border: 0; background: none; font-size: 16px; }
		.row-star.on { color: var(--amber); }
		.empty { padding: 36px 14px; color: var(--muted); text-align: center; font-size: 13px; }
		.detail-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
		.detail-name { margin: 4px 0 5px; color: white; font-size: 22px; font-weight: 750; }
		.detail-meta { color: var(--muted); font-size: 12px; line-height: 1.65; }
		.detail-actions { display: flex; gap: 6px; }
		.score-overview { display: grid; grid-template-columns: 102px 1fr; gap: 16px; align-items: center; margin: 18px 0 16px; padding: 14px; border: 1px solid rgba(89,243,255,.14); border-radius: 9px; background: linear-gradient(110deg, rgba(89,243,255,.08), rgba(255,203,87,.035)); }
		.score-ring { --score: 0; display: grid; width: 94px; aspect-ratio: 1; place-items: center; border-radius: 50%; background: conic-gradient(var(--cyan) calc(var(--score) * 1%), rgba(255,255,255,.09) 0); position: relative; }
		.score-ring::before { position: absolute; inset: 7px; border-radius: 50%; background: #0b1222; content: ""; }
		.score-ring-inner { position: relative; text-align: center; }
		.score-number { color: #fff; font-size: 28px; font-weight: 800; line-height: 1; }
		.score-caption { margin-top: 4px; color: #91a1bb; font-size: 9px; }
		.score-explain { color: #aab8cf; font-size: 12px; line-height: 1.75; }
		.score-explain strong { color: var(--cyan); }
		.block-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 10px; color: #eaf0fb; font-size: 12px; font-weight: 700; }
		.dim-row { display: grid; grid-template-columns: 102px 1fr 30px; gap: 9px; align-items: center; margin: 10px 0; color: #9aa8bf; font-size: 11px; }
		.bar-track { height: 6px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.08); }
		.bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #39d9e8, #64f2c0); }
		.dim-value { color: #eaf0fb; text-align: right; font-variant-numeric: tabular-nums; }
		.opportunity-box { padding: 12px; border: 1px solid rgba(255,203,87,.16); border-radius: 8px; background: rgba(255,203,87,.045); }
		.opportunity-label { color: var(--amber); font-size: 10px; font-weight: 700; letter-spacing: .08em; }
		.opportunity-text { margin-top: 6px; color: #d4ddeb; font-size: 12px; line-height: 1.7; }
		.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
		.info-item { min-height: 60px; padding: 9px 10px; border: 1px solid rgba(255,255,255,.065); border-radius: 7px; background: rgba(255,255,255,.025); }
		.info-label { color: #7888a3; font-size: 10px; }
		.info-value { margin-top: 5px; color: #dbe4f3; font-size: 11px; line-height: 1.45; }
		.detail-footer { margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--line); color: #76849c; font-size: 10px; line-height: 1.6; }
		.theory { margin-top: 14px; border: 1px solid rgba(89,243,255,.17); border-radius: 8px; background: rgba(89,243,255,.035); }
		.theory summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 12px; color: #e8f3fb; cursor: pointer; list-style: none; }
		.theory summary::-webkit-details-marker { display: none; }
		.theory-title { font-size: 12px; font-weight: 700; }
		.theory-subtitle { margin-top: 3px; color: #b7c5d9; font-size: 11px; }
		.theory-chevron { color: var(--cyan); transition: transform .18s ease; }
		.theory[open] .theory-chevron { transform: rotate(180deg); }
		.theory-body { display: grid; gap: 11px; padding: 0 13px 13px; }
		.theory-formula { padding: 11px; color: #d3f8f8; border: 1px solid rgba(89,243,255,.18); border-radius: 6px; background: rgba(89,243,255,.06); font-size: 13px; line-height: 1.8; }
		.theory-item { color: #d0d9e8; font-size: 13px; line-height: 1.8; }
		.theory-item strong { color: #fff; }
		.theory-note { padding-top: 9px; color: #b2bfd2; border-top: 1px solid rgba(255,255,255,.11); font-size: 12px; line-height: 1.75; }
		.modal-backdrop { position: fixed; z-index: 20; inset: 0; display: none; place-items: center; padding: 18px; background: rgba(1,4,12,.76); backdrop-filter: blur(7px); }
		.modal-backdrop.open { display: grid; }
		.modal { width: min(620px, 100%); max-height: min(90vh, 820px); overflow: auto; padding: 20px; border: 1px solid rgba(255,255,255,.13); border-radius: 12px; background: #0b1222; box-shadow: 0 25px 100px rgba(0,0,0,.6); }
		.video-modal { width: min(920px, 100%); }
		.video-poster { position: relative; display: block; overflow: hidden; aspect-ratio: 16 / 9; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; background: #02040a; }
		.video-poster img { width: 100%; height: 100%; object-fit: cover; }
		.video-poster::after { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(2,5,12,.58), transparent 55%); content: ""; }
		.video-play { position: absolute; z-index: 1; inset: 50% auto auto 50%; display: grid; width: 56px; height: 56px; place-items: center; border: 1px solid rgba(255,255,255,.55); border-radius: 50%; color: white; background: rgba(3,10,20,.62); font-size: 19px; transform: translate(-50%, -50%); }
		.video-poster-title { position: absolute; z-index: 1; right: 16px; bottom: 14px; left: 16px; color: white; font-size: 14px; font-weight: 700; text-shadow: 0 1px 5px #000; }
		.video-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; color: #8998b0; font-size: 11px; }
		.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
		.modal-head h2 { margin: 0; }
		.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
		.form-field { display: grid; gap: 6px; }
		.form-field.full { grid-column: 1 / -1; }
		.form-field label { color: #aab8cf; font-size: 11px; }
		.form-field textarea { min-height: 72px; resize: vertical; }
		.form-hint { color: #77859d; font-size: 10px; line-height: 1.55; }
		.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
		.toast { position: fixed; z-index: 30; right: 20px; bottom: 20px; max-width: min(420px, calc(100vw - 40px)); padding: 11px 15px; color: #e9f4ff; border: 1px solid rgba(89,243,255,.25); border-radius: 8px; background: #101b2c; box-shadow: 0 10px 40px rgba(0,0,0,.35); font-size: 12px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease; }
		.toast.show { opacity: 1; transform: translateY(0); }
		@media (max-width: 1000px) { .workspace { grid-template-columns: minmax(0, 1fr); } .detail-panel { order: -1; } }
		@media (max-width: 680px) {
			.app { padding: 18px 13px 30px; }
			.topbar { display: block; }
			.top-actions { justify-content: flex-start; margin-top: 15px; }
			.metrics { grid-template-columns: 1fr 1fr; gap: 8px; }
			.metric { min-height: 86px; padding: 12px; }
			.metric-value { font-size: 24px; }
			.filters { grid-template-columns: 1fr 1fr; }
			.filters .search { grid-column: 1 / -1; }
			.list-panel, .detail-panel { padding: 13px; }
			.table-wrap { overflow: visible; border: 0; }
			table, tbody { display: block; }
			thead { display: none; }
			tr.project-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; margin-bottom: 8px; padding: 11px; border: 1px solid rgba(255,255,255,.08); border-radius: 8px; background: rgba(255,255,255,.025); }
			td { padding: 0; border: 0; }
			td:nth-child(2) { grid-column: 1; grid-row: 2; }
			td:nth-child(3) { grid-column: 2; grid-row: 1; }
			td:nth-child(4) { grid-column: 1; grid-row: 3; margin-top: 4px; }
			td:nth-child(5) { grid-column: 2; grid-row: 2; justify-self: end; }
			td:nth-child(6) { grid-column: 2; grid-row: 3; justify-self: end; }
			.score-overview { grid-template-columns: 82px 1fr; gap: 12px; }
			.score-ring { width: 78px; }
			.score-number { font-size: 24px; }
			.dim-row { grid-template-columns: 88px 1fr 26px; }
		}
	</style>
</head>
<body>
	<main class="app">
		<header class="topbar">
			<div>
				<div class="brandline"><span class="signal"></span> HUAXIN · ENTERPRISE RESERVE</div>
				<h1>华鑫投资储备库</h1>
				<p class="subtitle">让好企业走出来</p>
			</div>
			<div class="top-actions">
				<button class="btn" id="videoButton" type="button">&#9654; 华鑫介绍</button>
				<button class="btn" id="exportButton" type="button">导出重点清单</button>
				<button class="btn btn-primary" id="addButton" type="button">+ 新增企业</button>
			</div>
		</header>

		<section class="metrics" aria-label="企业储备概览">
			<div class="panel metric"><div class="metric-label">企业储备</div><div class="metric-value" id="metricTotal">0</div><div class="metric-note">当前筛选范围内的企业</div></div>
			<div class="panel metric"><div class="metric-label">重点推进</div><div class="metric-value" id="metricFocus">0</div><div class="metric-note">建议优先补充材料并研判</div></div>
			<div class="panel metric"><div class="metric-label">待验证</div><div class="metric-value" id="metricCheck">0</div><div class="metric-note">关键信息尚待核验</div></div>
			<div class="panel metric"><div class="metric-label">重点清单</div><div class="metric-value" id="metricWatch">0</div><div class="metric-note">手动标记，方便后续跟进</div></div>
		</section>

		<div class="workspace">
			<section class="panel list-panel">
				<div class="section-head">
					<div><div class="section-kicker">Opportunity radar</div><h2>企业机会池</h2></div>
					<div class="count-chip" id="resultCount">0 个项目</div>
				</div>
				<div class="filters">
					<input class="control search" id="searchInput" type="search" placeholder="搜索企业、产品、诉求" aria-label="搜索企业、产品、诉求" />
					<select class="control" id="sectorFilter" aria-label="按行业筛选"><option value="">全部行业</option></select>
					<select class="control" id="pathFilter" aria-label="按合作方向筛选">
						<option value="">全部合作方向</option><option>供应链</option><option>投资 / 并购</option><option>产业联营</option>
					</select>
					<select class="control" id="statusFilter" aria-label="按推进阶段筛选">
						<option value="">全部阶段</option><option>重点推进</option><option>待验证</option><option>持续观察</option><option>暂缓</option>
					</select>
				</div>
				<div class="table-wrap">
					<table>
						<thead><tr><th>企业 / 方向</th><th>行业</th><th>机会观察分</th><th>合作诉求</th><th>阶段</th><th>重点</th></tr></thead>
						<tbody id="companyRows"></tbody>
					</table>
				</div>
			</section>

			<aside class="panel detail-panel" id="detailPanel" aria-live="polite"></aside>
		</div>
	</main>

	<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
		<form class="modal" id="companyForm">
			<div class="modal-head"><h2 id="modalTitle">新增企业</h2><button class="btn btn-small" id="closeModal" type="button" aria-label="关闭">关闭</button></div>
			<div class="form-grid">
				<div class="form-field"><label for="companyName">企业名称 *</label><input class="control" id="companyName" name="name" required maxlength="60" placeholder="如：XX农业科技" /></div>
				<div class="form-field"><label for="companySector">行业 *</label><input class="control" id="companySector" name="sector" required maxlength="30" list="sectorOptions" placeholder="如：中药材" /><datalist id="sectorOptions"></datalist></div>
				<div class="form-field"><label for="companyRegion">所在地区</label><input class="control" id="companyRegion" name="region" maxlength="40" placeholder="省 / 市" /></div>
				<div class="form-field"><label for="companyPath">主要合作方向</label><select class="control" id="companyPath" name="path"><option>供应链</option><option>投资 / 并购</option><option>产业联营</option></select></div>
				<div class="form-field full"><label for="companyProduct">核心产品 / 业务</label><textarea class="control" id="companyProduct" name="product" maxlength="240" placeholder="用一两句话说明产品、业务和已验证的能力"></textarea></div>
				<div class="form-field full"><label for="companyNeed">当前合作诉求</label><textarea class="control" id="companyNeed" name="need" maxlength="240" placeholder="具体希望对接什么资源或解决什么问题"></textarea></div>
				<div class="form-field"><label for="companyStatus">推进阶段</label><select class="control" id="companyStatus" name="status"><option>待验证</option><option>重点推进</option><option>持续观察</option><option>暂缓</option></select></div>
				<div class="form-field"><label for="companySource">信息来源 / 更新日期</label><input class="control" id="companySource" name="source" maxlength="80" placeholder="企业访谈 · 2026-11-15" /></div>
				<div class="form-field"><label for="scoreBusiness">经营基础（0-100）</label><input class="control" id="scoreBusiness" name="scoreBusiness" type="number" min="0" max="100" placeholder="可留空" /></div>
				<div class="form-field"><label for="scoreEvidence">信息可信度（0-100）</label><input class="control" id="scoreEvidence" name="scoreEvidence" type="number" min="0" max="100" placeholder="可留空" /></div>
				<div class="form-field"><label for="scoreNeed">需求清晰度（0-100）</label><input class="control" id="scoreNeed" name="scoreNeed" type="number" min="0" max="100" placeholder="可留空" /></div>
				<div class="form-field"><label for="scoreReady">对接准备度（0-100）</label><input class="control" id="scoreReady" name="scoreReady" type="number" min="0" max="100" placeholder="可留空" /></div>
				<div class="form-field full"><div class="form-hint">新增企业先以待验证信息入库。评分仅为机会筛选参考，不是投资评级。新增内容保存在当前浏览器。</div></div>
			</div>
			<div class="modal-actions"><button class="btn" id="cancelModal" type="button">取消</button><button class="btn btn-primary" type="submit">保存企业</button></div>
		</form>
	</div>
	<div class="modal-backdrop" id="videoBackdrop" role="dialog" aria-modal="true" aria-labelledby="videoTitle">
		<section class="modal video-modal">

		function loadCompanies() {
			try {
				const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
				if (!Array.isArray(saved) || !saved.length) return structuredClone(demoCompanies);
				const savedIds = new Set(saved.map((company) => company.id));
				return [...saved, ...demoCompanies.filter((company) => !savedIds.has(company.id)).map((company) => structuredClone(company))];
			} catch {
				return structuredClone(demoCompanies);
			}
		}

		function saveCompanies() {
			localStorage.setItem(STORAGE_KEY, JSON.stringify(companies));
		}

		function scoreClass(score) {
			return score >= 75 ? '' : score >= 60 ? 'mid' : 'low';
		}

		function getScore(company) {
			if (company.assessed === false) return null;
			if (Array.isArray(company.dims) && company.dims.length) {
				return Math.round(company.dims.reduce((sum, item) => sum + Number(item[1] || 0), 0) / company.dims.length);
			}
			return Number.isFinite(Number(company.score)) ? Number(company.score) : null;
		}

		function filteredCompanies() {
			const query = document.getElementById('searchInput').value.trim().toLowerCase();
			const sector = document.getElementById('sectorFilter').value;
			const path = document.getElementById('pathFilter').value;
			const status = document.getElementById('statusFilter').value;
			return companies.filter((company) => {
				const searchable = [company.name, company.sector, company.region, company.product, company.need, company.path].join(' ').toLowerCase();
				return (!query || searchable.includes(query)) && (!sector || company.sector === sector) && (!path || company.path === path) && (!status || company.status === status);
			}).sort((a, b) => (getScore(b) ?? -1) - (getScore(a) ?? -1));
		}

		function updateMetrics(records) {
			document.getElementById('metricTotal').textContent = records.length;
			document.getElementById('metricFocus').textContent = records.filter((item) => item.status === '重点推进').length;
			document.getElementById('metricCheck').textContent = records.filter((item) => item.status === '待验证').length;
			document.getElementById('metricWatch').textContent = companies.filter((item) => item.watch).length;
			document.getElementById('resultCount').textContent = `${records.length} 个项目`;
		}

		function renderList() {
			const records = filteredCompanies();
			updateMetrics(records);
			const tbody = document.getElementById('companyRows');

				return;
			}
			tbody.innerHTML = records.map((company) => `
				<tr class="project-row ${company.id === selectedId ? 'active' : ''}" data-id="${escapeHtml(company.id)}" tabindex="0">
					<td><div class="company-name">${escapeHtml(company.name)}</div><div class="company-sub">${escapeHtml(company.region || '地区待补')} · ${escapeHtml(company.product || '业务描述待补')}</div></td>

					<td><span class="status ${statusClass[company.status] || 'status-watch'}">${escapeHtml(company.status || '待验证')}</span></td>

				</tr>`).join('');
			tbody.querySelectorAll('.project-row').forEach((row) => {
				const selectRow = (event) => {
					if (event.target.closest('[data-star]')) return;
					selectedId = row.dataset.id;
					renderList();
					renderDetail();
				};
				row.addEventListener('click', selectRow);
				row.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectRow(event); } });
			});
			tbody.querySelectorAll('[data-star]').forEach((button) => button.addEventListener('click', (event) => {

				const company = companies.find((item) => item.id === button.dataset.star);

				saveCompanies();
				renderList();
			}));
			if (!records.some((item) => item.id === selectedId)) selectedId = records[0]?.id || '';
			renderDetail();
		}

				${dims.map(([label, value]) => `<div class="dim-row"><span>${escapeHtml(label)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0, Math.min(100, Number(value)))}%"></div></div><span class="dim-value">${Number(value)}</span></div>`).join('') || '<div class="detail-meta">暂未填写分项观察。点击“编辑”后可补充分数。</div>'}
				<details class="theory">
					<summary><div><div class="theory-title">理论依据与评分口径</div><div class="theory-subtitle">解释综合分如何形成，以及每项分数看什么</div></div><span class="theory-chevron">⌄</span></summary>
					<div class="theory-body">
						<div class="theory-formula"><strong>综合观察分 S = (经营基础 B + 信息可信度 E + 需求清晰度 N + 对接准备度 R) ÷ 4</strong><br>四项均为 0–100 分，当前原型采用等权平均。</div>
						<div class="theory-item"><strong>① 经营基础 B</strong>：看产品或服务是否有真实需求、经营是否持续、客户与交付是否稳定。行业指标要分别判断，例如农业看产量与品控，中药材看来源、检测与加工，康养看客群、运营和持续服务能力。</div>
						<div class="theory-item"><strong>② 信息可信度 E</strong>：看关键事实是否有材料支持、来源是否可靠且足够新，并能否交叉核验。企业自述可以作为线索，但未经核实的订单、客户、资质或经营数据不能当作已证实事实。</div>
						<div class="theory-item"><strong>③ 需求清晰度 N</strong>：看合作目标是否具体，是否明确需要采购、融资、并购、运营联营或其他资源，以及股东意愿、时间安排和目标对象是否清楚。</div>
						<div class="theory-item"><strong>④ 对接准备度 R</strong>：看企业资料、决策人、合规条件和下一步安排是否齐备，能否进入定向沟通、样品验证、尽调或试点。</div>
						<div class="theory-note">分数用于企业池初筛、补充信息和确定跟进优先级，不代表估值、投资评级、融资成功率或收益预测。不同产业不能只按总分横向排名；需结合行业特点、证据来源和更新时间判断，实际使用前应按真实项目校准评分标准。</div>
					</div>
				</details>
				<div class="detail-footer">信息来源：${escapeHtml(company.source || '未记录')} · 更新：${escapeHtml(company.updated || '待补')}<br>分数是内部初筛示意，需根据证据更新；不能替代尽调或专业投资判断。</div>`;
			panel.querySelector('#detailStar').addEventListener('click', () => {
				company.watch = !company.watch;
				saveCompanies();
				renderList();
			});
			panel.querySelector('#detailEdit').addEventListener('click', () => openModal(company.id));
		}

		function escapeHtml(value) {
			return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
		}

		function refreshSectorOptions() {
			const sectors = [...new Set(companies.map((item) => item.sector).filter(Boolean))].sort();
			const select = document.getElementById('sectorFilter');
			const current = select.value;
			select.innerHTML = '<option value="">全部行业</option>' + sectors.map((sector) => `<option>${escapeHtml(sector)}</option>`).join('');
			if (sectors.includes(current)) select.value = current;
			document.getElementById('sectorOptions').innerHTML = sectors.map((sector) => `<option value="${escapeHtml(sector)}"></option>`).join('');
		}

		function showToast(message) {
			const toast = document.getElementById('toast');
			toast.textContent = message;
			toast.classList.add('show');
			clearTimeout(toastTimer);
			toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
		}

		function openModal(id = '') {
			const form = document.getElementById('companyForm');
			form.reset();
			editingId = id;
			const company = companies.find((item) => item.id === id);
			document.getElementById('modalTitle').textContent = company ? '编辑企业' : '新增企业';
			form.querySelector('[type="submit"]').textContent = company ? '保存修改' : '保存企业';
			if (company) {
				form.elements.name.value = company.name || '';
				form.elements.sector.value = company.sector || '';
				form.elements.region.value = company.region || '';
				form.elements.path.value = company.path || '供应链';
				form.elements.product.value = company.product || '';
				form.elements.need.value = company.need || '';
				form.elements.status.value = company.status || '待验证';
				form.elements.source.value = company.source || '';
				const values = Object.fromEntries((company.dims || []).map(([label, value]) => [label, value]));
				form.elements.scoreBusiness.value = values['经营基础'] ?? '';
				form.elements.scoreEvidence.value = values['信息可信度'] ?? '';
				form.elements.scoreNeed.value = values['需求清晰度'] ?? '';
				form.elements.scoreReady.value = values['对接准备度'] ?? '';
			}
			document.getElementById('modalBackdrop').classList.add('open');
			document.getElementById('companyName').focus();
		}

		function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }

		function openVideo() {
			document.getElementById('videoBackdrop').classList.add('open');
		}

		function closeVideo() {
			document.getElementById('videoBackdrop').classList.remove('open');
		}

		function exportWatchlist() {
			const records = companies.filter((item) => item.watch);
			if (!records.length) {
				showToast('还没有重点企业。先点企业行末的星标，再导出清单。');
				return;
			}
			const headers = ['企业名称', '行业', '地区', '机会观察分', '合作方向', '推进阶段', '核心业务', '合作诉求', '机会假设', '下一步', '信息来源', '更新日期'];
			const rows = records.map((item) => [item.name, item.sector, item.region, getScore(item), item.path, item.status, item.product, item.need, item.thesis, item.next, item.source, item.updated]);
			const csv = '\ufeff' + [headers, ...rows].map((row) => row.map((field) => `"${String(field ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
			const link = document.createElement('a');
			link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
			link.download = `企业重点清单_${new Date().toISOString().slice(0, 10)}.csv`;
			link.click();
			URL.revokeObjectURL(link.href);
			showToast(`已导出 ${records.length} 家重点企业。`);
		}

		document.getElementById('addButton').addEventListener('click', openModal);
		document.getElementById('videoButton').addEventListener('click', openVideo);
		document.getElementById('closeVideo').addEventListener('click', closeVideo);
		document.getElementById('closeModal').addEventListener('click', closeModal);
		document.getElementById('cancelModal').addEventListener('click', closeModal);
		document.getElementById('exportButton').addEventListener('click', exportWatchlist);
		document.getElementById('modalBackdrop').addEventListener('click', (event) => { if (event.target.id === 'modalBackdrop') closeModal(); });
		document.getElementById('videoBackdrop').addEventListener('click', (event) => { if (event.target.id === 'videoBackdrop') closeVideo(); });
		document.addEventListener('keydown', (event) => { if (event.key === 'Escape') { closeModal(); closeVideo(); } });
		['searchInput', 'sectorFilter', 'pathFilter', 'statusFilter'].forEach((id) => document.getElementById(id).addEventListener(id === 'searchInput' ? 'input' : 'change', renderList));
		document.getElementById('companyForm').addEventListener('submit', (event) => {
			event.preventDefault();
			const form = new FormData(event.currentTarget);
			const name = String(form.get('name') || '').trim();
			const sector = String(form.get('sector') || '').trim();
			if (!name || !sector) return;
			const today = new Date().toISOString().slice(0, 10);
			const scoreFields = ['scoreBusiness', 'scoreEvidence', 'scoreNeed', 'scoreReady'].map((key) => String(form.get(key) || '').trim());
			const enteredScores = scoreFields.filter(Boolean).length;
			if (enteredScores > 0 && enteredScores < scoreFields.length) {
				showToast('请填写全部四项分数，或全部留空保持“待评估”。');
				return;
			}
			const dims = enteredScores === scoreFields.length
				? [['经营基础', Number(scoreFields[0])], ['信息可信度', Number(scoreFields[1])], ['需求清晰度', Number(scoreFields[2])], ['对接准备度', Number(scoreFields[3])]]
				: [];
			if (dims.some(([, value]) => !Number.isFinite(value) || value < 0 || value > 100)) {
				showToast('分数需在 0 到 100 之间。');
				return;
			}
			const current = companies.find((item) => item.id === editingId);
			const company = {
				...(current || {}),
				id: current?.id || `local-${Date.now()}`, name, sector,
				region: String(form.get('region') || '').trim(),
				path: String(form.get('path') || '供应链'),
				product: String(form.get('product') || '').trim(),
				need: String(form.get('need') || '').trim(),
				status: String(form.get('status') || '待验证'),
				score: dims.length ? Math.round(dims.reduce((sum, item) => sum + item[1], 0) / dims.length) : null,
				dims, assessed: Boolean(dims.length),
				thesis: current?.thesis || '记录尚未形成机会假设，请访谈企业并核验核心信息后再更新。',
				next: current?.next || '补充经营数据、股东诉求和可验证材料。',
				source: String(form.get('source') || '手动录入').trim(), updated: today, watch: current?.watch || false,
			};
			if (current) companies = companies.map((item) => item.id === current.id ? company : item);
			else companies.unshift(company);
			selectedId = company.id;
			saveCompanies();
			refreshSectorOptions();
			document.getElementById('searchInput').value = '';
			document.getElementById('sectorFilter').value = '';
			document.getElementById('pathFilter').value = '';
			document.getElementById('statusFilter').value = '';
			closeModal();
			renderList();
			showToast(current ? '企业信息已更新并保存到本机。' : '企业已保存到本机，可稍后补充分项评分。');
		});

		refreshSectorOptions();
		if (companies.length && !companies.some((item) => item.id === selectedId)) selectedId = companies[0].id;
		renderList();
	</script>
</body>
</html>
